function AccessReasonModal({ fs, row, action, categories, minChars, minutes, lapsed, onCancel, onSubmit }) {
  const [category, setCategory] = useState(categories[0].value);
  const [reason, setReason] = useState('');
  const [err, setErr] = useState(lapsed ? 'The reason you gave has lapsed — give it again.' : null);
  const [busy, setBusy] = useState(false);
  const verb = { view: 'View', pdf: 'Download the PDF of', records: 'Download the records of' }[action];
  const submit = async () => {
    const text = reason.trim();
    if (text.length < minChars) { setErr(`Say why in a sentence — at least ${minChars} characters. It is recorded.`); return; }
    setBusy(true); setErr(null);
    try { await onSubmit({ category, reason: text }); }
    catch (e) { setErr(e.message); setBusy(false); }
  };
  const field = { width: '100%', boxSizing: 'border-box', padding: '8px 10px', borderRadius: 4, fontSize: fs(12),
                  fontFamily: 'var(--sans)', background: 'var(--bg)', color: 'var(--text)', border: '1px solid var(--border)' };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 50,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <div role="dialog" aria-label="Reason for viewing" style={{ width: '100%', maxWidth: 460, padding: 20, borderRadius: 8,
                    background: 'var(--surface)', border: '1px solid var(--border)' }}>
        <div style={{ fontSize: fs(14), fontFamily: 'var(--sans)', marginBottom: 6 }}>{verb} “{row.name}”</div>
        <div style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)', lineHeight: 1.6, marginBottom: 12 }}>
          Owned by {row.owner.display_name || row.owner.email || 'another account'}. Read-only. What you fetch is recorded with
          your name, the time and this reason, where the other admin can see it. One reason covers this dialectic
          for {minutes} minutes.
        </div>
        <select value={category} onChange={e => setCategory(e.target.value)} style={{ ...field, marginBottom: 8 }}>
          {categories.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
        </select>
        <textarea rows={3} value={reason} autoFocus placeholder="Why — one sentence"
          onChange={e => { setReason(e.target.value); setErr(null); }} style={{ ...field, resize: 'vertical' }} />
        <div style={{ minHeight: 20, fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--deny)', margin: '6px 0' }}>{err}</div>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={onCancel} disabled={busy} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 4,
            color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10), padding: '6px 12px', letterSpacing: 1 }}>CANCEL</button>
          <button onClick={submit} disabled={busy} style={{ background: 'var(--accent)', border: 'none', borderRadius: 4, color: '#111',
            cursor: busy ? 'default' : 'pointer', fontSize: fs(10), padding: '6px 12px', letterSpacing: 1, opacity: busy ? 0.6 : 1 }}>
            {busy ? '…' : action === 'view' ? 'VIEW READ-ONLY' : 'DOWNLOAD'}</button>
        </div>
      </div>
    </div>
  );
}

// Deleting someone else's dialectic: a reason of its own (never the
// view's grant), the name typed back, and two log rows that outlive it.
function DeleteDialecticModal({ fs, row, categories, minChars, onCancel, onSubmit }) {
  const [category, setCategory] = useState(categories[0].value);
  const [reason, setReason] = useState('');
  const [typed, setTyped] = useState('');
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const ready = typed === row.name && (row.mine || reason.trim().length >= minChars);
  const submit = async () => {
    if (typed !== row.name) { setErr('Type the dialectic\'s name exactly as it is shown.'); return; }
    if (!row.mine && reason.trim().length < minChars) { setErr(`Say why in a sentence — at least ${minChars} characters. It is recorded.`); return; }
    setBusy(true); setErr(null);
    try { await onSubmit(row.mine ? {} : { category, reason: reason.trim() }); }
    catch (e) { setErr(e.message); setBusy(false); }
  };
  const field = { width: '100%', boxSizing: 'border-box', padding: '8px 10px', borderRadius: 4, fontSize: fs(12),
                  fontFamily: 'var(--sans)', background: 'var(--bg)', color: 'var(--text)', border: '1px solid var(--border)' };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 50,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <div role="dialog" aria-label="Delete a dialectic" style={{ width: '100%', maxWidth: 460, padding: 20, borderRadius: 8,
                    background: 'var(--surface)', border: '1px solid var(--deny)' }}>
        <div style={{ fontSize: fs(14), fontFamily: 'var(--sans)', marginBottom: 6, color: 'var(--deny)' }}>Delete “{row.name}”</div>
        <div style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)', lineHeight: 1.6, marginBottom: 12 }}>
          {row.mine ? 'Your own dialectic. ' : <>Owned by {row.owner.display_name || row.owner.email || 'another account'}. </>}
          This removes the dialectic and everything held about it, and cannot be undone — there is no undo and no bin.
          {!row.mine && <> The deletion is recorded with your name, the time and this reason, where the other admin can see it;
          the record stays after the dialectic is gone.</>}
        </div>
        {!row.mine && (
          <>
            <select value={category} onChange={e => setCategory(e.target.value)} style={{ ...field, marginBottom: 8 }}>
              {categories.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
            </select>
            <textarea rows={3} value={reason} autoFocus placeholder="Why — one sentence"
              onChange={e => { setReason(e.target.value); setErr(null); }} style={{ ...field, resize: 'vertical', marginBottom: 8 }} />
          </>
        )}
        <input value={typed} onChange={e => { setTyped(e.target.value); setErr(null); }} autoFocus={!!row.mine}
          placeholder={`Type the name to confirm: ${row.name}`} aria-label="Type the dialectic's name to confirm" style={field} />
        <div style={{ minHeight: 20, fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--deny)', margin: '6px 0' }}>{err}</div>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={onCancel} disabled={busy} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 4,
            color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10), padding: '6px 12px', letterSpacing: 1 }}>CANCEL</button>
          <button onClick={submit} disabled={busy || !ready} style={{ background: 'var(--deny)', border: 'none', borderRadius: 4, color: '#fff',
            cursor: busy || !ready ? 'default' : 'pointer', fontSize: fs(10), padding: '6px 12px', letterSpacing: 1, opacity: busy || !ready ? 0.5 : 1 }}>
            {busy ? '…' : 'DELETE FOR GOOD'}</button>
        </div>
      </div>
    </div>
  );
}

function ReadOnlyDialectic({ fs, view, busy, onPdf, onRecords, onDelete, onClose }) {
  const d = view.dialectic;
  const roleMap = { user: 'respondent', assistant: 'opponent' };
  const messages = (d.conversation || []).map(m => ({
    role: roleMap[m.role] || m.role,
    content: m.role === 'assistant' ? extractResponseText(m.content) : m.content,
  }));
  const side = v => Array.isArray(v) ? v.join(', ') : String(v || '');
  const seq = t => `${side(t.gamma)} |~ ${side(t.delta)}`;
  const openTensions = [...(d.tensions || []), ...(d.queued_tensions || [])];
  const label = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', margin: '12px 0 6px' };
  const item = { fontSize: fs(12), fontFamily: 'var(--sans)', lineHeight: 1.5, padding: '4px 0', borderTop: '1px solid var(--border)' };
  const button = { background: 'none', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)', cursor: 'pointer',
                   fontSize: fs(10), padding: '3px 10px', letterSpacing: 1, fontFamily: 'var(--mono)', opacity: busy ? 0.5 : 1 };
  const list = (title, rows, render) => (
    <div>
      <div style={label}>{title} · {rows.length}</div>
      {rows.length === 0 ? <div style={{ ...item, color: 'var(--text-muted)' }}>none</div>
        : rows.map((r, i) => <div key={i} style={item}>{render(r)}</div>)}
    </div>
  );
  return (
    <div style={{ borderRadius: 6, border: '1px solid var(--border)', background: 'var(--surface)', overflow: 'hidden' }}>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', padding: '8px 12px', background: 'var(--tension-bg, rgba(240,180,60,0.12))',
                    borderBottom: '1px solid var(--border)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>
        <span style={{ flex: 1 }}>
          <b>Read-only</b> · “{view.name}” · {view.mine ? 'your own dialectic'
            : <>owned by {view.owner.display_name || view.owner.email} · logged: {view.grant ? `${view.grant.category_label} — ${view.grant.reason}` : ''}</>}
        </span>
        <button style={button} disabled={busy} onClick={onPdf}>PDF</button>
        <button style={button} disabled={busy} onClick={onRecords} title="The raw records: state, transcript, turn log, state events, database dump">RECORDS</button>
        {onDelete && <button style={{ ...button, color: 'var(--deny)', borderColor: 'var(--deny)' }} disabled={busy} onClick={onDelete}
          title="Delete this dialectic for good — asks for a reason and the name">DELETE</button>}
        <button style={button} onClick={onClose}>CLOSE</button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1.7fr) minmax(0, 1fr)' }}>
        <div style={{ padding: 12, display: 'flex', flexDirection: 'column', gap: 10, maxHeight: '62vh', overflowY: 'auto',
                      borderRight: '1px solid var(--border)' }}>
          {messages.length === 0 && <div style={{ fontSize: fs(11), color: 'var(--text-muted)', fontFamily: 'var(--sans)' }}>No conversation yet.</div>}
          {messages.map((m, i) => <Message key={i} msg={m} fs={fs} />)}
        </div>
        <div style={{ padding: '0 12px 12px', maxHeight: '62vh', overflowY: 'auto' }}>
          {list('COMMITMENTS', d.commitments || [], x => x)}
          {list('DENIALS', d.denials || [], x => x)}
          {list('OPEN TENSIONS', openTensions, seq)}
          {list('IMPLICATIONS', d.implications || [], seq)}
          {list('CONTESTED', d.contested || [], seq)}
        </div>
      </div>
    </div>
  );
}

function AdminDialecticsTab({ fs }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [q, setQ] = useState('');
  const [kind, setKind] = useState('ordinary');
  const [sort, setSort] = useState('last');
  const [pane, setPane] = useState('list');
  const [gate, setGate] = useState(null);   // { row, action, lapsed }
  const [open, setOpen] = useState(null);   // the read-only view
  const [doomed, setDoomed] = useState(null); // the row a deletion is being confirmed for
  const [log, setLog] = useState(null);
  const [busy, setBusy] = useState(false);

  const load = async () => {
    try { setData(await api('/api/admin/dialectics')); setError(null); }
    catch (e) { setError(e.message); }
  };
  const loadLog = async () => {
    try { setLog((await api('/api/admin/access-log?limit=500')).entries); }
    catch (e) { setError(e.message); }
  };
  useEffect(() => { load(); }, []);
  useEffect(() => { if (pane === 'log') loadLog(); }, [pane]);

  // One fetch under `creds` — a grant id, or a category and reason.
  const fetchIt = async (row, action, creds) => {
    if (action === 'view') {
      const body = await api('/api/admin/dialectics/view', { method: 'POST', body: JSON.stringify({ base_id: row.base_id, ...creds }) });
      setOpen({ ...body, row });
    } else {
      const { blob, filename } = await postForBlob(
        `/api/admin/dialectics/${action === 'pdf' ? 'report.pdf' : 'records'}`, { base_id: row.base_id, ...creds });
      saveBlob(blob, filename || (action === 'pdf' ? `${row.name} - Elenchus Report.pdf` : `${row.name}.tar.gz`));
    }
    load();
  };
  // From the list: your own needs no reason; anyone else's asks for one.
  const start = async (row, action) => {
    if (!row.mine) { setGate({ row, action }); return; }
    setBusy(true); setError(null);
    try { await fetchIt(row, action, {}); } catch (e) { setError(e.message); }
    setBusy(false);
  };
  // From the viewer: under the reason already given, unless it has lapsed.
  const under = async (action) => {
    const row = open.row;
    setBusy(true); setError(null);
    try { await fetchIt(row, action, open.grant ? { grant_id: open.grant.grant_id } : {}); }
    catch (e) {
      if (e.detail && e.detail.grant_expired) setGate({ row, action, lapsed: true });
      else setError(e.message);
    }
    setBusy(false);
  };
  // Deletion never rides on the view's grant: its own reason, its own rows.
  const destroy = async (row, creds) => {
    await api('/api/admin/dialectics/delete', { method: 'POST',
      body: JSON.stringify({ base_id: row.base_id, confirm_name: row.name, ...creds }) });
    setDoomed(null); setOpen(null);
    load();
  };

  const heading = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 };
  const card = { padding: 16, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)', marginBottom: 16 };
  const note_ = { fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)', lineHeight: 1.6 };
  const th = { padding: '6px 8px', fontWeight: 400, textAlign: 'left', color: 'var(--text-muted)', whiteSpace: 'nowrap' };
  const td = { padding: '7px 8px', fontFamily: 'var(--sans)', verticalAlign: 'top' };
  const control = { padding: '6px 8px', borderRadius: 4, fontSize: fs(11), fontFamily: 'var(--sans)',
                    background: 'var(--bg)', color: 'var(--text)', border: '1px solid var(--border)' };
  const smallButton = { background: 'none', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)',
                        cursor: 'pointer', fontSize: fs(10), padding: '3px 10px', letterSpacing: 1, fontFamily: 'var(--mono)' };
  const paneButton = (id, text) => (
    <button onClick={() => setPane(id)} style={{ ...smallButton, color: pane === id ? 'var(--text)' : 'var(--text-muted)',
      borderColor: pane === id ? 'var(--border-focus)' : 'var(--border)' }}>{text}</button>
  );
  const when = (iso) => { try { return iso ? new Date(iso).toLocaleString() : '—'; } catch (e) { return iso; } };
  const ago = (iso) => {
    if (!iso) return '—';
    const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    return days <= 0 ? 'today' : days === 1 ? 'yesterday' : `${days} days ago`;
  };
  const kindLabel = { ordinary: 'ordinary', study_task: 'study · task', study_practice: 'study · practice' };

  if (error && !data) return <div style={{ ...note_, color: 'var(--deny)' }}>{error}</div>;
  if (!data) return <div style={note_}>Loading…</div>;

  const needle = q.trim().toLowerCase();
  const rows = data.dialectics
    .filter(r => kind === 'all' || (kind === 'ordinary' ? r.kind === 'ordinary' : r.kind !== 'ordinary'))
    // Names and owners only. A search over what people wrote would be reading it.
    .filter(r => !needle || `${r.name} ${r.base_id} ${r.owner.display_name} ${r.owner.email}`.toLowerCase().includes(needle))
    .sort((a, b) => sort === 'cost' ? b.cost_usd - a.cost_usd
      : sort === 'turns' ? b.calls - a.calls
      : sort === 'owner' ? (a.owner.display_name || '').localeCompare(b.owner.display_name || '')
      : sort === 'name' ? a.name.localeCompare(b.name)
      : (b.last_activity_at_utc || b.created_at_utc || '').localeCompare(a.last_activity_at_utc || a.created_at_utc || ''));

  return (
    <div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 12, alignItems: 'center' }}>
        {paneButton('list', 'DIALECTICS')}
        {paneButton('log', 'ACCESS LOG')}
        <span style={{ ...note_, marginLeft: 8 }}>
          Only its owner can open a dialectic. This is the exception: read-only, with a reason, recorded.
        </span>
      </div>
      {error && <div style={{ ...note_, color: 'var(--deny)', marginBottom: 10 }}>{error}</div>}

      {pane === 'list' && open && (
        <div style={{ marginBottom: 16 }}>
          <ReadOnlyDialectic fs={fs} view={open} busy={busy}
            onPdf={() => under('pdf')} onRecords={() => under('records')}
            onDelete={open.row.kind === 'ordinary' ? () => setDoomed(open.row) : null}
            onClose={() => setOpen(null)} />
        </div>
      )}

      {pane === 'list' && (
        <div style={card}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search name or owner"
              aria-label="Search name or owner" style={{ ...control, flex: 1, minWidth: 180 }} />
            <select value={kind} onChange={e => setKind(e.target.value)} aria-label="Kind" style={control}>
              <option value="ordinary">Ordinary</option>
              <option value="study">Study records</option>
              <option value="all">All</option>
            </select>
            <select value={sort} onChange={e => setSort(e.target.value)} aria-label="Sort by" style={control}>
              <option value="last">Last activity</option>
              <option value="cost">Cost</option>
              <option value="turns">Turns</option>
              <option value="owner">Owner</option>
              <option value="name">Name</option>
            </select>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
            <thead><tr>
              <th style={th}>dialectic</th><th style={th}>owner</th><th style={th}>kind</th>
              <th style={th}>last activity</th><th style={th}>turns</th><th style={th}>cost</th>
              <th style={th}>looked at</th><th style={th}></th>
            </tr></thead>
            <tbody>
              {rows.length === 0 && <tr><td style={{ ...td, color: 'var(--text-muted)' }} colSpan={8}>Nothing matches.</td></tr>}
              {rows.map(r => (
                <tr key={r.base_id} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={td}>{r.name}{r.name !== r.base_id && <div style={{ color: 'var(--text-muted)', fontFamily: 'var(--mono)', fontSize: fs(10) }}>{r.base_id}</div>}</td>
                  <td style={td}>{r.owner.display_name}{r.mine && <span style={{ color: 'var(--text-muted)' }}> · you</span>}
                    {r.owner.email && <div style={{ color: 'var(--text-muted)' }}>{r.owner.email}</div>}</td>
                  <td style={{ ...td, color: r.kind === 'ordinary' ? 'var(--text-dim)' : 'var(--tension)', whiteSpace: 'nowrap' }}>
                    {kindLabel[r.kind]}{r.study && r.study.development && ' (development)'}{r.study && <div style={{ color: 'var(--text-muted)' }}>{r.study.study_id}{r.study.period ? ` · session ${r.study.period}` : ''}</div>}</td>
                  <td style={{ ...td, whiteSpace: 'nowrap' }} title={when(r.last_activity_at_utc || r.created_at_utc)}>{ago(r.last_activity_at_utc || r.created_at_utc)}</td>
                  <td style={td}>{r.calls}</td>
                  <td style={td}>${r.cost_usd.toFixed(2)}</td>
                  <td style={td} title={r.access ? `last by ${r.access.last_by}, ${when(r.access.last_at_utc)}` : ''}>{r.access ? `${r.access.count}×` : '—'}</td>
                  <td style={{ ...td, textAlign: 'right', whiteSpace: 'nowrap' }}>
                    {r.viewable
                      ? <button style={smallButton} disabled={busy} onClick={() => start(r, 'view')}>VIEW</button>
                      : <span style={{ color: 'var(--text-muted)' }} title="Staff don't open study records in the application">via export</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ ...note_, marginTop: 10 }}>
            {rows.length} of {data.dialectics.length} dialectics. Search covers names and owners, never what was written.
            Study records are listed and can't be opened here: what a session produced is in the study export.
            A development study's records — the team's own tuning sessions — can be, under a reason, like any other dialectic.
            Deleting an ordinary dialectic is done from its viewer, under a reason of its own, with the name typed back; study records are never deleted.
          </div>
        </div>
      )}

      {pane === 'log' && (
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <div style={heading}>EVERY TIME SOMEONE OTHER THAN ITS OWNER LOOKED AT A DIALECTIC</div>
            {log && log.length > 0 && <button style={smallButton} onClick={() => saveBlob(
              new Blob([JSON.stringify(log, null, 2)], { type: 'application/json' }), 'content-access-log.json')}>DOWNLOAD JSON</button>}
          </div>
          {!log ? <div style={note_}>Loading…</div> : log.length === 0
            ? <div style={note_}>Nobody has looked at anyone else's dialectic.</div>
            : <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
                <thead><tr><th style={th}>when</th><th style={th}>who</th><th style={th}>what</th>
                  <th style={th}>dialectic</th><th style={th}>owner</th><th style={th}>reason</th></tr></thead>
                <tbody>{log.map(e => (
                  <tr key={e.id} style={{ borderTop: '1px solid var(--border)' }}>
                    <td style={{ ...td, whiteSpace: 'nowrap' }}>{when(e.at_utc)}</td>
                    <td style={td}>{e.actor_name}</td>
                    <td style={td}>{e.action}</td>
                    <td style={td}>{e.base_name}{e.base_kind === 'study_dev' && <span style={{ color: 'var(--text-muted)' }}> (development study)</span>}{!e.base_exists && <span style={{ color: 'var(--text-muted)' }}> (deleted)</span>}</td>
                    <td style={td}>{e.owner_name || e.owner_email || '—'}</td>
                    <td style={td}><span style={{ color: 'var(--text-dim)' }}>{e.category_label}</span> — {e.reason}</td>
                  </tr>))}</tbody>
              </table>}
        </div>
      )}

      {doomed && (
        <DeleteDialecticModal fs={fs} row={doomed} categories={data.delete_categories} minChars={data.reason_min_chars}
          onCancel={() => setDoomed(null)} onSubmit={(creds) => destroy(doomed, creds)} />
      )}

      {gate && (
        <AccessReasonModal fs={fs} row={gate.row} action={gate.action} lapsed={gate.lapsed}
          categories={data.categories} minChars={data.reason_min_chars} minutes={data.grant_minutes}
          onCancel={() => setGate(null)}
          onSubmit={async (creds) => {
            if (gate.action === 'view') { await fetchIt(gate.row, 'view', creds); setGate(null); return; }
            // A download under a fresh reason: view first so the viewer holds the new grant.
            if (open && open.row.base_id === gate.row.base_id) {
              const body = await api('/api/admin/dialectics/view', { method: 'POST', body: JSON.stringify({ base_id: gate.row.base_id, ...creds }) });
              setOpen({ ...body, row: gate.row });
              await fetchIt(gate.row, gate.action, { grant_id: body.grant.grant_id });
            } else {
              await fetchIt(gate.row, gate.action, creds);
            }
            setGate(null);
          }} />
      )}
    </div>
  );
}

// ── Study flow components (Sloan participants) ──

// ─── Study: writing pane ─────────────────────────────────────────────
// The participant's text is the study's judged artifact. It is written
// here, beside the dialogue, in both conditions — same pane, same
// wording — so nothing about the editor tells a judge (or the
// participant) which condition a text came from.

const STUDY_TASK_INSTRUCTION =
  'Write the kind of introduction a well-informed colleague would want to read before ' +
  'working in this area. What are the key concepts? How is each defined? How do they ' +
  'relate to one another? Where do the boundaries lie, and what follows from drawing ' +
  'them where you do? Two or three paragraphs is the target, in your own words — what ' +
  'you actually believe about how these concepts fit together, including where you ' +
  'think usage is unsettled.';

function fmtClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60), sec = totalSeconds % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// "The 60 minutes are" / "The 1 minute is" — for the hard-stop wording.
function minutesPhrase(n) {
  return n === 1 ? 'The 1 minute is' : `The ${n} minutes are`;
}

function countWords(text) {
  const m = text.match(/\S+/g);
  return m ? m.length : 0;
}

// Seconds on the main task: anchored to the server's figure (so a
// reload or a second device shows the same time) and ticked locally.
function useTaskClock(studySession) {
  const [elapsed, setElapsed] = useState(null);
  const active = studySession?.state === 'active';
  const serverElapsed = studySession?.state_elapsed_seconds;
  useEffect(() => {
    if (!active || serverElapsed == null) { setElapsed(null); return; }
    const anchor = Date.now() - serverElapsed * 1000;
    const tick = () => setElapsed(Math.floor((Date.now() - anchor) / 1000));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [studySession?.id, active, serverElapsed]);
  return elapsed;
}

function WritingPane({ fs, studySession, text, setText }) {
  const isTutorial = studySession.state === 'tutorial';
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState('saved'); // 'saved' | 'unsaved' | 'saving' | 'error'
  const [briefOpen, setBriefOpen] = useState(true);
  const lastSaved = useRef('');
  const latest = useRef(text);
  const nextTrigger = useRef('autosave');
  const saving = useRef(false);
  latest.current = text;
  const elapsed = useTaskClock(studySession);

  // Load the saved draft for this phase (the tutorial and the task each
  // have their own text). Nothing autosaves until this has finished, so
  // a slow load can never overwrite a draft with an empty editor.
  useEffect(() => {
    let cancelled = false;
    setLoaded(false);
    api('/api/study/session/text').then(r => {
      if (cancelled) return;
      lastSaved.current = r.content || '';
      setText(r.content || '');
      setSaveState('saved');
      setLoaded(true);
    }).catch(() => { if (!cancelled) setLoaded(true); });
    return () => { cancelled = true; };
  }, [studySession.id, studySession.state]);

  const save = useCallback(async (trigger) => {
    const content = latest.current;
    if (!loaded || saving.current || content === lastSaved.current) return;
    saving.current = true; setSaveState('saving');
    try {
      await api('/api/study/session/text', {
        method: 'PUT', body: JSON.stringify({ content, trigger }),
      });
      lastSaved.current = content;
      setSaveState(latest.current === content ? 'saved' : 'unsaved');
    } catch (e) {
      setSaveState('error'); // retried by the next edit or the interval below
    }
    saving.current = false;
  }, [loaded]);

  // Autosave: shortly after typing pauses, and at least every 10 s
  // while typing continues.
  useEffect(() => {
    if (!loaded || text === lastSaved.current) return;
    setSaveState(st => (st === 'saving' ? st : 'unsaved'));
    const trigger = nextTrigger.current;
    const id = setTimeout(() => { nextTrigger.current = 'autosave'; save(trigger); },
                          trigger === 'paste' ? 300 : 1500);
    return () => clearTimeout(id);
  }, [text, loaded, save]);
  useEffect(() => {
    const id = setInterval(() => save('autosave'), 10000);
    return () => clearInterval(id);
  }, [save]);

  // Last-chance save when the page is closed or hidden mid-edit.
  useEffect(() => {
    const flush = () => {
      if (!loaded || latest.current === lastSaved.current) return;
      fetch(API + '/api/study/session/text', {
        method: 'PUT', keepalive: true, credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: latest.current, trigger: 'blur' }),
      }).catch(() => {});
    };
    window.addEventListener('pagehide', flush);
    return () => window.removeEventListener('pagehide', flush);
  }, [loaded]);

  const logEvents = (events) => {
    api('/api/study/session/text/events', { method: 'POST', body: JSON.stringify({ events }) })
      .catch(() => {});
  };

  // A paste is logged by its length only — never its content.
  const onPaste = (e) => {
    const pasted = e.clipboardData ? e.clipboardData.getData('text') : '';
    logEvents([{ type: 'paste', length: pasted.length }]);
    nextTrigger.current = 'paste';
  };

  // Time guidance, then the hard stop. The two reminders are logged the
  // first time each is shown; at the task length the editor locks and
  // the app refetches the session, which the server has ended by the
  // clock with the text as it stood.
  const warnAt = studySession.soft_warning_minutes || [];
  const taskMinutes = studySession.task_minutes || 60;
  const elapsedMin = elapsed == null ? null : elapsed / 60;
  const crossed = elapsedMin == null ? [] : warnAt.filter(m => elapsedMin >= m);
  const crossedKey = crossed.join(',');
  useEffect(() => {
    crossed.forEach(m => {
      const key = `elenchus-study-warned-${studySession.id}-${m}`;
      try {
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
      } catch (err) {}
      logEvents([{ type: 'soft_warning_shown', threshold_minutes: m }]);
    });
  }, [crossedKey]);
  const timeUp = !isTutorial && elapsedMin != null && elapsedMin >= taskMinutes;
  useEffect(() => {
    if (timeUp) window.dispatchEvent(new CustomEvent('elenchus:task-ended'));
  }, [timeUp]);
  const minutesLeft = elapsedMin == null ? null : Math.max(1, Math.ceil(taskMinutes - elapsedMin));
  const warning = timeUp
    ? `${minutesPhrase(taskMinutes)} up — your text is being submitted as it stands.`
    : crossed.length > 0
      ? `About ${minutesLeft} minute${minutesLeft === 1 ? '' : 's'} left — the task ends when the clock runs out.`
      : null;

  const title = isTutorial ? studySession.practice_topic_title : studySession.topic_title;
  const brief = isTutorial ? studySession.practice_topic_brief : studySession.topic_brief;
  const words = countWords(text);
  const saveLabel = { saved: 'Saved', unsaved: 'Unsaved changes…', saving: 'Saving…',
                      error: 'Not saved — will retry' }[saveState];

  return (
    <div style={{
      gridColumn: '-2 / -1', gridRow: '2 / 4', display: 'flex', flexDirection: 'column',
      minHeight: 0, background: 'var(--surface)',
    }}>
      <div style={{
        padding: '10px 14px', borderBottom: '1px solid var(--border)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 10,
      }}>
        <span style={{ fontSize: fs(9), letterSpacing: 2, color: 'var(--text-muted)', textTransform: 'uppercase' }}>
          Your text
        </span>
        {elapsed != null && (
          <span title="Time on the main task" style={{
            fontFamily: 'var(--mono)', fontSize: fs(11),
            color: timeUp ? 'var(--deny)' : crossed.length ? 'var(--tension)' : 'var(--text-muted)',
          }}>{fmtClock(elapsed)} / {taskMinutes}:00</span>
        )}
      </div>

      <div style={{ padding: '10px 14px', borderBottom: '1px solid var(--border)' }}>
        <div onClick={() => setBriefOpen(o => !o)} style={{
          cursor: 'pointer', display: 'flex', justifyContent: 'space-between', gap: 8,
          fontFamily: 'var(--sans)', fontSize: fs(13), fontWeight: 600, color: 'var(--text)',
        }}>
          <span>{title || 'Your topic'}</span>
          <span style={{ color: 'var(--text-muted)', fontWeight: 400, fontSize: fs(10), fontFamily: 'var(--mono)' }}>
            {briefOpen ? 'HIDE TASK' : 'SHOW TASK'}
          </span>
        </div>
        {briefOpen && (
          <div style={{ marginTop: 6, fontFamily: 'var(--sans)', fontSize: fs(12), lineHeight: 1.6, color: 'var(--text-dim)' }}>
            {brief && <p style={{ marginBottom: 6 }}>{brief}</p>}
            {!isTutorial && <p>{STUDY_TASK_INSTRUCTION}</p>}
          </div>
        )}
      </div>

      {warning && (
        <div role="status" style={{
          margin: '10px 14px 0', padding: '8px 10px', borderRadius: 4,
          fontFamily: 'var(--sans)', fontSize: fs(12), lineHeight: 1.5,
          color: 'var(--text)',
          background: timeUp ? 'var(--deny-bg)' : 'var(--tension-bg)',
          border: `1px solid ${timeUp ? 'var(--deny)' : 'var(--tension-border)'}`,
        }}>{warning}</div>
      )}

      <textarea
        data-study-editor="1"
        value={text}
        onChange={e => setText(e.target.value)}
        onPaste={onPaste}
        onBlur={() => save('blur')}
        disabled={!loaded || timeUp}
        placeholder={loaded ? 'Write your introduction here. It saves automatically.' : 'Loading your text…'}
        spellCheck={true}
        style={{
          flex: 1, minHeight: 0, margin: 14, padding: '12px 14px', resize: 'none',
          background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 6,
          color: 'var(--text)', fontFamily: 'var(--sans)', fontSize: fs(14), lineHeight: 1.7,
          outline: 'none',
        }}
      />

      <div style={{
        padding: '0 14px 12px', display: 'flex', justifyContent: 'space-between',
        fontFamily: 'var(--mono)', fontSize: fs(10), color: 'var(--text-muted)',
      }}>
        <span>{words} word{words === 1 ? '' : 's'}</span>
        <span style={{ color: saveState === 'error' ? 'var(--deny)' : 'var(--text-muted)' }}>{saveLabel}</span>
      </div>
    </div>
  );
}

function StudyShell({ fs, title, children }) {
  return (
    <div style={{ minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ maxWidth: 560, width: '100%', padding: '32px 48px 20px' }}>
        <div style={{ textAlign: 'center', marginBottom: 28 }}>
          <div style={{ fontSize: fs(11), letterSpacing: 8, color: 'var(--text-muted)', marginBottom: 14 }}>
            ἜΛΕΓΧΟΣ
          </div>
          <h1 style={{ fontSize: fs(24), fontWeight: 300, letterSpacing: -0.5 }}>{title}</h1>
        </div>
        {children}
      </div>
    </div>
    <PartnerFooter />
    </div>
  );
}

function StudyError({ fs, message }) {
  return (
    <div style={{ marginTop: 14, padding: 10, borderRadius: 6,
                  background: '#ef444420', border: '1px solid #ef444440',
                  color: '#ef4444', fontSize: fs(12), fontFamily: 'var(--sans)' }}>
      {message}
    </div>
  );
}

function SurveyRunner({ fs, sessionId, onDone }) {
  // Walks the participant through the four instruments sequentially.
  // Each instrument is submitted whole; the backend rejects partial
  // submissions, and the UI disables SUBMIT until every item has a
  // value.
  const [instruments, setInstruments] = useState(null);
  const [idx, setIdx] = useState(0);
  const [values, setValues] = useState({});
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const data = await api('/api/study/instruments');
        setInstruments(data.instruments);
      } catch (e) { setError(e.message); }
    })();
  }, []);

  if (error && !instruments) {
    return <StudyShell fs={fs} title="Questionnaires"><StudyError fs={fs} message={error} /></StudyShell>;
  }
  if (!instruments) {
    return <StudyShell fs={fs} title="Questionnaires">
      <p style={{ color: 'var(--text-muted)', fontFamily: 'var(--sans)', fontSize: fs(12) }}>Loading…</p>
    </StudyShell>;
  }

  const inst = instruments[idx];
  const allAnswered = inst.items.every(item => Number.isInteger(values[item.id]));

  const submit = async () => {
    if (!allAnswered || busy) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/study/session/${sessionId}/survey`, {
        method: 'POST',
        body: JSON.stringify({ instrument: inst.instrument, responses: values }),
      });
      if (idx + 1 < instruments.length) {
        setIdx(idx + 1);
        setValues({});
        window.scrollTo(0, 0);
      } else {
        onDone();
      }
    } catch (e) {
      setError(typeof e.message === 'string' ? e.message : 'Submission failed — please review your answers.');
    }
    setBusy(false);
  };

  return (
    <div style={{ height: '100%', overflowY: 'auto' }}>
      <div style={{ maxWidth: 640, margin: '0 auto', padding: 48 }}>
        <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 6 }}>
          QUESTIONNAIRE {idx + 1} OF {instruments.length}
        </div>
        <h1 style={{ fontSize: fs(22), fontWeight: 300, marginBottom: 6 }}>{inst.title}</h1>
        <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(12), marginBottom: 24 }}>
          {inst.description}
        </p>

        {inst.items.map(item => (
          <div key={item.id} style={{
            marginBottom: 18, padding: 14, borderRadius: 6,
            background: 'var(--surface)', border: '1px solid var(--border)',
          }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(13), marginBottom: 10, lineHeight: 1.5 }}>
              {item.text}
            </div>
            {(item.scale_max - item.scale_min) > 10 ? (
              // Wide scale (NASA-TLX 0–100): slider + live value.
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <span style={{ fontSize: fs(10), color: 'var(--text-muted)', width: 70 }}>{inst.scale_labels.min}</span>
                <input
                  type="range" min={item.scale_min} max={item.scale_max} step={5}
                  value={values[item.id] ?? Math.round((item.scale_min + item.scale_max) / 2)}
                  onChange={e => setValues(v => ({ ...v, [item.id]: parseInt(e.target.value, 10) }))}
                  onMouseDown={() => setValues(v => (
                    Number.isInteger(v[item.id]) ? v : { ...v, [item.id]: Math.round((item.scale_min + item.scale_max) / 2) }
                  ))}
                  style={{ flex: 1 }}
                />
                <span style={{ fontSize: fs(10), color: 'var(--text-muted)', width: 70, textAlign: 'right' }}>{inst.scale_labels.max}</span>
                <span style={{
                  fontSize: fs(12), width: 36, textAlign: 'right',
                  color: Number.isInteger(values[item.id]) ? 'var(--text)' : 'var(--text-muted)',
                }}>{Number.isInteger(values[item.id]) ? values[item.id] : '—'}</span>
              </div>
            ) : (
              // Likert: one radio-style button per point.
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                <span style={{ fontSize: fs(10), color: 'var(--text-muted)', marginRight: 4 }}>{inst.scale_labels.min}</span>
                {Array.from({ length: item.scale_max - item.scale_min + 1 }, (_, i) => item.scale_min + i).map(n => (
                  <button key={n}
                    onClick={() => setValues(v => ({ ...v, [item.id]: n }))}
                    style={{
                      width: 34, height: 34, borderRadius: 17,
                      border: '1px solid ' + (values[item.id] === n ? 'var(--accent)' : 'var(--border)'),
                      background: values[item.id] === n ? 'var(--accent)' : 'var(--surface2)',
                      color: values[item.id] === n ? '#111' : 'var(--text-dim)',
                      cursor: 'pointer', fontSize: fs(12), fontFamily: 'var(--mono)',
                    }}>{n}</button>
                ))}
                <span style={{ fontSize: fs(10), color: 'var(--text-muted)', marginLeft: 4 }}>{inst.scale_labels.max}</span>
              </div>
            )}
          </div>
        ))}

        <button onClick={submit} disabled={!allAnswered || busy} style={{
          width: '100%', padding: '12px 16px', marginTop: 8, marginBottom: 40,
          background: allAnswered ? 'var(--accent)' : 'var(--surface)',
          border: 'none', borderRadius: 6, color: '#111',
          fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
          cursor: (allAnswered && !busy) ? 'pointer' : 'default',
          opacity: (allAnswered && !busy) ? 1 : 0.3,
        }}>
          {busy ? '…' : (idx + 1 < instruments.length ? 'SUBMIT AND CONTINUE' : 'SUBMIT AND FINISH')}
        </button>
        {error && <StudyError fs={fs} message={error} />}
      </div>
    </div>
  );
}

// ── Blinded judge interface (Sloan) ──

function JudgeInterface({ fs, logout }) {
  // 'queue' | 'pair' (the study: a participant's two texts, labelled A and B)
  //         | 'guesses' (the pass after the queue is done)
  const [view, setView] = useState('queue');
  const [activeId, setActiveId] = useState(null);
  const home = () => { setView('queue'); setActiveId(null); };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '10px 20px', borderBottom: '1px solid var(--border)',
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
          <span style={{ fontSize: fs(13), fontWeight: 500, color: 'var(--opp)', cursor: 'pointer' }}
                onClick={home}>Elenchus</span>
          <span style={{ color: 'var(--text-dim)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>
            Judge — blinded evaluation
          </span>
        </div>
        <button onClick={logout} style={{
          background: 'none', border: '1px solid var(--border)', borderRadius: 4,
          color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10),
          padding: '2px 8px', lineHeight: 1.4, letterSpacing: 1, fontFamily: 'var(--mono)' }}>
          SIGN OUT</button>
      </div>
      <div style={{ flex: 1, overflowY: 'auto' }}>
        {view === 'queue'
          ? <JudgeQueue fs={fs}
              onOpenPair={(id) => { setActiveId(id); setView('pair'); }}
              onGuess={() => setView('guesses')} />
          : view === 'pair'
            ? <JudgeRatePair fs={fs} pairId={activeId} onDone={home} />
            : <JudgeGuesses fs={fs} onDone={home} />}
      </div>
    </div>
  );
}

// The judge's queue of pairs: a participant's two texts, labelled A and
// B for this judge, in this judge's own random order. Shows only the two
// topics and what is still to do on each — nothing about who wrote them
// or how.
function JudgePairQueue({ fs, pairs, guessing, onOpenPair, onGuess }) {
  const pending = pairs.filter(t => t.status === 'pending');
  const done = pairs.filter(t => t.status !== 'pending');
  const progress = (t) => {
    const parts = [];
    if (t.rated.A) parts.push('A rated');
    if (t.rated.B) parts.push('B rated');
    if (t.ranked) parts.push('ranked');
    return parts.join(' · ');
  };
  const row = (t, isDone) => (
    <div key={t.pair_id} onClick={() => onOpenPair(t.pair_id)} style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
      padding: isDone ? '10px 14px' : '12px 14px', marginBottom: isDone ? 4 : 6, borderRadius: 6,
      background: 'var(--surface)', border: '1px solid var(--border)', cursor: 'pointer',
      opacity: isDone ? 0.7 : 1 }}>
      <span style={{ fontFamily: 'var(--sans)', fontSize: fs(13) }}>
        <span style={{ fontFamily: 'var(--mono)', color: 'var(--text-muted)', fontSize: fs(10) }}>A </span>{t.topics.A || 'Text'}
        <span style={{ color: 'var(--text-muted)' }}> · </span>
        <span style={{ fontFamily: 'var(--mono)', color: 'var(--text-muted)', fontSize: fs(10) }}>B </span>{t.topics.B || 'Text'}
      </span>
      <span style={{ display: 'flex', gap: 14, alignItems: 'baseline' }}>
        {!isDone && progress(t) && <span style={{ fontSize: fs(10), fontFamily: 'var(--mono)', color: 'var(--tension)' }}>{progress(t)}</span>}
        {isDone
          ? <span style={{ fontSize: fs(10), color: 'var(--commit)' }}>✓ done — open to revise</span>
          : <span style={{ fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)', color: 'var(--accent)' }}>OPEN →</span>}
      </span>
    </div>
  );
  return (
    <div style={{ maxWidth: 760, margin: '0 auto', padding: 32 }}>
      <h1 style={{ fontSize: fs(22), fontWeight: 300, marginBottom: 6 }}>Pairs to rate</h1>
      <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(12), lineHeight: 1.7, marginBottom: 24 }}>
        Each item is a pair of short introductions, each to a topic, written by the same researcher on
        two occasions. Rate each text on its own merits against the four dimensions, with a sentence
        on each; then say which of the two is the better introduction to its topic. Work from the top.
        You can reopen a pair and revise. Your judgements are confidential.
      </p>
      {guessing && guessing.open && (
        <div onClick={onGuess} style={{
          padding: '12px 14px', marginBottom: 18, borderRadius: 6, cursor: 'pointer',
          background: 'var(--tension-bg)', border: '1px solid var(--tension-border)',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
          <span style={{ fontFamily: 'var(--sans)', fontSize: fs(13) }}>
            Every pair is done — one last step: your guess at how each writer worked
            <span style={{ color: 'var(--text-muted)' }}> ({guessing.done} of {guessing.required} given)</span>
          </span>
          <span style={{ fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)', color: 'var(--accent)' }}>OPEN →</span>
        </div>
      )}
      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
        TO DO ({pending.length}) · DONE ({done.length})
      </div>
      {pending.length === 0 && (
        <div style={{ color: 'var(--text-muted)', fontSize: fs(12), fontFamily: 'var(--sans)', marginBottom: 20 }}>
          Nothing waiting — thank you.
        </div>
      )}
      {pending.map(t => row(t, false))}
      {done.length > 0 && <div style={{ height: 14 }} />}
      {done.map(t => row(t, true))}
    </div>
  );
}

// One pair: both texts side by side, each rated on the four dimensions
// with a one-sentence justification per dimension, then the ranking.
// Submitting posts the two ratings and the ranking; a revision does the
// same again (every submission is kept; the newest counts).
function JudgeRatePair({ fs, pairId, onDone }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [ratings, setRatings] = useState({ A: {}, B: {} });
  const [why, setWhy] = useState({ A: {}, B: {} });
  const [preferred, setPreferred] = useState(null);
  const openedAt = useRef(Date.now());

  useEffect(() => {
    (async () => {
      try {
        const d = await api(`/api/judge/pairs/${pairId}`);
        setData(d);
        const r = { A: {}, B: {} }, w = { A: {}, B: {} };
        for (const label of ['A', 'B']) {
          if (d.texts[label].rating) {
            r[label] = d.texts[label].rating.ratings || {};
            w[label] = d.texts[label].rating.justifications || {};
          }
        }
        setRatings(r); setWhy(w); setPreferred(d.preferred || null);
        openedAt.current = Date.now();
      } catch (e) { setError(e.message); }
    })();
  }, [pairId]);

  if (error && !data) return <div style={{ padding: 32 }}><StudyError fs={fs} message={error} /></div>;
  if (!data) return <div style={{ padding: 32, color: 'var(--text-muted)', fontSize: fs(12) }}>Loading…</div>;

  const { rubric } = data;
  const scale = [];
  for (let v = rubric.scale.min; v <= rubric.scale.max; v++) scale.push(v);
  const textComplete = (label) => rubric.dimensions.every(d =>
    Number.isInteger(ratings[label][d.key]) && (why[label][d.key] || '').trim().length > 0);
  const complete = textComplete('A') && textComplete('B') && (preferred === 'A' || preferred === 'B');
  const wasDone = data.status === 'completed';

  const submit = async () => {
    if (busy || !complete) return;
    setBusy(true); setError(null);
    const seconds = Math.round((Date.now() - openedAt.current) / 1000);
    try {
      for (const label of ['A', 'B']) {
        await api(`/api/judge/pairs/${pairId}/rate`, {
          method: 'POST',
          body: JSON.stringify({ label, ratings: ratings[label], justifications: why[label], seconds_spent: seconds }),
        });
      }
      await api(`/api/judge/pairs/${pairId}/rank`, {
        method: 'POST', body: JSON.stringify({ preferred, seconds_spent: seconds }),
      });
      onDone();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const pill = (active) => ({
    minWidth: 30, padding: '5px 0', borderRadius: 4, cursor: 'pointer', fontSize: fs(12),
    fontFamily: 'var(--mono)', border: '1px solid', textAlign: 'center',
    borderColor: active ? 'var(--accent)' : 'var(--border)',
    background: active ? 'var(--accent)' : 'var(--surface)', color: active ? '#111' : 'var(--text-dim)',
  });
  const label = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8, textTransform: 'uppercase' };
  const input = { width: '100%', padding: '7px 10px', background: 'var(--surface)', border: '1px solid var(--border)',
                  borderRadius: 4, color: 'var(--text)', fontFamily: 'var(--sans)', fontSize: fs(12), outline: 'none',
                  boxSizing: 'border-box' };

  const column = (tag) => {
    const t = data.texts[tag];
    return (
      <div key={tag} style={{ minWidth: 0 }}>
        <div style={label}>Text {tag} · topic the writer was given</div>
        <div style={{ fontFamily: 'var(--sans)', fontSize: fs(15), fontWeight: 600, marginBottom: 4 }}>{t.topic_title}</div>
        {t.topic_brief && (
          <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-dim)', lineHeight: 1.6, marginBottom: 10 }}>{t.topic_brief}</div>
        )}
        <div style={label}>The text · {t.word_count} words</div>
        <div style={{ padding: '16px 18px', borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)',
                      fontFamily: 'var(--sans)', fontSize: fs(13), lineHeight: 1.75, whiteSpace: 'pre-wrap', marginBottom: 18 }}>
          {t.content}
        </div>
        <div style={label}>Your rating of text {tag} — {rubric.scale.min} = {rubric.scale.anchors[rubric.scale.min]}, {rubric.scale.max} = {rubric.scale.anchors[rubric.scale.max]}</div>
        {rubric.dimensions.map(d => (
          <div key={d.key} style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(13), fontWeight: 600 }}>{d.label}</div>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(11), color: 'var(--text-dim)', lineHeight: 1.6, margin: '2px 0 6px' }}>{d.help}</div>
            <div role="radiogroup" aria-label={`Text ${tag}: ${d.label}`} style={{ display: 'flex', gap: 5, marginBottom: 6 }}>
              {scale.map(v => (
                <div key={v} role="radio" aria-checked={ratings[tag][d.key] === v} aria-label={`Text ${tag} ${d.label}: ${v}`}
                     onClick={() => setRatings(r => ({ ...r, [tag]: { ...r[tag], [d.key]: v } }))} style={pill(ratings[tag][d.key] === v)}>{v}</div>
              ))}
            </div>
            <input value={why[tag][d.key] || ''} maxLength={rubric.justification.max_chars}
              onChange={e => setWhy(w => ({ ...w, [tag]: { ...w[tag], [d.key]: e.target.value } }))}
              placeholder={rubric.justification.help} style={input} />
          </div>
        ))}
      </div>
    );
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', minHeight: 0 }}>
      {/* The two texts, each with its rating form, in columns that scroll on
          their own — so the ranking below can be made with either text in
          view. */}
      <div style={{ flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 1fr)' }}>
        {['A', 'B'].map(tag => (
          <div key={tag} style={{ overflowY: 'auto', padding: '24px 28px',
                                  borderRight: tag === 'A' ? '1px solid var(--border)' : 'none' }}>
            {tag === 'A' && (
              <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 18 }}>
                Both texts are by the same writer, on two occasions and two topics. Each was to be the kind of
                introduction a well-informed colleague would want to read before working in that area — two or
                three paragraphs, in the writer's own words. Rate each on its own merits against its own topic.
              </div>
            )}
            {tag === 'B' && <div style={{ height: fs(12) * 1.6 * 3 + 18 }} />}
            {column(tag)}
            <div style={{ height: 24 }} />
          </div>
        ))}
      </div>

      {/* The ranking, always in view. */}
      <div style={{ borderTop: '1px solid var(--border)', background: 'var(--surface)', padding: '14px 28px',
                    display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap' }}>
        <div style={{ flex: '1 1 380px', minWidth: 0 }}>
          <div style={{ fontFamily: 'var(--sans)', fontSize: fs(13), fontWeight: 600 }}>{rubric.ranking.question}</div>
          <div style={{ fontFamily: 'var(--sans)', fontSize: fs(11), color: 'var(--text-dim)', lineHeight: 1.5 }}>
            {rubric.ranking.help} Scroll either column to re-read a text.
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {rubric.ranking.options.map(o => (
            <div key={o} role="radio" aria-checked={preferred === o} aria-label={`Prefer text ${o}`}
                 onClick={() => setPreferred(o)} style={{ ...pill(preferred === o), padding: '10px 22px', fontFamily: 'var(--sans)', fontSize: fs(13) }}>
              Text {o}
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <button onClick={submit} disabled={busy || !complete} title={complete ? '' : 'All four dimensions and a sentence for each, on both texts, and your choice of the better one'} style={{
            padding: '10px 18px', background: 'var(--accent)', border: 'none', borderRadius: 6,
            color: '#111', fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
            cursor: busy || !complete ? 'default' : 'pointer', opacity: busy || !complete ? 0.5 : 1 }}>
            {busy ? '…' : wasDone ? 'SAVE REVISED PAIR' : 'SUBMIT PAIR'}</button>
          <button onClick={onDone} style={{
            padding: '10px 14px', background: 'none', border: '1px solid var(--border)', borderRadius: 6,
            color: 'var(--text-muted)', fontSize: fs(12), letterSpacing: 1, cursor: 'pointer' }}>BACK</button>
        </div>
        {(error || !complete) && (
          <div style={{ flexBasis: '100%', fontFamily: 'var(--sans)', fontSize: fs(11), color: error ? 'var(--deny)' : 'var(--text-muted)' }}>
            {error || 'To submit: all four dimensions and a sentence for each, on both texts, and your choice of the better one.'}
          </div>
        )}
      </div>
    </div>
  );
}

// The guessing pass: after every pair is rated and ranked, a guess at
// how each writer worked with the AI, with a confidence. Kept apart
// from the rating form so the guess can't colour the ratings.
function JudgeGuesses({ fs, onDone }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [draft, setDraft] = useState({});

  const load = async () => {
    try {
      const d = await api('/api/judge/guesses');
      setData(d);
      const dr = {};
      for (const it of d.items) dr[`${it.pair_id}:${it.label}`] = { guess: it.guess, confidence: it.confidence };
      setDraft(dr);
    } catch (e) { setError(e.message); }
  };
  useEffect(() => { load(); }, []);

  if (error && !data) return <div style={{ padding: 32 }}><StudyError fs={fs} message={error} /></div>;
  if (!data) return <div style={{ padding: 32, color: 'var(--text-muted)', fontSize: fs(12) }}>Loading…</div>;

  const pill = (active) => ({
    padding: '6px 10px', borderRadius: 4, cursor: 'pointer', fontSize: fs(12), fontFamily: 'var(--sans)',
    border: '1px solid', borderColor: active ? 'var(--accent)' : 'var(--border)',
    background: active ? 'var(--accent)' : 'var(--surface)', color: active ? '#111' : 'var(--text-dim)',
  });
  const small = (active) => ({ ...pill(active), minWidth: 30, padding: '5px 0', textAlign: 'center', fontFamily: 'var(--mono)' });
  const label = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8, textTransform: 'uppercase' };
  const set = (key, patch) => setDraft(d => ({ ...d, [key]: { ...(d[key] || {}), ...patch } }));
  const ready = data.items.filter(it => (draft[`${it.pair_id}:${it.label}`] || {}).guess);

  const save = async () => {
    if (busy) return;
    setBusy(true); setError(null);
    try {
      for (const it of ready) {
        const g = draft[`${it.pair_id}:${it.label}`];
        await api('/api/judge/guesses', {
          method: 'POST',
          body: JSON.stringify({ pair_id: it.pair_id, label: it.label, guess: g.guess,
                                 confidence: g.guess === 'unsure' ? null : (g.confidence || null) }),
        });
      }
      await load();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  return (
    <div style={{ maxWidth: 760, margin: '0 auto', padding: 32 }}>
      <h1 style={{ fontSize: fs(22), fontWeight: 300, marginBottom: 6 }}>One last question</h1>
      <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(12), lineHeight: 1.7, marginBottom: 6 }}>
        {data.open ? "Writers worked with an AI in one of two ways. For each text, which do you think its writer used, and how sure are you? There is no right answer to aim for, and “can't tell” is a perfectly good one."
                   : 'This step opens once every pair in your queue is rated and ranked.'}
      </p>
      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', margin: '14px 0 12px' }}>
        {data.done} OF {data.required} GIVEN
      </div>
      {data.items.map((it, i) => {
        const key = `${it.pair_id}:${it.label}`;
        const g = draft[key] || {};
        return (
          <div key={key} style={{ padding: '12px 14px', marginBottom: 8, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)' }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(13), marginBottom: 8 }}>
              <span style={{ fontFamily: 'var(--mono)', color: 'var(--text-muted)', fontSize: fs(10) }}>PAIR {Math.floor(i / 2) + 1} · TEXT {it.label} </span>{it.topic_title}
              {it.word_count != null && <span style={{ color: 'var(--text-muted)', fontSize: fs(11) }}> · {it.word_count} words</span>}
            </div>
            {it.content && (
              <div style={{
                maxHeight: 180, overflowY: 'auto', padding: '8px 10px', marginBottom: 10, borderRadius: 4,
                background: 'var(--surface2)', border: '1px solid var(--border)',
                fontFamily: 'var(--sans)', fontSize: fs(12), lineHeight: 1.6, whiteSpace: 'pre-wrap',
              }}>{it.content}</div>
            )}
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: g.guess && g.guess !== 'unsure' ? 8 : 0 }}>
              {data.options.map(o => (
                <div key={o.value} onClick={() => set(key, { guess: o.value })} style={pill(g.guess === o.value)}>{o.label}</div>
              ))}
            </div>
            {g.guess && g.guess !== 'unsure' && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <span style={{ fontFamily: 'var(--sans)', fontSize: fs(11), color: 'var(--text-dim)' }}>How sure? (1 = a guess, 7 = certain)</span>
                {[1, 2, 3, 4, 5, 6, 7].map(v => (
                  <div key={v} onClick={() => set(key, { confidence: v })} style={small(g.confidence === v)}>{v}</div>
                ))}
              </div>
            )}
          </div>
        );
      })}
      {error && <StudyError fs={fs} message={error} />}
      {data.open && (
        <div style={{ display: 'flex', gap: 10, marginTop: 18 }}>
          <button onClick={save} disabled={busy || ready.length === 0} style={{
            flex: 1, padding: '12px 16px', background: 'var(--accent)', border: 'none', borderRadius: 6,
            color: '#111', fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
            cursor: busy || ready.length === 0 ? 'default' : 'pointer', opacity: busy || ready.length === 0 ? 0.5 : 1 }}>
            {busy ? '…' : `SAVE ${ready.length} GUESS${ready.length === 1 ? '' : 'ES'}`}</button>
          <button onClick={onDone} style={{
            padding: '12px 16px', background: 'none', border: '1px solid var(--border)', borderRadius: 6,
            color: 'var(--text-muted)', fontSize: fs(12), letterSpacing: 1, cursor: 'pointer' }}>BACK</button>
        </div>
      )}
    </div>
  );
}

function JudgeQueue({ fs, onOpenPair, onGuess }) {
  const [pairs, setPairs] = useState(null);
  const [guessing, setGuessing] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const t = await api('/api/judge/pairs');
        setPairs(t.pairs || []); setGuessing(t.guessing || null);
      } catch (e) { setError(e.message); }
    })();
  }, []);

  if (error) return <div style={{ padding: 32 }}><StudyError fs={fs} message={error} /></div>;
  if (!pairs) return <div style={{ padding: 32, color: 'var(--text-muted)', fontSize: fs(12) }}>Loading…</div>;
  return <JudgePairQueue fs={fs} pairs={pairs} guessing={guessing} onOpenPair={onOpenPair} onGuess={onGuess} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
