  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '10px 20px', borderBottom: '1px solid var(--border)',
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
          <span style={{ fontSize: fs(13), fontWeight: 500, color: 'var(--opp)', cursor: 'pointer' }}
                onClick={() => { setView('queue'); setActiveId(null); }}>Elenchus</span>
          <span style={{ color: 'var(--text-dim)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>
            Judge — blinded evaluation
          </span>
        </div>
        <button onClick={logout} style={{
          background: 'none', border: '1px solid var(--border)', borderRadius: 4,
          color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10),
          padding: '2px 8px', lineHeight: 1.4, letterSpacing: 1, fontFamily: 'var(--mono)' }}>
          SIGN OUT</button>
      </div>
      <div style={{ flex: 1, overflowY: 'auto' }}>
        {view === 'queue'
          ? <JudgeQueue fs={fs}
              onOpen={(id) => { setActiveId(id); setView('rate'); }}
              onOpenText={(id) => { setActiveId(id); setView('rate-text'); }} />
          : view === 'rate-text'
            ? <JudgeRateText fs={fs} assignmentId={activeId} onDone={() => { setView('queue'); setActiveId(null); }} />
            : <JudgeRate fs={fs} assignmentId={activeId} onDone={() => { setView('queue'); setActiveId(null); }} />}
      </div>
    </div>
  );
}

function JudgeTextQueue({ fs, texts, onOpenText }) {
  const pending = texts.filter(t => t.status === 'pending');
  const done = texts.filter(t => t.status !== 'pending');
  const row = (t, isDone) => (
    <div key={t.assignment_id} onClick={() => onOpenText(t.assignment_id)} style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
      padding: isDone ? '10px 14px' : '12px 14px', marginBottom: isDone ? 4 : 6, borderRadius: 6,
      background: 'var(--surface)', border: '1px solid var(--border)', cursor: 'pointer',
      opacity: isDone ? 0.7 : 1 }}>
      <span style={{ fontFamily: 'var(--sans)', fontSize: fs(13) }}>{t.topic_title || 'Text'}</span>
      <span style={{ display: 'flex', gap: 14, alignItems: 'baseline' }}>
        <span style={{ fontSize: fs(10), fontFamily: 'var(--mono)', color: 'var(--text-muted)' }}>{t.word_count} words</span>
        {isDone
          ? <span style={{ fontSize: fs(10), color: 'var(--commit)' }}>✓ rated — open to revise</span>
          : <span style={{ fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)', color: 'var(--accent)' }}>OPEN →</span>}
      </span>
    </div>
  );
  return (
    <div style={{ maxWidth: 720, margin: '0 auto', padding: 32 }}>
      <h1 style={{ fontSize: fs(22), fontWeight: 300, marginBottom: 6 }}>Texts to rate</h1>
      <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(12), lineHeight: 1.7, marginBottom: 24 }}>
        Each item is a short introduction to a topic, written by a researcher in the field.
        Rate each text on its own merits against the four dimensions — not against the other
        texts. You can reopen a text and revise your rating. Your judgements are confidential.
      </p>
      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
        TO DO ({pending.length}) · RATED ({done.length})
      </div>
      {pending.length === 0 && (
        <div style={{ color: 'var(--text-muted)', fontSize: fs(12), fontFamily: 'var(--sans)', marginBottom: 20 }}>
          Nothing waiting — thank you.
        </div>
      )}
      {pending.map(t => row(t, false))}
      {done.length > 0 && <div style={{ height: 14 }} />}
      {done.map(t => row(t, true))}
    </div>
  );
}

function JudgeRateText({ fs, assignmentId, onDone }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [ratings, setRatings] = useState({});
  const [justification, setJustification] = useState('');
  const [guess, setGuess] = useState(null);
  const [confidence, setConfidence] = useState(null);
  const openedAt = useRef(Date.now());

  useEffect(() => {
    (async () => {
      try {
        const d = await api(`/api/judge/texts/${assignmentId}`);
        setData(d);
        if (d.rating) {
          setRatings(d.rating.ratings || {});
          setJustification(d.rating.justification || '');
          setGuess(d.rating.condition_guess || null);
          setConfidence(d.rating.confidence || null);
        }
        openedAt.current = Date.now();
      } catch (e) { setError(e.message); }
    })();
  }, [assignmentId]);

  if (error && !data) return <div style={{ padding: 32 }}><StudyError fs={fs} message={error} /></div>;
  if (!data) return <div style={{ padding: 32, color: 'var(--text-muted)', fontSize: fs(12) }}>Loading…</div>;

  const { rubric } = data;
  const scale = [];
  for (let v = rubric.scale.min; v <= rubric.scale.max; v++) scale.push(v);
  const complete = rubric.dimensions.every(d => Number.isInteger(ratings[d.key]));

  const submit = async () => {
    if (busy || !complete) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/judge/texts/${assignmentId}/rate`, {
        method: 'POST',
        body: JSON.stringify({
          ratings, justification, condition_guess: guess, confidence,
          seconds_spent: Math.round((Date.now() - openedAt.current) / 1000),
        }),
      });
      onDone();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const pill = (active) => ({
    minWidth: 34, padding: '6px 0', borderRadius: 4, cursor: 'pointer', fontSize: fs(12),
    fontFamily: 'var(--mono)', border: '1px solid', textAlign: 'center',
    borderColor: active ? 'var(--accent)' : 'var(--border)',
    background: active ? 'var(--accent)' : 'var(--surface)', color: active ? '#111' : 'var(--text-dim)',
  });
  const label = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8, textTransform: 'uppercase' };

  return (
    <div style={{ maxWidth: 1100, margin: '0 auto', padding: 32, display: 'grid',
                  gridTemplateColumns: 'minmax(0, 1.15fr) minmax(0, 1fr)', gap: 32, alignItems: 'start' }}>
      {/* The text */}
      <div>
        <div style={label}>Topic the writer was given</div>
        <div style={{ fontFamily: 'var(--sans)', fontSize: fs(15), fontWeight: 600, marginBottom: 4 }}>{data.topic_title}</div>
        {data.topic_brief && (
          <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-dim)', lineHeight: 1.6, marginBottom: 6 }}>{data.topic_brief}</div>
        )}
        <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 16 }}>
          They were asked for the kind of introduction a well-informed colleague would want to read before
          working in this area — two or three paragraphs, in their own words.
        </div>
        <div style={label}>The text · {data.word_count} words</div>
        <div style={{ padding: '18px 20px', borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)',
                      fontFamily: 'var(--sans)', fontSize: fs(14), lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>
          {data.content}
        </div>
      </div>

      {/* The rating */}
      <div>
        <div style={label}>Your rating — {rubric.scale.min} = {rubric.scale.anchors[rubric.scale.min]}, {rubric.scale.max} = {rubric.scale.anchors[rubric.scale.max]}</div>
        {rubric.dimensions.map(d => (
          <div key={d.key} style={{ marginBottom: 18 }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(13), fontWeight: 600 }}>{d.label}</div>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-dim)', lineHeight: 1.6, margin: '2px 0 8px' }}>{d.help}</div>
            <div role="radiogroup" aria-label={d.label} style={{ display: 'flex', gap: 6 }}>
              {scale.map(v => (
                <div key={v} role="radio" aria-checked={ratings[d.key] === v} aria-label={`${d.label}: ${v}`}
                     onClick={() => setRatings(r => ({ ...r, [d.key]: v }))} style={pill(ratings[d.key] === v)}>{v}</div>
              ))}
            </div>
          </div>
        ))}

        <div style={{ ...label, marginTop: 8 }}>What most shaped your ratings? (optional)</div>
        <textarea value={justification} onChange={e => setJustification(e.target.value)} rows={4} style={{
          width: '100%', padding: '10px 12px', background: 'var(--surface)', border: '1px solid var(--border)',
          borderRadius: 6, color: 'var(--text)', fontFamily: 'var(--sans)', fontSize: fs(13), lineHeight: 1.6,
          outline: 'none', resize: 'vertical', marginBottom: 18 }} />

        <div style={label}>One last question (optional)</div>
        <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-dim)', lineHeight: 1.6, marginBottom: 8 }}>
          Writers worked with an AI in one of two ways. Which do you think this writer used?
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
          {rubric.condition_guess.map(o => (
            <div key={o.value} onClick={() => setGuess(g => g === o.value ? null : o.value)}
                 style={{ ...pill(guess === o.value), padding: '6px 10px', fontFamily: 'var(--sans)' }}>{o.label}</div>
          ))}
        </div>
        {guess && guess !== 'unsure' && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: fs(12), color: 'var(--text-dim)', marginBottom: 6 }}>
              How confident are you? (1 = a guess, 7 = certain)
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              {[1, 2, 3, 4, 5, 6, 7].map(v => (
                <div key={v} onClick={() => setConfidence(v)} style={pill(confidence === v)}>{v}</div>
              ))}
            </div>
          </div>
        )}

        {error && <StudyError fs={fs} message={error} />}
        <div style={{ display: 'flex', gap: 10, marginTop: 18 }}>
          <button onClick={submit} disabled={busy || !complete} style={{
            flex: 1, padding: '12px 16px', background: 'var(--accent)', border: 'none', borderRadius: 6,
            color: '#111', fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
            cursor: busy || !complete ? 'default' : 'pointer', opacity: busy || !complete ? 0.5 : 1 }}>
            {busy ? '…' : data.rating ? 'SAVE REVISED RATING' : 'SUBMIT RATING'}</button>
          <button onClick={onDone} style={{
            padding: '12px 16px', background: 'none', border: '1px solid var(--border)', borderRadius: 6,
            color: 'var(--text-muted)', fontSize: fs(12), letterSpacing: 1, cursor: 'pointer' }}>BACK</button>
        </div>
        {!complete && (
          <div style={{ marginTop: 8, fontFamily: 'var(--sans)', fontSize: fs(11), color: 'var(--text-muted)' }}>
            Rate all four dimensions to submit.
          </div>
        )}
      </div>
    </div>
  );
}

function JudgeQueue({ fs, onOpen, onOpenText }) {
  const [assignments, setAssignments] = useState(null);
  const [texts, setTexts] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const [t, a] = await Promise.all([api('/api/judge/texts'), api('/api/judge/queue')]);
        setTexts(t.assignments || []);
        setAssignments(a.assignments || []);
      } catch (e) { setError(e.message); }
    })();
  }, []);

  if (error) return <div style={{ padding: 32 }}><StudyError fs={fs} message={error} /></div>;
  if (!assignments || !texts) return <div style={{ padding: 32, color: 'var(--text-muted)', fontSize: fs(12) }}>Loading…</div>;
  // The pilot's judges rate texts. The paired-report queue below is the
  // legacy flow; it only shows for a judge who actually has such items.
  if (assignments.length === 0) return <JudgeTextQueue fs={fs} texts={texts} onOpenText={onOpenText} />;

  const pending = assignments.filter(a => a.status === 'pending');
  const done = assignments.filter(a => a.status !== 'pending');

  return (
    <div>
    {texts.length > 0 && <JudgeTextQueue fs={fs} texts={texts} onOpenText={onOpenText} />}
    <div style={{ maxWidth: 720, margin: '0 auto', padding: 32 }}>
      <h1 style={{ fontSize: fs(22), fontWeight: 300, marginBottom: 6 }}>Your evaluation queue</h1>
      <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(12), marginBottom: 24 }}>
        Each item shows two anonymized outputs. Rate them on the quality dimensions; your judgements are confidential.
      </p>

      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
        TO DO ({pending.length})
      </div>
      {pending.length === 0
        ? <div style={{ color: 'var(--text-muted)', fontSize: fs(12), fontFamily: 'var(--sans)', marginBottom: 20 }}>Nothing to evaluate right now.</div>
        : pending.map(a => (
          <div key={a.id} onClick={() => onOpen(a.id)} style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '12px 14px', marginBottom: 6, borderRadius: 6,
            background: 'var(--surface)', border: '1px solid var(--border)', cursor: 'pointer' }}>
            <span style={{ fontFamily: 'var(--sans)', fontSize: fs(13) }}>Evaluation #{a.id}</span>
            <span style={{ fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)', color: 'var(--accent)' }}>OPEN →</span>
          </div>
        ))}

      {done.length > 0 && (
        <>
          <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', margin: '20px 0 8px' }}>
            COMPLETED ({done.length})
          </div>
          {done.map(a => (
            <div key={a.id} onClick={() => onOpen(a.id)} style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '10px 14px', marginBottom: 4, borderRadius: 6,
              background: 'var(--surface)', border: '1px solid var(--border)', cursor: 'pointer', opacity: 0.7 }}>
              <span style={{ fontFamily: 'var(--sans)', fontSize: fs(12) }}>Evaluation #{a.id}</span>
              <span style={{ fontSize: fs(10), color: 'var(--commit)' }}>✓ submitted</span>
            </div>
          ))}
        </>
      )}
    </div>
    </div>
  );
}

function JudgeRate({ fs, assignmentId, onDone }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  // form state
  const [ratings, setRatings] = useState({}); // {dim: {a, b}}
  const [justA, setJustA] = useState('');
  const [justB, setJustB] = useState('');
  const [winner, setWinner] = useState('');
  const [guessA, setGuessA] = useState('');
  const [guessB, setGuessB] = useState('');
  const [confidence, setConfidence] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const d = await api(`/api/judge/assignments/${assignmentId}`);
        setData(d);
        if (d.rating) {
          // Pre-fill from a prior submission (editable).
          setRatings(d.rating.ratings || {});
          setJustA(d.rating.justification_a || '');
          setJustB(d.rating.justification_b || '');
          setWinner(d.rating.pairwise_winner || '');
          setGuessA(d.rating.condition_guess_a || '');
          setGuessB(d.rating.condition_guess_b || '');
          setConfidence(d.rating.confidence ?? null);
        }
      } catch (e) { setError(e.message); }
    })();
  }, [assignmentId]);

  if (error && !data) return <div style={{ padding: 32 }}><StudyError fs={fs} message={error} /></div>;
  if (!data) return <div style={{ padding: 32, color: 'var(--text-muted)', fontSize: fs(12) }}>Loading…</div>;

  const setDim = (dim, slot, val) => setRatings(r => ({ ...r, [dim]: { ...(r[dim] || {}), [slot]: val } }));
  const allRated = JUDGE_DIMENSIONS.every(d => Number.isInteger(ratings[d.key]?.a) && Number.isInteger(ratings[d.key]?.b));
  const canSubmit = allRated && (winner === 'a' || winner === 'b' || winner === 'tie') && !busy;

  const submit = async () => {
    if (!canSubmit) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/judge/assignments/${assignmentId}/rate`, {
        method: 'POST',
        body: JSON.stringify({
          ratings,
          justification_a: justA,
          justification_b: justB,
          pairwise_winner: winner,
          condition_guess_a: guessA || null,
          condition_guess_b: guessB || null,
          confidence: confidence ?? null,
        }),
      });
      onDone();
    } catch (e) {
      setError(typeof e.message === 'string' ? e.message : 'Submission failed.');
    }
    setBusy(false);
  };

  const likert = (dim, slot) => (
    <div style={{ display: 'flex', gap: 4 }}>
      {[1,2,3,4,5,6,7].map(n => (
        <button key={n} onClick={() => setDim(dim, slot, n)} style={{
          width: 28, height: 28, borderRadius: 14,
          border: '1px solid ' + (ratings[dim]?.[slot] === n ? 'var(--accent)' : 'var(--border)'),
          background: ratings[dim]?.[slot] === n ? 'var(--accent)' : 'var(--surface2)',
          color: ratings[dim]?.[slot] === n ? '#111' : 'var(--text-dim)',
          cursor: 'pointer', fontSize: fs(11), fontFamily: 'var(--mono)' }}>{n}</button>
      ))}
    </div>
  );

  return (
    <div style={{ maxWidth: 1000, margin: '0 auto', padding: 32 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <h1 style={{ fontSize: fs(20), fontWeight: 300 }}>Evaluation #{assignmentId}</h1>
        <button onClick={onDone} style={{
          background: 'none', border: '1px solid var(--border)', borderRadius: 4,
          color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10),
          padding: '2px 8px', fontFamily: 'var(--mono)', letterSpacing: 1 }}>← QUEUE</button>
      </div>

      {/* Side-by-side outputs */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 24 }}>
        {['a','b'].map(slot => (
          <div key={slot} style={{ border: '1px solid var(--border)', borderRadius: 8, overflow: 'hidden' }}>
            <div style={{ padding: '8px 14px', background: 'var(--surface2)', borderBottom: '1px solid var(--border)',
                          fontSize: fs(11), letterSpacing: 2, fontFamily: 'var(--mono)', color: 'var(--opp)' }}>
              OUTPUT {slot.toUpperCase()}
            </div>
            <div style={{ padding: 14, fontSize: fs(12), fontFamily: 'var(--sans)', lineHeight: 1.6,
                          whiteSpace: 'pre-wrap', maxHeight: 420, overflowY: 'auto' }}>
              {data[`slot_${slot}`].content}
            </div>
          </div>
        ))}
      </div>

      {/* Dimension ratings */}
      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 }}>
        QUALITY RATINGS (1 = poor, 7 = excellent)
      </div>
      {JUDGE_DIMENSIONS.map(d => (
        <div key={d.key} style={{ marginBottom: 16, padding: 14, borderRadius: 6,
                                  background: 'var(--surface)', border: '1px solid var(--border)' }}>
          <div style={{ fontFamily: 'var(--sans)', fontSize: fs(13), marginBottom: 2 }}>{d.label}</div>
          <div style={{ fontFamily: 'var(--sans)', fontSize: fs(11), color: 'var(--text-muted)', marginBottom: 10 }}>{d.help}</div>
          <div style={{ display: 'flex', gap: 28, flexWrap: 'wrap' }}>
            <div><div style={{ fontSize: fs(10), color: 'var(--text-muted)', marginBottom: 5 }}>Output A</div>{likert(d.key, 'a')}</div>
            <div><div style={{ fontSize: fs(10), color: 'var(--text-muted)', marginBottom: 5 }}>Output B</div>{likert(d.key, 'b')}</div>
          </div>
        </div>
      ))}

      {/* Justifications */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
        {[['a', justA, setJustA], ['b', justB, setJustB]].map(([slot, val, set]) => (
          <div key={slot}>
            <div style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', marginBottom: 6 }}>
              JUSTIFICATION — OUTPUT {slot.toUpperCase()}
            </div>
            <textarea value={val} onChange={e => set(e.target.value)} rows={3} style={{
              width: '100%', padding: 10, background: 'var(--surface)', border: '1px solid var(--border)',
              borderRadius: 6, color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)',
              outline: 'none', resize: 'vertical' }} />
          </div>
        ))}
      </div>

      {/* Pairwise winner */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', marginBottom: 6 }}>
          OVERALL — WHICH IS BETTER?
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {[['a','Output A'],['tie','About equal'],['b','Output B']].map(([v,label]) => (
            <button key={v} onClick={() => setWinner(v)} style={{
              padding: '8px 16px', borderRadius: 6,
              border: '1px solid ' + (winner === v ? 'var(--accent)' : 'var(--border)'),
              background: winner === v ? 'var(--accent)' : 'var(--surface)',
              color: winner === v ? '#111' : 'var(--text-dim)',
              cursor: 'pointer', fontSize: fs(12), fontFamily: 'var(--sans)' }}>{label}</button>
          ))}
        </div>
      </div>

      {/* Blinding-validation: condition guess + confidence (optional) */}
      <div style={{ marginBottom: 16, padding: 14, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)' }}>
        <div style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', marginBottom: 4 }}>
          OPTIONAL — IF YOU HAD TO GUESS
        </div>
        <div style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)', marginBottom: 10 }}>
          One output was produced through a structured back-and-forth dialogue; the other through free-form chat. Which do you think is which?
        </div>
        {[['A', guessA, setGuessA], ['B', guessB, setGuessB]].map(([label, val, set]) => (
          <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
            <span style={{ width: 70, fontSize: fs(11), fontFamily: 'var(--sans)' }}>Output {label}</span>
            {[['elenchus','dialogue'],['baseline','free-form'],['unsure','unsure']].map(([v,lbl]) => (
              <button key={v} onClick={() => set(val === v ? '' : v)} style={{
                padding: '4px 10px', borderRadius: 4,
                border: '1px solid ' + (val === v ? 'var(--accent)' : 'var(--border)'),
                background: val === v ? 'var(--accent)' : 'var(--surface2)',
                color: val === v ? '#111' : 'var(--text-dim)',
                cursor: 'pointer', fontSize: fs(11), fontFamily: 'var(--sans)' }}>{lbl}</button>
            ))}
          </div>
        ))}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
          <span style={{ width: 70, fontSize: fs(11), fontFamily: 'var(--sans)' }}>Confidence</span>
          {[1,2,3,4,5,6,7].map(n => (
            <button key={n} onClick={() => setConfidence(confidence === n ? null : n)} style={{
              width: 26, height: 26, borderRadius: 13,
              border: '1px solid ' + (confidence === n ? 'var(--accent)' : 'var(--border)'),
              background: confidence === n ? 'var(--accent)' : 'var(--surface2)',
              color: confidence === n ? '#111' : 'var(--text-dim)',
              cursor: 'pointer', fontSize: fs(10), fontFamily: 'var(--mono)' }}>{n}</button>
          ))}
        </div>
      </div>

      <button onClick={submit} disabled={!canSubmit} style={{
        width: '100%', padding: '12px 16px', marginBottom: 40,
        background: canSubmit ? 'var(--accent)' : 'var(--surface)',
        border: 'none', borderRadius: 6, color: '#111',
        fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
        cursor: canSubmit ? 'pointer' : 'default', opacity: canSubmit ? 1 : 0.3 }}>
        {busy ? '…' : (data.rating ? 'UPDATE EVALUATION' : 'SUBMIT EVALUATION')}
      </button>
      {error && <StudyError fs={fs} message={error} />}
    </div>
  );
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
