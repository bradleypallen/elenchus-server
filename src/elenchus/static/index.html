  const heading = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 };
  const th = { padding: '6px 8px', fontWeight: 400, textAlign: 'left', color: 'var(--text-muted)' };
  const td = { padding: '7px 8px', fontFamily: 'var(--sans)' };

  return (
    <div style={{ marginBottom: 28 }}>
      <div style={{ marginBottom: 16, padding: 16, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)' }}>
        <div style={heading}>RATE THE TEXTS — as pairs: a participant's two texts, labelled A and B, blinded</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <select value={studyId} onChange={e => setStudyId(e.target.value)} style={input}>
            {studies.length === 0 && <option value="">no study set up yet</option>}
            {studies.map(st => <option key={st.study_id} value={st.study_id}>{st.study_id}</option>)}
          </select>
          <select value={judgeId} onChange={e => setJudgeId(e.target.value)} style={{ ...input, flex: '1 1 220px' }}>
            {judges.length === 0 && <option value="">no judge accounts yet</option>}
            {judges.map(j => <option key={j.id} value={j.id}>{j.display_name} ({j.email})</option>)}
          </select>
          <button onClick={assignAll} disabled={busy || !studyId || !judgeId} style={{
            padding: '8px 16px', background: 'var(--accent)', border: 'none', borderRadius: 4, color: '#111',
            fontSize: fs(11), letterSpacing: 1, fontWeight: 500, cursor: 'pointer',
            opacity: busy || !studyId || !judgeId ? 0.5 : 1 }}>ASSIGN ALL COMPLETE PAIRS</button>
        </div>
        <div style={{ marginTop: 8, fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)', lineHeight: 1.6 }}>
          A pair is a participant's two texts, one per session; it can be assigned once both are in.
          Each judge gets the pairs in their own random order with their own A/B labelling, and sees only
          the topics and the texts — never the condition or the participant. They rate each text on four
          dimensions with a sentence on each, rank the pair, and — once their queue is done — guess how each
          writer worked. Press again after more pairs complete: only new ones are added.
          {listing && ` ${listing.pairs_available} pair${listing.pairs_available === 1 ? '' : 's'} ready.`}
          {judges.length === 0 && ' Judge accounts are created by an admin (Invites tab, kind “judge”).'}
        </div>
        {note && <div style={{ marginTop: 8, fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--commit)' }}>{note}</div>}
        {error && <div style={{ marginTop: 8, fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--deny)' }}>{error}</div>}
      </div>

      {listing && (
        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 2fr)', gap: 24, alignItems: 'start' }}>
          <div>
            <div style={heading}>PANEL PROGRESS</div>
            {listing.judges.length === 0
              ? <div style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)' }}>Nothing assigned yet.</div>
              : <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
                  <thead><tr><th style={th}>judge</th><th style={th}>pairs done</th><th style={th}>guesses</th></tr></thead>
                  <tbody>{listing.judges.map(j => (
                    <tr key={j.judge_actor_id} style={{ borderTop: '1px solid var(--border)' }}>
                      <td style={td}>{j.display_name}</td>
                      <td style={{ ...td, color: j.completed === j.assigned ? 'var(--commit)' : 'var(--text-dim)' }}>{j.completed} / {j.assigned}</td>
                      <td style={{ ...td, color: j.guesses === j.guesses_required ? 'var(--commit)' : 'var(--text-dim)' }}>{j.guesses} / {j.guesses_required}</td>
                    </tr>))}</tbody>
                </table>}
          </div>
          <div>
            <div style={heading}>SUBMITTED TEXTS ({listing.texts.length})</div>
            {listing.texts.length === 0
              ? <div style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)' }}>No participant has submitted a text yet.</div>
              : <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
                  <thead><tr>
                    <th style={th}>participant</th><th style={th}>session</th><th style={th}>condition</th>
                    <th style={th}>topic</th><th style={th}>words</th><th style={th}>rated</th>
                  </tr></thead>
                  <tbody>{listing.texts.map(t => (
                    <tr key={t.text_id} style={{ borderTop: '1px solid var(--border)' }}>
                      <td style={{ ...td, fontFamily: 'var(--mono)' }}>{t.participant_code || '—'}</td>
                      <td style={td}>{t.period || '—'}</td>
                      <td style={td}>{t.condition}</td>
                      <td style={{ ...td, color: 'var(--text-dim)' }}>{t.topic_title}</td>
                      <td style={td}>{t.word_count}</td>
                      <td style={{ ...td, color: t.assigned && t.rated === t.assigned ? 'var(--commit)' : 'var(--text-dim)' }}>{t.rated} / {t.assigned}</td>
                    </tr>))}</tbody>
                </table>}
          </div>
        </div>
      )}
    </div>
  );
}

function AdminJudgingTab({ fs }) {
  // The panel's judging of the participants' own texts (text_judging.py).
  // The earlier paired-structured-report flow was retired in 0.12.0.
  return <AdminTextJudgingPanel fs={fs} />;
}

// ── Costs (admin only) ──
//
// LLM spend, priced on the server *at read time* from the recorded
// token counts (costs.py) — so the figures here are always under the
// current price table, and a model without a rate shows as UNPRICED
// rather than as $0.
function usd(v, digits = 2) {
  if (v === null || v === undefined) return '—';
  return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function compactTokens(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k';
  return String(n);
}

// The infrastructure ledger (cost_ledger.py): charges an admin records
// from invoices. Recurring items forecast and remind; they are never
// themselves counted as spend. The LLM provider's own monthly figure is
// kept for reconciliation only — that money is already counted from tokens.
function CostLedgerPanel({ fs, infra, onChanged }) {
  // The admin's own calendar day — toISOString() would give the UTC date,
  // which is already tomorrow for an evening in the Americas.
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const blank = { incurred_on: today, category: 'hosting', vendor: '', description: '', amount: '',
                  currency: 'USD', amount_usd: '', invoice_ref: '', covers_month: '', estimated: false };
  const blankRecurring = { category: 'hosting', vendor: '', description: '', amount_usd: '', cadence: 'monthly', starts_on: today };
  const [ledger, setLedger] = useState(null);
  const [form, setForm] = useState(blank);
  const [editingId, setEditingId] = useState(null);
  const [recurringForm, setRecurringForm] = useState(blankRecurring);
  const [endingId, setEndingId] = useState(null);
  const [endDate, setEndDate] = useState(today);
  const [showVoided, setShowVoided] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [notice, setNotice] = useState(null);
  const [openMonth, setOpenMonth] = useState(null);
  const [importNote, setImportNote] = useState(null);
  const [importError, setImportError] = useState(null);

  const uploadProviderReport = async (file) => {
    if (!file || busy) return;
    setBusy(true); setImportError(null); setImportNote(null);
    try {
      let payload;
      try { payload = JSON.parse(await file.text()); }
      catch (e) { throw new Error('That file isn’t JSON — upload the file elenchus-provider-report wrote.'); }
      const r = await api('/api/admin/costs/provider-report', { method: 'POST', body: JSON.stringify(payload) });
      setImportNote(`Imported ${r.period_from} → ${r.period_to}: ${usd(r.total_cost_usd)} in ${r.rows} rows` +
                    (r.rows_replaced ? `, replacing ${r.rows_replaced} from an earlier report.` : '.'));
      await load(); onChanged && onChanged();
    } catch (e) { setImportError(e.message); }
    setBusy(false);
  };

  const load = async () => {
    try { setLedger(await api('/api/admin/costs/ledger')); }
    catch (e) { setError(e.message); }
  };
  useEffect(() => { load(); }, []);

  const run = async (fn) => {
    if (busy) return;
    setBusy(true); setError(null); setNotice(null);
    try { await fn(); await load(); onChanged && onChanged(); }
    catch (e) { setError(e.message); }
    setBusy(false);
  };

  const saveEntry = () => run(async () => {
    const body = { ...form, amount: form.amount === '' ? null : Number(form.amount),
                   amount_usd: form.amount_usd === '' ? null : Number(form.amount_usd) };
    if (editingId) await api(`/api/admin/costs/ledger/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/api/admin/costs/ledger', { method: 'POST', body: JSON.stringify(body) });
    setForm(blank); setEditingId(null);
  });
  const editEntry = (e) => {
    setEditingId(e.id); setError(null); setNotice(null);
    setForm({ incurred_on: e.incurred_on, category: e.category, vendor: e.vendor, description: e.description,
              amount: String(e.amount), currency: e.currency, amount_usd: e.currency === 'USD' ? '' : String(e.amount_usd),
              invoice_ref: e.invoice_ref, covers_month: e.covers_month, estimated: e.estimated });
  };
  const voidEntry = (e) => {
    const reason = prompt(`Void this entry (${e.vendor}, ${usd(e.amount_usd)})? It stays in the ledger but is left out of every total.\n\nReason (optional):`, '');
    if (reason === null) return;
    run(() => api(`/api/admin/costs/ledger/${e.id}/void`, { method: 'POST', body: JSON.stringify({ reason }) }));
  };
  const recordMonth = (month) => run(async () => {
    const r = await api('/api/admin/costs/ledger/record-recurring', { method: 'POST', body: JSON.stringify({ month }) });
    setNotice(`${r.created.length} estimated entr${r.created.length === 1 ? 'y' : 'ies'} added for ${month}. Check each against the invoice, then edit it and untick “estimated”.`);
  });
  const addRecurring = () => run(async () => {
    await api('/api/admin/costs/recurring', { method: 'POST',
      body: JSON.stringify({ ...recurringForm, amount_usd: recurringForm.amount_usd === '' ? null : Number(recurringForm.amount_usd) }) });
    setRecurringForm(blankRecurring);
  });
  const endRecurring = (id) => run(async () => {
    await api(`/api/admin/costs/recurring/${id}/end`, { method: 'PUT', body: JSON.stringify({ ends_on: endDate }) });
    setEndingId(null);
  });

  const heading = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 };
  const card = { padding: 16, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)' };
  const th = { padding: '6px 8px', fontWeight: 400, textAlign: 'left', color: 'var(--text-muted)' };
  const thr = { ...th, textAlign: 'right' };
  const td = { padding: '7px 8px', fontFamily: 'var(--sans)' };
  const tdr = { ...td, textAlign: 'right', fontFamily: 'var(--mono)', whiteSpace: 'nowrap' };
  const note = { fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)', lineHeight: 1.6 };
  const input = { padding: '7px 9px', background: 'var(--surface2)', border: '1px solid var(--border)',
                  borderRadius: 4, color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)', outline: 'none' };
  const smallButton = { background: 'none', border: '1px solid var(--border)', borderRadius: 4,
                        color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10), padding: '3px 10px',
                        letterSpacing: 1, fontFamily: 'var(--mono)' };
  const primary = { padding: '7px 16px', background: 'var(--accent)', border: 'none', borderRadius: 4, color: '#111',
                    fontSize: fs(11), letterSpacing: 1, fontWeight: 500, cursor: 'pointer', opacity: busy ? 0.5 : 1 };
  const tag = (text, color) => (
    <span style={{ marginLeft: 6, fontSize: fs(9), letterSpacing: 1, color, border: `1px solid ${color}`,
                   borderRadius: 3, padding: '0 4px', fontFamily: 'var(--mono)' }}>{text}</span>
  );

  if (!ledger) return <div style={{ ...note, marginTop: 16 }}>{error || 'Loading the ledger…'}</div>;

  const categories = ledger.categories;
  const isReconciliation = form.category === ledger.reconciliation_category;
  const entries = ledger.entries.filter(e => showVoided || !e.voided);
  const voidedCount = ledger.entries.filter(e => e.voided).length;
  const maxMonth = Math.max(0, ...infra.by_month.map(m => m.amount_usd));
  const active = (r) => !r.ends_on || r.ends_on >= today;

  return (
    <div style={{ marginTop: 28 }}>
      <div style={{ ...heading, fontSize: fs(11), color: 'var(--text)' }}>INFRASTRUCTURE LEDGER</div>
      <div style={{ ...note, marginBottom: 14 }}>
        Hosting, domain and email charges can’t be measured the way tokens are, so they are entered here from
        invoices — whoever the host is. Entries are never deleted: a wrong one is voided and drops out of every total.
      </div>

      {infra.unrecorded.length > 0 && (
        <div style={{ ...card, borderColor: 'var(--accent)', marginBottom: 16 }}>
          <div style={{ ...heading, color: 'var(--accent)' }}>EXPECTED BUT NOT YET RECORDED — ABOUT {usd(infra.unrecorded_usd)}</div>
          <div style={{ ...note, marginBottom: 8 }}>
            The recurring charges below expected something in these months, and nothing has been entered. “Record”
            adds each as an <i>estimated</i> entry for you to check against the invoice.
          </div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {infra.unrecorded.map(m => (
              <button key={m.month} disabled={busy} onClick={() => recordMonth(m.month)} style={smallButton}
                      title={`${m.items} recurring charge${m.items === 1 ? '' : 's'}`}>
                RECORD {m.month} · {usd(m.amount_usd)}
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: 16, marginBottom: 16 }}>
        <div style={card}>
          <div style={heading}>RECORDED PER MONTH — LAST 12 MONTHS</div>
          {maxMonth === 0 ? <div style={note}>Nothing recorded yet.</div> : (
            <div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: 70 }}>
                {infra.by_month.map(m => (
                  <div key={m.month} title={`${m.month}: ${usd(m.amount_usd)}${m.estimated_usd ? ` (${usd(m.estimated_usd)} estimated)` : ''}`}
                       style={{ flex: 1, height: `${Math.max(m.amount_usd > 0 ? 4 : 0, 100 * m.amount_usd / maxMonth)}%`,
                                background: 'var(--accent)', opacity: 0.85, borderRadius: '2px 2px 0 0' }} />
                ))}
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', ...note, marginTop: 4 }}>
                <span>{infra.by_month[0].month}</span><span>{infra.by_month[infra.by_month.length - 1].month}</span>
              </div>
            </div>
          )}
          <div style={{ ...note, marginTop: 8 }}>
            Run-rate {usd(infra.run_rate_monthly_usd)} a month from the recurring charges (a yearly charge counts as a twelfth).
            {infra.unconfirmed.entries > 0 && ` ${infra.unconfirmed.entries} estimated entr${infra.unconfirmed.entries === 1 ? 'y' : 'ies'} (${usd(infra.unconfirmed.amount_usd)}) not yet checked against an invoice.`}
          </div>
        </div>
        <div style={card}>
          <div style={heading}>LLM RECONCILIATION — THE PROVIDER’S BOOKS VS THE PLATFORM’S</div>
          {infra.reconciliation.length === 0
            ? <div style={note}>
                Nothing to compare yet. Import the provider’s own figures (below), or add an entry in the category
                “{categories[ledger.reconciliation_category]}” with a month’s cost read off the provider’s console.
                Either is compared here and never added to a total.
              </div>
            : <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
                <thead><tr><th style={th}>month</th><th style={thr}>provider</th><th style={thr}>computed</th><th style={thr}>difference</th></tr></thead>
                <tbody>{infra.reconciliation.map(r => (
                  <React.Fragment key={r.month}>
                    <tr style={{ borderTop: '1px solid var(--border)', cursor: r.models.length ? 'pointer' : 'default' }}
                        onClick={() => r.models.length && setOpenMonth(openMonth === r.month ? null : r.month)}>
                      <td style={{ ...td, fontFamily: 'var(--mono)' }}>
                        {r.models.length > 0 && <span style={{ color: 'var(--text-muted)' }}>{openMonth === r.month ? '▾ ' : '▸ '}</span>}
                        {r.month}
                        <span style={{ color: 'var(--text-muted)', fontFamily: 'var(--sans)' }}>
                          {r.source === 'imported' ? ` · imported, ${r.days_covered} of ${r.days_in_month} days` : ' · typed in'}
                        </span>
                      </td>
                      <td style={tdr}>{usd(r.provider_usd)}</td>
                      <td style={tdr}>{usd(r.computed_usd)}</td>
                      <td style={{ ...tdr, color: Math.abs(r.difference_pct || 0) > 10 ? 'var(--deny)' : 'var(--text-dim)' }}>
                        {r.difference_usd >= 0 ? '+' : '−'}{usd(Math.abs(r.difference_usd))}
                        {r.difference_pct !== null && ` (${r.difference_pct >= 0 ? '+' : '−'}${Math.abs(r.difference_pct).toFixed(0)}%)`}
                      </td>
                    </tr>
                    {openMonth === r.month && r.models.map(m => (
                      <tr key={r.month + m.model} style={{ background: 'var(--surface2)' }}>
                        <td style={{ ...td, paddingLeft: 22 }} colSpan={4}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
                            <span style={{ fontFamily: 'var(--mono)' }}>{m.model}</span>
                            <span style={{ fontFamily: 'var(--mono)', color: 'var(--text-dim)' }}>
                              provider {compactTokens(m.provider_input_tokens)} in / {compactTokens(m.provider_output_tokens)} out · {usd(m.provider_usd)}
                              {'  ·  '}platform {compactTokens(m.platform_input_tokens)} in / {compactTokens(m.platform_output_tokens)} out · {usd(m.computed_usd)}
                            </span>
                          </div>
                          <div style={{ ...note, color: m.verdict === 'agrees' ? 'var(--commit)' : 'var(--deny)' }}>{m.verdict_text}</div>
                        </td>
                      </tr>
                    ))}
                    {openMonth === r.month && (r.non_token_usd > 0 || r.cache_tokens > 0 || r.entered_usd !== null) && r.source === 'imported' && (
                      <tr style={{ background: 'var(--surface2)' }}><td style={{ ...td, paddingLeft: 22 }} colSpan={4}><div style={note}>
                        {r.non_token_usd > 0 && `${usd(r.non_token_usd)} of the provider’s figure isn’t tokens (web search, code execution) — the platform doesn’t count those. `}
                        {r.cache_tokens > 0 && `${compactTokens(r.cache_tokens)} of the provider’s input tokens went through the prompt cache, which the platform’s usage table doesn’t distinguish. `}
                        {r.entered_usd !== null && `A typed-in figure of ${usd(r.entered_usd)} also exists for this month; the imported report is used.`}
                      </div></td></tr>
                    )}
                  </React.Fragment>))}</tbody>
              </table>}
          <div style={{ marginTop: 12, paddingTop: 10, borderTop: '1px solid var(--border)' }}>
            <label style={{ ...smallButton, display: 'inline-block', opacity: busy ? 0.5 : 1 }}>
              IMPORT A PROVIDER REPORT…
              <input type="file" accept="application/json,.json" style={{ display: 'none' }} disabled={busy}
                     onChange={e => { const f = e.target.files[0]; e.target.value = ''; uploadProviderReport(f); }} />
            </label>
            <div style={{ ...note, marginTop: 8 }}>
              Make the file on your own machine — never on this server — with an Admin API key in
              {' '}<span style={{ fontFamily: 'var(--mono)' }}>ANTHROPIC_ADMIN_KEY</span>:
              {' '}<span style={{ fontFamily: 'var(--mono)' }}>elenchus-provider-report --month 2026-10 --workspace-id wrkspc_… --out report.json</span>.
              A fresher report for the same days replaces the older one.
            </div>
            {ledger.provider_imports.length > 0 && (
              <div style={{ ...note, marginTop: 6 }}>
                Last import: {ledger.provider_imports[0].period_from} → {ledger.provider_imports[0].period_to},
                {' '}{usd(ledger.provider_imports[0].total_cost_usd)}, fetched {ledger.provider_imports[0].fetched_at || 'at an unknown time'}
                {' '}(usage scope: {ledger.provider_imports[0].scope.usage || 'unknown'}; cost scope: {ledger.provider_imports[0].scope.cost || 'unknown'}).
              </div>
            )}
            {importNote && <div style={{ ...note, color: 'var(--commit)', marginTop: 6 }}>{importNote}</div>}
            {importError && <div style={{ ...note, color: 'var(--deny)', marginTop: 6 }}>{importError}</div>}
          </div>
        </div>
      </div>

      <div style={{ ...card, marginBottom: 16 }}>
        <div style={heading}>{editingId ? `EDIT ENTRY #${editingId}` : 'ADD AN ENTRY'}</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <input aria-label="Date of the charge" type="date" value={form.incurred_on}
                 onChange={e => setForm({ ...form, incurred_on: e.target.value })} style={input} />
          <select aria-label="Category" value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} style={input}>
            {Object.entries(categories).map(([k, label]) => <option key={k} value={k}>{label}</option>)}
          </select>
          <input aria-label="Vendor" placeholder="vendor (e.g. AWS Lightsail)" value={form.vendor}
                 onChange={e => setForm({ ...form, vendor: e.target.value })} style={{ ...input, flex: '1 1 180px' }} />
          <input aria-label="Description" placeholder="description" value={form.description}
                 onChange={e => setForm({ ...form, description: e.target.value })} style={{ ...input, flex: '2 1 220px' }} />
        </div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginTop: 8 }}>
          <input aria-label="Amount" placeholder="amount (negative for a credit)" inputMode="decimal" value={form.amount}
                 onChange={e => setForm({ ...form, amount: e.target.value })} style={{ ...input, width: 210 }} />
          <input aria-label="Currency" value={form.currency} maxLength={3}
                 onChange={e => setForm({ ...form, currency: e.target.value.toUpperCase() })} style={{ ...input, width: 64, fontFamily: 'var(--mono)' }} />
          {form.currency !== 'USD' && (
            <input aria-label="US-dollar equivalent" placeholder="USD charged to the budget" inputMode="decimal" value={form.amount_usd}
                   onChange={e => setForm({ ...form, amount_usd: e.target.value })} style={{ ...input, width: 200 }} />
          )}
          <input aria-label="Invoice reference" placeholder="invoice reference" value={form.invoice_ref}
                 onChange={e => setForm({ ...form, invoice_ref: e.target.value })} style={{ ...input, flex: '1 1 160px' }} />
          <label style={{ ...note, display: 'flex', alignItems: 'center', gap: 6 }}>
            {isReconciliation ? 'usage month' : 'covers'}
            <input aria-label="Month covered" type="month" value={form.covers_month}
                   onChange={e => setForm({ ...form, covers_month: e.target.value })} style={input} />
          </label>
          <label style={{ ...note, display: 'flex', alignItems: 'center', gap: 6 }}>
            <input type="checkbox" checked={form.estimated} onChange={e => setForm({ ...form, estimated: e.target.checked })} />
            estimated
          </label>
        </div>
        {isReconciliation && (
          <div style={{ ...note, marginTop: 8 }}>
            This records what the LLM provider says a month of usage cost. It is shown next to the computed figure
            and <b>not</b> added to any total — that spend is already counted from tokens.
          </div>
        )}
        <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
          <button onClick={saveEntry} disabled={busy} style={primary}>{editingId ? 'SAVE' : 'ADD'}</button>
          {editingId && <button onClick={() => { setEditingId(null); setForm(blank); }} style={smallButton}>CANCEL</button>}
        </div>
        {notice && <div style={{ ...note, color: 'var(--commit)', marginTop: 8 }}>{notice}</div>}
        {error && <div style={{ ...note, color: 'var(--deny)', marginTop: 8 }}>{error}</div>}
      </div>

      <div style={{ ...card, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={heading}>ENTRIES ({entries.length})</div>
          {voidedCount > 0 && <button style={smallButton} onClick={() => setShowVoided(!showVoided)}>
            {showVoided ? 'HIDE VOIDED' : `SHOW VOIDED (${voidedCount})`}</button>}
        </div>
        {entries.length === 0 ? <div style={note}>No entries yet.</div> :
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
            <thead><tr>
              <th style={th}>date</th><th style={th}>category</th><th style={th}>vendor</th><th style={th}>invoice</th>
              <th style={thr}>amount</th><th style={thr}>USD</th><th style={th}></th>
            </tr></thead>
            <tbody>{entries.map(e => (
              <tr key={e.id} style={{ borderTop: '1px solid var(--border)', opacity: e.voided ? 0.45 : 1 }}>
                <td style={{ ...td, fontFamily: 'var(--mono)', whiteSpace: 'nowrap' }}>{e.incurred_on}</td>
                <td style={td}>{e.category === ledger.reconciliation_category ? 'LLM provider’s figure' : e.category}</td>
                <td style={td}>
                  {e.vendor}
                  {e.description && <span style={{ color: 'var(--text-dim)' }}> — {e.description}</span>}
                  {e.covers_month && <span style={{ color: 'var(--text-muted)' }}> · {e.covers_month}</span>}
                  {e.estimated && !e.voided && tag('ESTIMATED', 'var(--accent)')}
                  {e.voided && tag('VOID', 'var(--deny)')}
                  {e.voided && e.void_reason && <span style={{ color: 'var(--text-muted)' }}> {e.void_reason}</span>}
                </td>
                <td style={{ ...td, color: 'var(--text-dim)' }}>{e.invoice_ref || '—'}</td>
                <td style={tdr}>{e.currency === 'USD' ? '' : `${e.amount.toFixed(2)} ${e.currency}`}</td>
                <td style={{ ...tdr, textDecoration: e.voided ? 'line-through' : 'none' }}>{usd(e.amount_usd)}</td>
                <td style={{ ...td, textAlign: 'right', whiteSpace: 'nowrap' }}>
                  {!e.voided && (
                    <span style={{ display: 'inline-flex', gap: 6 }}>
                      <button style={smallButton} disabled={busy} onClick={() => editEntry(e)}>EDIT</button>
                      <button style={{ ...smallButton, color: 'var(--deny)', borderColor: 'var(--deny)' }} disabled={busy} onClick={() => voidEntry(e)}>VOID</button>
                    </span>
                  )}
                </td>
              </tr>))}</tbody>
          </table>}
      </div>

      <div style={card}>
        <div style={heading}>RECURRING CHARGES — A FORECAST, NEVER COUNTED AS SPEND</div>
        {ledger.recurring.length > 0 && (
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11), marginBottom: 12 }}>
            <thead><tr><th style={th}>vendor</th><th style={th}>category</th><th style={thr}>USD</th><th style={th}>every</th><th style={th}>from</th><th style={th}>until</th><th style={th}></th></tr></thead>
            <tbody>{ledger.recurring.map(r => (
              <tr key={r.id} style={{ borderTop: '1px solid var(--border)', opacity: active(r) ? 1 : 0.5 }}>
                <td style={td}>{r.vendor}{r.description && <span style={{ color: 'var(--text-dim)' }}> — {r.description}</span>}</td>
                <td style={td}>{r.category}</td>
                <td style={tdr}>{usd(r.amount_usd)}</td>
                <td style={td}>{r.cadence === 'yearly' ? 'year' : 'month'}</td>
                <td style={{ ...td, fontFamily: 'var(--mono)' }}>{r.starts_on}</td>
                <td style={{ ...td, fontFamily: 'var(--mono)' }}>{r.ends_on || '—'}</td>
                <td style={{ ...td, textAlign: 'right', whiteSpace: 'nowrap' }}>
                  {endingId === r.id ? (
                    <span style={{ display: 'inline-flex', gap: 6, alignItems: 'center' }}>
                      <input aria-label="Last day this charge applies" type="date" value={endDate}
                             onChange={e => setEndDate(e.target.value)} style={{ ...input, padding: '3px 6px' }} />
                      <button style={smallButton} disabled={busy} onClick={() => endRecurring(r.id)}>END</button>
                      <button style={smallButton} onClick={() => setEndingId(null)}>CANCEL</button>
                    </span>
                  ) : active(r) && <button style={smallButton} onClick={() => { setEndingId(r.id); setEndDate(today); }}>END…</button>}
                </td>
              </tr>))}</tbody>
          </table>
        )}
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <select aria-label="Recurring category" value={recurringForm.category}
                  onChange={e => setRecurringForm({ ...recurringForm, category: e.target.value })} style={input}>
            {ledger.infra_categories.map(k => <option key={k} value={k}>{categories[k]}</option>)}
          </select>
          <input aria-label="Recurring vendor" placeholder="vendor" value={recurringForm.vendor}
                 onChange={e => setRecurringForm({ ...recurringForm, vendor: e.target.value })} style={{ ...input, flex: '1 1 160px' }} />
          <input aria-label="Recurring description" placeholder="description" value={recurringForm.description}
                 onChange={e => setRecurringForm({ ...recurringForm, description: e.target.value })} style={{ ...input, flex: '1 1 160px' }} />
          <input aria-label="Recurring amount in US dollars" placeholder="USD" inputMode="decimal" value={recurringForm.amount_usd}
                 onChange={e => setRecurringForm({ ...recurringForm, amount_usd: e.target.value })} style={{ ...input, width: 90 }} />
          <select aria-label="How often" value={recurringForm.cadence}
                  onChange={e => setRecurringForm({ ...recurringForm, cadence: e.target.value })} style={input}>
            <option value="monthly">every month</option><option value="yearly">every year</option>
          </select>
          <label style={{ ...note, display: 'flex', alignItems: 'center', gap: 6 }}>from
            <input aria-label="First charge date" type="date" value={recurringForm.starts_on}
                   onChange={e => setRecurringForm({ ...recurringForm, starts_on: e.target.value })} style={input} />
          </label>
          <button onClick={addRecurring} disabled={busy} style={primary}>ADD</button>
        </div>
        <div style={{ ...note, marginTop: 8 }}>
          A price change is: end the old charge, add a new one. Recurring charges give the run-rate, the projection
          against the budget, and the reminder above — the ledger only ever sums what has actually been entered.
        </div>
      </div>
    </div>
  );
}

function AdminCostsTab({ fs }) {
  const [days, setDays] = useState(30);
  const [report, setReport] = useState(null);
  const [error, setError] = useState(null);
  const [openStudy, setOpenStudy] = useState(null);
  const [editingBudget, setEditingBudget] = useState(false);
  const [budgetForm, setBudgetForm] = useState({ llm_usd: '', infra_usd: '', period_start: '', period_end: '', label: '' });
  const [budgetError, setBudgetError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [alertDraft, setAlertDraft] = useState(null);
  const [alertError, setAlertError] = useState(null);

  const saveAlert = async (value) => {
    if (busy) return;
    setBusy(true); setAlertError(null);
    try {
      await api('/api/admin/costs/alert', { method: 'PUT', body: JSON.stringify({ daily_usd: value }) });
      setAlertDraft(null);
      await load(days);
    } catch (e) { setAlertError(e.message); }
    setBusy(false);
  };

  const load = async (d = days) => {
    setError(null);
    try { setReport(await api(`/api/admin/costs?days=${d}`)); }
    catch (e) { setError(e.message); }
  };
  useEffect(() => { load(days); }, [days]);

  const startEditingBudget = () => {
    const b = report?.budget;
    setBudgetForm(b
      ? { llm_usd: b.llm_usd ? String(b.llm_usd) : '', infra_usd: b.infra_usd ? String(b.infra_usd) : '',
          period_start: b.period_start, period_end: b.period_end, label: b.label || '' }
      : { llm_usd: '', infra_usd: '', period_start: '', period_end: '', label: '' });
    setBudgetError(null); setEditingBudget(true);
  };
  const saveBudget = async (clear) => {
    if (busy) return;
    setBusy(true); setBudgetError(null);
    try {
      await api('/api/admin/costs/budget', {
        method: 'PUT',
        body: JSON.stringify(clear ? {} : {
          ...budgetForm,
          llm_usd: budgetForm.llm_usd === '' ? null : Number(budgetForm.llm_usd),
          infra_usd: budgetForm.infra_usd === '' ? null : Number(budgetForm.infra_usd),
        }),
      });
      setEditingBudget(false);
      await load(days);
    } catch (e) { setBudgetError(e.message); }
    setBusy(false);
  };

  const heading = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 };
  const card = { padding: 16, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)' };
  const th = { padding: '6px 8px', fontWeight: 400, textAlign: 'left', color: 'var(--text-muted)' };
  const thr = { ...th, textAlign: 'right' };
  const td = { padding: '7px 8px', fontFamily: 'var(--sans)' };
  const tdr = { ...td, textAlign: 'right', fontFamily: 'var(--mono)' };
  const note = { fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)', lineHeight: 1.6 };
  const input = { padding: '8px 10px', background: 'var(--surface2)', border: '1px solid var(--border)',
                  borderRadius: 4, color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)', outline: 'none' };
  const smallButton = { background: 'none', border: '1px solid var(--border)', borderRadius: 4,
                        color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10), padding: '3px 10px',
                        letterSpacing: 1, fontFamily: 'var(--mono)' };

  if (error) return <div style={{ ...note, color: 'var(--deny)' }}>{error}</div>;
  if (!report) return <div style={note}>Loading…</div>;

  const span = report.window.days ? `last ${report.window.days} days` : 'all time';
  const t = report.totals;
  const it = report.infrastructure.totals;
  const maxDay = Math.max(0, ...report.by_day.map(d => d.cost_usd));
  const budget = report.budget;

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 16 }}>
        <div style={note}>
          LLM spend is priced from recorded token counts under the current price table
          (checked {report.prices_as_of}); infrastructure is what has been entered in the ledger below.
          The providers’ invoices are the final word.
        </div>
        <div style={{ display: 'flex', gap: 4 }}>
          {[[7, '7 D'], [30, '30 D'], [90, '90 D'], [0, 'ALL']].map(([d, label]) => (
            <button key={d} onClick={() => setDays(d)} style={{
              ...smallButton,
              background: days === d ? 'var(--surface)' : 'none',
              borderColor: days === d ? 'var(--border-focus)' : 'var(--border)',
              color: days === d ? 'var(--text)' : 'var(--text-muted)' }}>{label}</button>
          ))}
        </div>
      </div>

      {report.alert.exceeded && (
        <div style={{ ...card, borderColor: 'var(--deny)', marginBottom: 16 }}>
          <div style={{ ...heading, color: 'var(--deny)' }}>
            TODAY’S LLM SPEND IS {usd(report.alert.today_usd)} — {report.alert.times_threshold.toFixed(1)}× THE {usd(report.alert.daily_usd)} ALERT THRESHOLD
          </div>
          <div style={note}>
            A day costing this much usually means a runaway: a client in a loop, a script on the message route, or a
            far more expensive model. Set the window to 7 days and look at <i>By model</i>, <i>By purpose</i> and
            {' '}<i>By account</i> below. Nothing has been cut off.
          </div>
        </div>
      )}

      {report.unpriced.length > 0 && (
        <div style={{ ...card, borderColor: 'var(--deny)', marginBottom: 16 }}>
          <div style={{ ...heading, color: 'var(--deny)' }}>UNPRICED MODELS — NOT INCLUDED IN ANY FIGURE BELOW</div>
          {report.unpriced.map(u => (
            <div key={u.model} style={{ ...note, color: 'var(--text)' }}>
              <span style={{ fontFamily: 'var(--mono)' }}>{u.model}</span> — {compactTokens(u.prompt_tokens)} tokens in,
              {' '}{compactTokens(u.completion_tokens)} out, {u.calls} call{u.calls === 1 ? '' : 's'}
            </div>
          ))}
          <div style={{ ...note, marginTop: 6 }}>
            There is no rate for {report.unpriced.length === 1 ? 'this model' : 'these models'} in the price table.
            Add one with the <span style={{ fontFamily: 'var(--mono)' }}>ELENCHUS_PRICING_JSON</span> setting and
            restart; the history is then priced too.
          </div>
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12, marginBottom: 16 }}>
        {[['MONTH TO DATE', t.month_to_date, it.month_to_date], [span.toUpperCase(), t.window, it.window],
          ['ALL TIME', t.all_time, it.all_time]].map(([label, b, i]) => (
          <div key={label} style={card}>
            <div style={heading}>{label}</div>
            <div style={{ fontSize: fs(22), fontFamily: 'var(--mono)', color: 'var(--text)' }}>{usd(b.cost_usd + i.amount_usd)}</div>
            <div style={{ ...note, marginTop: 4 }}>
              LLM {usd(b.cost_usd)} · infrastructure {usd(i.amount_usd)}
            </div>
            <div style={note}>
              {b.calls.toLocaleString()} calls · {compactTokens(b.prompt_tokens)} in · {compactTokens(b.completion_tokens)} out
            </div>
          </div>
        ))}
      </div>

      <div style={{ ...card, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={heading}>BUDGET{budget?.label ? ` — ${budget.label}` : ''}</div>
          {!editingBudget && <button style={smallButton} onClick={startEditingBudget}>{budget ? 'EDIT' : 'SET A BUDGET'}</button>}
        </div>
        {!editingBudget && !budget && (
          <div style={note}>No budget set. Give an LLM line, an infrastructure line, or both, and the period they cover.</div>
        )}
        {!editingBudget && budget && (
          <div>
            {[['LLM API', budget.llm], ['INFRASTRUCTURE', budget.infra]].filter(([, b]) => b).map(([name, b]) => (
              <div key={name} style={{ marginBottom: 12 }}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: fs(13), color: 'var(--text)' }}>
                  <span style={{ color: 'var(--text-muted)', fontSize: fs(10), letterSpacing: 1, marginRight: 10 }}>{name}</span>
                  {usd(b.spent_usd)} <span style={{ color: 'var(--text-muted)' }}>of {usd(b.amount_usd)}</span>
                  <span style={{ color: 'var(--text-muted)', fontSize: fs(11) }}> · {b.pct_spent.toFixed(1)}% spent · {usd(b.remaining_usd)} left</span>
                </div>
                <div title={`${b.pct_spent.toFixed(1)}% of the budget spent; ${budget.pct_period_elapsed.toFixed(0)}% of the period elapsed`}
                     style={{ position: 'relative', height: 10, borderRadius: 5, background: 'var(--surface2)', margin: '8px 0 4px', overflow: 'hidden' }}>
                  <div style={{ width: `${Math.min(100, b.pct_spent)}%`, height: '100%',
                                background: b.pct_spent > 100 ? 'var(--deny)' : 'var(--accent)' }} />
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: `${Math.min(100, budget.pct_period_elapsed)}%`,
                                width: 2, background: 'var(--text)' }} />
                </div>
                {b.projected_usd !== undefined && (
                  <div style={note}>
                    Projected {usd(b.projected_usd)} by the end of the period: {usd(b.spent_usd)} recorded
                    {b.unrecorded_usd > 0 && `, about ${usd(b.unrecorded_usd)} expected but not yet entered`}
                    , {usd(b.upcoming_usd)} still to come from the recurring charges.
                  </div>
                )}
                {b.spent_before_period_usd > 0 && (
                  <div style={note}>{usd(b.spent_before_period_usd)} was spent before the period opened and is not charged to it.</div>
                )}
              </div>
            ))}
            <div style={note}>
              {budget.period_start} → {budget.period_end} · the marker shows how much of the period has passed
              ({budget.pct_period_elapsed.toFixed(0)}%). Display only — nothing is cut off when a budget is exceeded.
            </div>
          </div>
        )}
        {editingBudget && (
          <div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
              <input aria-label="LLM budget in US dollars" placeholder="LLM (USD)" inputMode="decimal" value={budgetForm.llm_usd}
                     onChange={e => setBudgetForm({ ...budgetForm, llm_usd: e.target.value })} style={{ ...input, width: 130 }} />
              <input aria-label="Infrastructure budget in US dollars" placeholder="infrastructure (USD)" inputMode="decimal" value={budgetForm.infra_usd}
                     onChange={e => setBudgetForm({ ...budgetForm, infra_usd: e.target.value })} style={{ ...input, width: 170 }} />
              <input aria-label="Period start" type="date" value={budgetForm.period_start}
                     onChange={e => setBudgetForm({ ...budgetForm, period_start: e.target.value })} style={input} />
              <span style={note}>to</span>
              <input aria-label="Period end" type="date" value={budgetForm.period_end}
                     onChange={e => setBudgetForm({ ...budgetForm, period_end: e.target.value })} style={input} />
              <input aria-label="Label" placeholder="label (e.g. the grant line)" value={budgetForm.label}
                     onChange={e => setBudgetForm({ ...budgetForm, label: e.target.value })} style={{ ...input, flex: '1 1 200px' }} />
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button onClick={() => saveBudget(false)} disabled={busy} style={{
                padding: '6px 16px', background: 'var(--accent)', border: 'none', borderRadius: 4, color: '#111',
                fontSize: fs(11), letterSpacing: 1, fontWeight: 500, cursor: 'pointer', opacity: busy ? 0.5 : 1 }}>SAVE</button>
              <button onClick={() => setEditingBudget(false)} style={smallButton}>CANCEL</button>
              {budget && <button onClick={() => saveBudget(true)} disabled={busy} style={smallButton}>REMOVE BUDGET</button>}
            </div>
            {budgetError && <div style={{ ...note, color: 'var(--deny)', marginTop: 8 }}>{budgetError}</div>}
          </div>
        )}
      </div>

      <div style={{ ...card, marginBottom: 16 }}>
        <div style={heading}>DAILY SPEND ALERT</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <span style={note}>Alert when a day’s LLM spend passes</span>
          <input aria-label="Daily spend alert threshold in US dollars" inputMode="decimal"
                 value={alertDraft === null ? String(report.alert.daily_usd) : alertDraft}
                 onChange={e => setAlertDraft(e.target.value)} style={{ ...input, width: 90 }} />
          <span style={note}>dollars</span>
          {alertDraft !== null && (
            <>
              <button onClick={() => saveAlert(alertDraft === '' ? null : Number(alertDraft))} disabled={busy} style={smallButton}>SAVE</button>
              <button onClick={() => { setAlertDraft(null); setAlertError(null); }} style={smallButton}>CANCEL</button>
            </>
          )}
          {alertDraft === null && report.alert.source === 'setting' && (
            <button onClick={() => saveAlert(null)} disabled={busy} style={smallButton} title="Go back to the server’s default">RESET</button>
          )}
        </div>
        <div style={{ ...note, marginTop: 8 }}>
          Today so far: {usd(report.alert.today_usd)}.
          {report.alert.enabled
            ? ' It fires on crossing the threshold and again at each further multiple, so a runaway keeps announcing itself.'
            : ' The alert is off (threshold 0).'}
          {' '}Alerts go to the server log{report.alert.emailed ? ' and by email.' : ' only — set ALERT_EMAIL_TO on the server to have them emailed.'}
          {' '}Nothing is ever cut off.
          {report.alert.today_unpriced_tokens > 0 && ` ${compactTokens(report.alert.today_unpriced_tokens)} of today’s tokens are on an unpriced model, which this alert cannot see.`}
        </div>
        {alertError && <div style={{ ...note, color: 'var(--deny)', marginTop: 8 }}>{alertError}</div>}
      </div>

      <div style={{ ...card, marginBottom: 16 }}>
        <div style={heading}>SPEND PER DAY — {span.toUpperCase()}</div>
        {report.by_day.length === 0 || maxDay === 0
          ? <div style={note}>No priced spend in this window.</div>
          : <div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: report.by_day.length > 60 ? 0 : 2, height: 90 }}>
                {report.by_day.map(d => (
                  <div key={d.day} title={`${d.day}: ${usd(d.cost_usd)} · ${d.calls} calls`}
                       style={{ flex: 1, minWidth: 1, height: `${Math.max(d.cost_usd > 0 ? 3 : 0, 100 * d.cost_usd / maxDay)}%`,
                                background: 'var(--accent)', borderRadius: '2px 2px 0 0', opacity: 0.85 }} />
                ))}
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', ...note, marginTop: 4 }}>
                <span>{report.by_day[0].day}</span>
                <span>busiest day {usd(maxDay)}</span>
                <span>{report.by_day[report.by_day.length - 1].day}</span>
              </div>
            </div>}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: 16, marginBottom: 16 }}>
        <div style={card}>
          <div style={heading}>BY MODEL</div>
          {report.by_model.length === 0 ? <div style={note}>No calls in this window.</div> :
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
              <thead><tr><th style={th}>model</th><th style={thr}>rate / 1M</th><th style={thr}>in</th><th style={thr}>out</th><th style={thr}>cost</th></tr></thead>
              <tbody>{report.by_model.map(m => (
                <tr key={m.model} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={{ ...td, fontFamily: 'var(--mono)', wordBreak: 'break-all' }}>{m.model}</td>
                  <td style={{ ...tdr, color: m.rate ? 'var(--text-dim)' : 'var(--deny)' }}
                      title={m.rate ? `priced as ${m.rate.matched}` : 'no rate in the price table'}>
                    {m.rate ? `$${m.rate.input_per_1m} / $${m.rate.output_per_1m}` : 'UNPRICED'}</td>
                  <td style={tdr}>{compactTokens(m.prompt_tokens)}</td>
                  <td style={tdr}>{compactTokens(m.completion_tokens)}</td>
                  <td style={tdr}>{m.rate ? usd(m.cost_usd) : '—'}</td>
                </tr>))}</tbody>
            </table>}
        </div>
        <div style={card}>
          <div style={heading}>BY PURPOSE</div>
          {report.by_purpose.length === 0 ? <div style={note}>No calls in this window.</div> :
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
              <thead><tr><th style={th}>what the calls were for</th><th style={thr}>calls</th><th style={thr}>cost</th></tr></thead>
              <tbody>{report.by_purpose.map(r => (
                <tr key={r.purpose || 'unlabelled'} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={td}>{r.label}</td>
                  <td style={tdr}>{r.calls.toLocaleString()}</td>
                  <td style={tdr}>{usd(r.cost_usd)}</td>
                </tr>))}</tbody>
            </table>}
          <div style={{ ...note, marginTop: 10 }}>
            Failed calls: {report.waste.failed_calls} of {report.waste.calls}
            {report.waste.by_category.length > 0 && ` (${report.waste.by_category.map(c => `${c.calls} ${c.category.replace(/_/g, ' ')}`).join(', ')})`}
            {' '}· retry attempts: {report.waste.retry_attempts}. Providers don’t report the tokens of a failed
            attempt, so retries are counted here, not priced.
          </div>
        </div>
      </div>

      <div style={{ ...card, marginBottom: 16 }}>
        <div style={heading}>STUDIES — ALL TIME</div>
        {report.studies.length === 0 ? <div style={note}>No participant sessions yet.</div> : report.studies.map(study => (
          <div key={study.study_id} style={{ marginBottom: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
              <div style={{ fontFamily: 'var(--mono)', fontSize: fs(12), color: 'var(--text)' }}>
                {study.study_id} <span style={{ color: 'var(--text-muted)' }}>· {usd(study.cost_usd)} so far</span>
              </div>
              <button style={smallButton} onClick={() => setOpenStudy(openStudy === study.study_id ? null : study.study_id)}>
                {openStudy === study.study_id ? 'HIDE SESSIONS' : `SESSIONS (${study.sessions.length})`}</button>
            </div>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
              <thead><tr>
                <th style={th}>condition</th><th style={thr}>finished</th><th style={thr}>still to come</th>
                <th style={thr}>practice</th><th style={thr}>task</th><th style={thr}>total</th><th style={thr}>per finished session</th>
              </tr></thead>
              <tbody>{Object.entries(study.conditions).map(([condition, c]) => (
                <tr key={condition} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={td}>{condition}</td>
                  <td style={tdr}>{c.finished_sessions} / {c.sessions}</td>
                  <td style={tdr}>{c.outstanding_sessions}</td>
                  <td style={tdr}>{usd(c.practice_cost_usd)}</td>
                  <td style={tdr}>{usd(c.task_cost_usd)}</td>
                  <td style={tdr}>{usd(c.cost_usd)}</td>
                  <td style={tdr}>{usd(c.mean_cost_per_finished_session)}</td>
                </tr>))}</tbody>
            </table>
            <div style={{ ...note, marginTop: 6 }}>
              {study.projected_total_usd === null
                ? 'No projection yet: a condition has sessions still to come but none finished to estimate them from.'
                : `Projected total ${usd(study.projected_total_usd)} — ${usd(study.projected_remaining_usd)} still to come, at each condition’s mean cost per finished session.`}
            </div>
            {openStudy === study.study_id && (
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11), marginTop: 8 }}>
                <thead><tr>
                  <th style={th}>participant</th><th style={th}>session</th><th style={th}>condition</th><th style={th}>state</th>
                  <th style={thr}>calls</th><th style={thr}>in</th><th style={thr}>out</th><th style={thr}>practice</th><th style={thr}>task</th><th style={thr}>total</th>
                </tr></thead>
                <tbody>{study.sessions.map((r, i) => (
                  <tr key={i} style={{ borderTop: '1px solid var(--border)' }}>
                    <td style={{ ...td, fontFamily: 'var(--mono)' }}>{r.participant_code || '—'}</td>
                    <td style={td}>{r.period || '—'}</td>
                    <td style={td}>{r.condition}</td>
                    <td style={{ ...td, color: r.finished ? 'var(--commit)' : 'var(--text-dim)' }}>{r.state || r.token_status}</td>
                    <td style={tdr}>{r.calls}</td>
                    <td style={tdr}>{compactTokens(r.prompt_tokens)}</td>
                    <td style={tdr}>{compactTokens(r.completion_tokens)}</td>
                    <td style={tdr}>{usd(r.practice_cost_usd)}</td>
                    <td style={tdr}>{usd(r.task_cost_usd)}</td>
                    <td style={tdr}>{r.unpriced_tokens > 0 ? 'UNPRICED' : usd(r.cost_usd)}</td>
                  </tr>))}</tbody>
              </table>
            )}
          </div>
        ))}
      </div>

      <div style={card}>
        <div style={heading}>BY ACCOUNT — {span.toUpperCase()}</div>
        {report.by_actor.length === 0 ? <div style={note}>No calls in this window.</div> :
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
            <thead><tr><th style={th}>account</th><th style={th}>kind</th><th style={thr}>calls</th><th style={thr}>cost</th></tr></thead>
            <tbody>{report.by_actor.slice(0, 15).map(a => (
              <tr key={a.actor_id === null ? 'system' : a.actor_id} style={{ borderTop: '1px solid var(--border)' }}>
                <td style={td}>{a.actor_id === null ? 'System (no account)' : (a.display_name || a.email || `actor ${a.actor_id}`)}</td>
                <td style={{ ...td, color: 'var(--text-dim)' }}>{a.kind || '—'}</td>
                <td style={tdr}>{a.calls.toLocaleString()}</td>
                <td style={tdr}>{usd(a.cost_usd)}</td>
              </tr>))}</tbody>
          </table>}
        {report.by_actor.length > 15 && <div style={{ ...note, marginTop: 6 }}>Showing the 15 largest of {report.by_actor.length}.</div>}
      </div>

      <CostLedgerPanel fs={fs} infra={report.infrastructure} onChanged={() => load(days)} />
    </div>
  );
}

// ── System (admin only) ──
//
// What an admin needs to keep the platform healthy without a shell on
// the server: which release is running, whether it can reach the LLM and
// send mail, what it has been alerting about, and when it was last
// backed up.
function AdminSystemTab({ fs }) {
  const [sys, setSys] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const [audit, setAudit] = useState(null);
  const [openAlert, setOpenAlert] = useState(null);

  const [access, setAccess] = useState(null);
  const load = async () => {
    try { setSys(await api('/api/admin/system')); setError(null); }
    catch (e) { setError(e.message); }
    try { setAccess((await api('/api/admin/access-log?limit=20')).entries); }
    catch (e) { setAccess(null); }
  };
  useEffect(() => { load(); }, []);

  const backupNow = async () => {
    if (busy) return;
    setBusy(true); setNote(null); setError(null);
    try {
      const r = await api('/api/admin/backup', { method: 'POST', body: JSON.stringify({}) });
      setNote(`Backup made: every account and study, and ${r.bases_dumped.length} dialectic${r.bases_dumped.length === 1 ? '' : 's'}`
              + (r.bases_failed.length ? ` — ${r.bases_failed.length} dialectic(s) FAILED to back up` : '') + '.');
      await load();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };
  const runAudit = async () => {
    if (busy) return;
    setBusy(true); setError(null);
    try { setAudit(await api('/api/admin/audit')); }
    catch (e) { setError(e.message); }
    setBusy(false);
  };

  const heading = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 };
  const card = { padding: 16, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)', marginBottom: 16 };
  const note_ = { fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)', lineHeight: 1.6 };
  const th = { padding: '6px 8px', fontWeight: 400, textAlign: 'left', color: 'var(--text-muted)' };
  const td = { padding: '7px 8px', fontFamily: 'var(--sans)', verticalAlign: 'top' };
  const smallButton = { background: 'none', border: '1px solid var(--border)', borderRadius: 4,
                        color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10), padding: '3px 10px',
                        letterSpacing: 1, fontFamily: 'var(--mono)', opacity: busy ? 0.5 : 1 };
  const ok = (good, yes, no) => (
    <span style={{ color: good ? 'var(--commit)' : 'var(--deny)' }}>{good ? yes : no}</span>
  );
  const when = (iso) => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } };
  const gb = (n) => (n / 1e9).toFixed(1) + ' GB';
  const sevColor = { critical: 'var(--deny)', high: 'var(--deny)', medium: 'var(--tension)', low: 'var(--text-dim)' };

  if (error && !sys) return <div style={{ ...note_, color: 'var(--deny)' }}>{error}</div>;
  if (!sys) return <div style={note_}>Loading…</div>;

  const lastBackup = sys.backups[0];
  const backupAgeDays = lastBackup ? (Date.now() - new Date(lastBackup.modified_utc).getTime()) / 86400000 : null;
  // `registered_with_file` is the healthy case; only these are drift.
  const auditProblems = audit ? [
    ['registered_missing_file', audit.registered_missing_file],
    ['orphan_scoped', audit.orphan_scoped],
    ['orphan_flat', audit.orphan_flat],
    ['dangling_actor_refs', audit.dangling_actor_refs],
    ['sessions_not_owned', audit.sessions_not_owned || []],
    ['owner_mismatch', (audit.registered_with_file || []).filter(r => r.path_owner_matches_row === false)],

                <div style={note_}>
                  {sys.prompts.override_active

                    : 'The packaged prompts. Every exchange records the label and hash of the prompt it ran under.'}
                </div>
              </td></tr>
          )}
          <tr style={{ borderTop: '1px solid var(--border)' }}><td style={{ ...td, color: 'var(--text-muted)' }}>Email</td>
              <td style={td}>
                {ok(sys.email.enabled && !(sys.email.last_delivery && !sys.email.last_delivery.ok),
                    'set up to send email', sys.email.enabled ? 'set up to send email — but the last message FAILED' : 'cannot send email')}
                {sys.email.last_delivery && (
                  <div style={{ ...note_, color: sys.email.last_delivery.ok ? 'var(--text-muted)' : 'var(--deny)' }}>

                    {sys.email.last_delivery.ok
                      ? (sys.email.last_delivery.backend === 'console'

                  </div>
                )}
                {sys.email.enabled && !sys.email.last_delivery && <div style={note_}>
                  Nothing has been sent since the server last started, so this is untested. Being set up to send is not the
                  same as mail arriving: always check that an invitation reached the person, and keep the link.
                </div>}
                {!sys.email.enabled && <div style={note_}>
                  Invites, password resets and login links are not emailed: copy the link the dashboard shows and send it yourself.

        </tbody></table>
      </div>

      <div style={card}>
        <div style={heading}>ALERTS — {sys.alerts_last_24h} IN THE LAST 24 HOURS</div>
        {sys.alerts.length === 0 ? <div style={note_}>None recorded. Alerts raised from now on appear here — an AI outage, a rejected API key, a day’s spend far above normal.</div> :
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
            <thead><tr><th style={th}>when</th><th style={th}>severity</th><th style={th}>what</th></tr></thead>

                <td style={td}>

                    <div style={{ ...note_, marginTop: 6 }}>

      <div style={card}>

        {!access || access.length === 0

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={heading}>BACKUPS — {sys.backups_total} KEPT ON THE SERVER</div>
          <button style={smallButton} disabled={busy} onClick={backupNow}>{busy ? 'WORKING…' : 'BACK UP NOW'}</button>
        </div>
        {!lastBackup
          ? <div style={{ ...note_, color: 'var(--deny)' }}>There is no backup. Press BACK UP NOW before the first participant.</div>

        </div>

      </div>

      <div style={card}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={heading}>CONSISTENCY CHECK</div>
          <button style={smallButton} disabled={busy} onClick={runAudit}>RUN CHECK</button>
        </div>
        <div style={note_}>
          Compares the accounts and studies on record with the dialectic files on disk. Worth running after an
          upgrade or a restore.
        </div>
        {audit && (auditProblems.length === 0

            </div>)}
      </div>
    </div>
  );
}

// ── Admin: Dialectics ────────────────────────────────────────────────
// Who can see what (docs/data-access.md): an administrator gets a list of
// METADATA — searched and sorted here, in the browser, over names and
// owners and never over what people wrote — and, with a stated reason,
// a read-only view of one ordinary dialectic at a time. Every fetch is
