          <span style={{ color: 'var(--text-dim)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>{s.name || current}</span>
          {isParticipant && studySession?.state === 'tutorial' && (
            <span style={{
              fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)',
              color: 'var(--tension)', border: '1px solid var(--tension-border)',
              background: 'var(--tension-bg)', borderRadius: 4, padding: '2px 8px',
            }}>TUTORIAL — PRACTICE TOPIC</span>
          )}
          {isParticipant && studySession?.state === 'active' && (
            <span style={{
              fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)',
              color: 'var(--commit)', border: '1px solid var(--commit-border)',
              background: 'var(--commit-bg)', borderRadius: 4, padding: '2px 8px',
            }}>MAIN TASK</span>
          )}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {isParticipant && studySession?.state === 'tutorial' && (
            <button onClick={studyBeginTask} disabled={studyBusy} style={{
              background: 'var(--accent)', border: 'none', borderRadius: 4,
              color: '#111', cursor: studyBusy ? 'default' : 'pointer',
              fontSize: fs(10), padding: '3px 10px', lineHeight: 1.4,
              letterSpacing: 1, fontFamily: 'var(--mono)', fontWeight: 500,
              opacity: studyBusy ? 0.5 : 1,
            }}>START THE MAIN TASK</button>
          )}
          {isParticipant && studySession?.state === 'active' && (
            <button onClick={studyFinish} disabled={studyBusy} style={{
              background: 'none', border: '1px solid var(--accent)', borderRadius: 4,
              color: 'var(--accent)', cursor: studyBusy ? 'default' : 'pointer',
              fontSize: fs(10), padding: '3px 10px', lineHeight: 1.4,
              letterSpacing: 1, fontFamily: 'var(--mono)',
              opacity: studyBusy ? 0.5 : 1,
            }}>FINISH SESSION</button>
          )}
          {!isBaseline && (
          <button
            onClick={() => setLeftVisible(v => !v)}
            title={leftVisible ? 'Hide position pane' : 'Show position pane'}
            style={{
              background: leftVisible ? 'var(--surface)' : 'none',
              border: '1px solid var(--border)', borderRadius: 4,
              color: 'var(--text-muted)', cursor: 'pointer',
              fontSize: fs(10), padding: '2px 8px', lineHeight: 1.4,
              letterSpacing: 1, fontFamily: 'var(--mono)', outline: 'none',
            }}
          >POSITION C:{s.commitments.length} D:{s.denials.length}</button>
          )}
          {!isBaseline && (
          <button
            onClick={() => setRightVisible(v => !v)}
            title={rightVisible ? 'Hide sequents pane' : 'Show sequents pane'}
            style={{
              background: rightVisible ? 'var(--surface)' : 'none',
              border: '1px solid var(--border)', borderRadius: 4,
              color: 'var(--text-muted)', cursor: 'pointer',
              fontSize: fs(10), padding: '2px 8px', lineHeight: 1.4,
              letterSpacing: 1, fontFamily: 'var(--mono)', outline: 'none',
            }}
          >SEQUENTS T:{openTensionCount} I:{s.implications.length}</button>
          )}
          {!isParticipant && (
          <button
            onClick={async () => {
              setPdfLoading(true);
              try {
                const res = await fetch(`${API}${dxPath('/report.pdf')}`);
                if (!res.ok) {
                  const err = await res.json().catch(() => ({ detail: res.statusText }));
                  throw new Error(err.detail || res.statusText);
                }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${current} - Elenchus Report.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
              } catch (e) {
                setMessages(prev => [...prev, { role: 'error', content: `PDF generation failed: ${e.message}` }]);
              }
              setPdfLoading(false);
            }}
            disabled={pdfLoading}
            title="Download PDF report"
            style={{
              background: 'none', border: '1px solid var(--border)', borderRadius: 4,
              color: 'var(--text-muted)',
              cursor: pdfLoading ? 'default' : 'pointer', fontSize: fs(10),
              padding: '2px 8px', lineHeight: 1.4, letterSpacing: 1,
              fontFamily: 'var(--mono)', outline: 'none',
              animation: pdfLoading ? 'pdf-pulse 1.4s ease-in-out infinite' : 'none',
            }}
          >PDF</button>
          )}
          {!isParticipant && (
          <button
            onClick={async () => {
              try {
                const res = await fetch(`${API}${dxPath('/records')}`, { credentials: 'same-origin' });
                if (!res.ok) {
                  const err = await res.json().catch(() => ({ detail: res.statusText }));
                  throw new Error((err.detail && err.detail.user_message) || err.detail || res.statusText);
                }
                const m = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
                saveBlob(await res.blob(), m ? m[1] : `${current}.tar.gz`);
              } catch (e) {
                setMessages(prev => [...prev, { role: 'error', content: `Records download failed: ${e.message}` }]);
              }
            }}
            title="Download this dialectic's raw records: state, transcript, turn log, state events"
            style={{
              background: 'none', border: '1px solid var(--border)', borderRadius: 4,
              color: 'var(--text-muted)', cursor: 'pointer', fontSize: fs(10),
              padding: '2px 8px', lineHeight: 1.4, letterSpacing: 1,
              fontFamily: 'var(--mono)', outline: 'none',
            }}
          >RECORDS</button>
          )}
          {actor && (actor.kind === 'admin' || actor.kind === 'researcher') && (
            <button
              onClick={() => { setCurrent(null); setCurrentSessionId(null); setState(null); setView('admin'); }}
              title={actor.kind === 'admin' ? 'Admin dashboard' : 'Study dashboard'}
              style={{
                background: 'none', border: '1px solid var(--accent)', borderRadius: 4,
                color: 'var(--accent)', cursor: 'pointer',
                fontSize: fs(10), padding: '2px 8px', lineHeight: 1.4,
                letterSpacing: 1, fontFamily: 'var(--mono)', outline: 'none',
              }}
            >{actor.kind === 'admin' ? 'ADMIN' : 'STUDY'}</button>
          )}
          {actor && (
            <span title={actor.email || ''} style={{
              fontSize: fs(10), color: 'var(--text-muted)', fontFamily: 'var(--sans)',
              marginLeft: 4, marginRight: 2,
            }}>
              {actor.display_name || actor.email}
              {actor.kind === 'admin' && (
                <span style={{ marginLeft: 4, color: 'var(--accent)' }}>·admin</span>
              )}
            </span>
          )}
          {actor && !isParticipant && (
            <button
              onClick={logout}
              title="Sign out"
              style={{
                background: 'none', border: '1px solid var(--border)', borderRadius: 4,
                color: 'var(--text-muted)', cursor: 'pointer',
                fontSize: fs(10), padding: '2px 8px', lineHeight: 1.4,
                letterSpacing: 1, fontFamily: 'var(--mono)',
              }}
            >SIGN OUT</button>
          )}
          {!isParticipant && (
          <button
            onClick={openSettingsPanel}
            title="Settings"
            style={{
              background: 'none', border: 'none', color: 'var(--text-muted)',
              cursor: 'pointer', fontSize: fs(14), padding: 2, lineHeight: 1,
            }}
          >&#9881;</button>
          )}
        </div>
      </div>

      {/* Left: Position */}
      {showLeft && (
        <div style={{ padding: 14, overflowY: 'auto' }}>
          <PositionList title="Commitments" color="var(--commit)" bgColor="var(--commit-bg)" items={s.commitments} onRetract={retractProp} loading={loading} fs={fs} atomIds={s.atom_ids} />
          <PositionList title="Denials" color="var(--deny)" bgColor="var(--deny-bg)" items={s.denials} onRetract={retractProp} loading={loading} fs={fs} atomIds={s.atom_ids} />
          {s.retracted?.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: fs(9), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 6, textTransform: 'uppercase' }}>
                Retracted
              </div>
              {s.retracted.map((p, i) => {
                const aid = s.atom_ids && s.atom_ids[p];
                return (
                  <div key={i} style={{
                    padding: '3px 7px', marginBottom: 3, borderRadius: 3,
                    fontSize: fs(10), lineHeight: 1.5, fontFamily: 'var(--sans)',
                    color: 'var(--text-muted)', textDecoration: 'line-through',
                  }}>
                    {aid && <span style={{ fontSize: fs(8), marginRight: 4, fontFamily: 'var(--mono)', textDecoration: 'none', display: 'inline' }}>P{aid}</span>}
                    {p}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* Left drag handle */}
      {showLeft && (
        <div onMouseDown={startDrag('left')} style={{
          cursor: 'col-resize', background: 'var(--border)', width: 4,
          transition: 'background 0.15s',
        }} onMouseEnter={e => e.currentTarget.style.background = 'var(--border-focus)'}
           onMouseLeave={e => e.currentTarget.style.background = 'var(--border)'} />
      )}

      {/* Center: Messages */}
      <div style={{ overflowY: 'auto', padding: '16px 24px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {messages.map((msg, i) => <Message key={i} msg={msg} fs={fs} baseline={isBaseline} />)}
        {loading && (
          <div style={{ color: 'var(--text-muted)', fontSize: fs(12), fontStyle: 'italic', padding: '8px 0' }}>
            {isBaseline ? 'The assistant is thinking…' : 'Opponent is considering...'}
          </div>
        )}
        <div ref={msgEnd} />
      </div>

      {/* Right drag handle */}
      {showRight && (
        <div onMouseDown={startDrag('right')} style={{
          cursor: 'col-resize', background: 'var(--border)', width: 4,
          transition: 'background 0.15s',
        }} onMouseEnter={e => e.currentTarget.style.background = 'var(--border-focus)'}
           onMouseLeave={e => e.currentTarget.style.background = 'var(--border)'} />
      )}

      {/* Right: Sequents (focal tension only; rest are queued) */}
      {showRight && (
        <div style={{ padding: 14, overflowY: 'auto' }}>
          <div style={{ fontSize: fs(9), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8, textTransform: 'uppercase' }}>
            Sequents
          </div>
          {s.tensions.length === 0 && s.implications.length === 0 && (
            <div style={{ color: 'var(--text-muted)', fontSize: fs(11), fontStyle: 'italic' }}>No sequents yet</div>
          )}
          {s.tensions.map(t => (
            <SequentCard key={'t'+t.id} item={t} type="tension" onAccept={() => acceptTension(t)} onContest={() => contestTension(t)} loading={loading} fs={fs} atomIds={s.atom_ids} />
          ))}
          {queuedTensions.length > 0 && (
            <div style={{
              padding: '6px 10px', marginBottom: 10, borderRadius: 4,
              border: '1px dashed var(--border)',
              fontSize: fs(10), color: 'var(--text-muted)', fontFamily: 'var(--sans)',
              fontStyle: 'italic',
            }}>
              {queuedTensions.length} more tension{queuedTensions.length === 1 ? '' : 's'} queued — surface after this one resolves
            </div>
          )}
          {s.implications.map((imp, i) => (
            <SequentCard key={'i'+i} item={imp} type="implication" loading={loading} fs={fs} atomIds={s.atom_ids} />
          ))}
        </div>
      )}

      {/* Writing pane (participants): its own column, full height */}
      {showWritingPane && (
        <div style={{ gridColumn: '-3 / -2', gridRow: '2 / 4', background: 'var(--border)' }} />
      )}
      {showWritingPane && (
        <WritingPane fs={fs} studySession={studySession} text={studyText} setText={setStudyText} />
      )}

      {/* Input */}
      <div style={{
        gridColumn: showWritingPane ? '1 / -3' : '1 / -1', padding: '12px 20px',
        borderTop: '1px solid var(--border)',
        display: 'flex', gap: 10, alignItems: 'flex-end',
      }}>
        <textarea
          ref={inputRef}
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={handleKey}
          disabled={loading}
          placeholder={isBaseline
            ? 'Message the assistant…'
            : 'Speak naturally — commit, deny, respond to tensions, refine your position...'}
          rows={2}
          style={{
            flex: 1, padding: '10px 14px', background: 'var(--surface)',
            border: '1px solid var(--border)', borderRadius: 6,
            color: 'var(--text)', fontSize: fs(13), outline: 'none', resize: 'none',
            fontFamily: 'var(--sans)', lineHeight: 1.6,
          }}
        />
        <button
          onClick={() => sendMessage(input)}
          disabled={!input.trim() || loading}
          style={{
            padding: '10px 20px', height: 44,
            background: input.trim() && !loading ? 'var(--accent)' : 'var(--surface2)',
            border: 'none', borderRadius: 6,
            color: input.trim() && !loading ? '#111' : 'var(--text-muted)',
            fontSize: fs(12), cursor: input.trim() ? 'pointer' : 'default',
            letterSpacing: 1, fontWeight: 500, flexShrink: 0,
          }}
        >{loading ? '...' : 'SEND'}</button>
      </div>

      {settingsModal}
    </div>
  );
}

// ── Components ──

function PositionList({ title, color, bgColor, items, onRetract, loading, fs, atomIds }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: fs(9), letterSpacing: 2, color, marginBottom: 6, textTransform: 'uppercase' }}>
        {title}
      </div>
      {items.length === 0 && (
        <div style={{ color: 'var(--text-muted)', fontSize: fs(11), fontStyle: 'italic' }}>∅</div>
      )}
      {items.map((p, i) => {
        const aid = atomIds && atomIds[p];
        return (
          <div key={i} style={{
            padding: '4px 7px', marginBottom: 3, borderRadius: 3,
            background: bgColor,
            borderLeft: `2px solid ${color}`,
            display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
            fontSize: fs(10), lineHeight: 1.5, gap: 4, fontFamily: 'var(--sans)',
          }}>
            <span style={{ wordBreak: 'break-word' }}>
              {aid && <span style={{ color: 'var(--text-muted)', fontSize: fs(8), marginRight: 4, fontFamily: 'var(--mono)' }}>P{aid}</span>}
              {p}
            </span>
            <button onClick={() => onRetract(p)} disabled={loading} style={{
              background: 'none', border: 'none', color: 'var(--text-muted)',
              cursor: loading ? 'default' : 'pointer', fontSize: fs(9), padding: '0 2px', flexShrink: 0, lineHeight: 1,
              opacity: loading ? 0.3 : 1,
            }} title="Retract">×</button>
          </div>
        );
      })}
    </div>
  );
}

function SequentCard({ item, type, onAccept, onContest, loading, fs, atomIds }) {
  const isTension = type === 'tension';
  const color = isTension ? 'var(--tension)' : 'var(--imp)';
  const bg = isTension ? 'var(--tension-bg)' : 'var(--imp-bg)';
  const border = isTension ? 'var(--tension-border)' : 'var(--imp-border)';
  const atomBg = isTension ? 'rgba(250,204,21,0.12)' : 'rgba(96,165,250,0.12)';

  return (
    <div style={{
      marginBottom: 8, borderRadius: 6,
      background: bg, border: `1px solid ${border}`,
      overflow: 'hidden',
    }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '3px 8px',
        borderBottom: `1px solid ${border}`,
      }}>
        <span style={{ fontSize: fs(8), fontFamily: 'var(--mono)', color: 'var(--text-muted)' }}>
          {isTension ? `T${item.id}` : `I${item.id}`}
        </span>
        {isTension && (
          <div style={{ display: 'flex', gap: 6 }}>
            <button onClick={onAccept} disabled={loading} title="Accept"
              style={{
                background: 'none', border: 'none', color: 'var(--commit)',
                cursor: loading ? 'default' : 'pointer', fontSize: fs(13), padding: 0, lineHeight: 1,
                opacity: loading ? 0.3 : 0.8,
              }}
            >&#9744;</button>
            <button onClick={onContest} disabled={loading} title="Contest"
              style={{
                background: 'none', border: 'none', color: 'var(--text-muted)',
                cursor: loading ? 'default' : 'pointer', fontSize: fs(12), padding: 0, lineHeight: 1,
                opacity: loading ? 0.3 : 0.8,
              }}
            >&times;</button>
          </div>
        )}
      </div>
      <div style={{ padding: 8 }}>
        {item.gamma.map((g, i) => {
          const aid = atomIds && atomIds[g];
          return (
            <div key={'g'+i} style={{
              padding: '2px 6px', marginBottom: 3, borderRadius: 3,
              background: atomBg, fontSize: fs(9.5), lineHeight: 1.5,
              fontFamily: 'var(--sans)', color: 'var(--text-dim)',
              display: 'flex', alignItems: 'baseline', gap: 4,
            }}>
              {aid && <span style={{ fontSize: fs(7.5), fontFamily: 'var(--mono)', color: 'var(--text-muted)', flexShrink: 0 }}>P{aid}</span>}
              <span>{g}</span>
            </div>
          );
        })}
        <div style={{
          height: 2, background: color,
          margin: '6px 0', borderRadius: 1,
        }} />
        {item.delta.map((d, i) => {
          const aid = atomIds && atomIds[d];
          return (
            <div key={'d'+i} style={{
              padding: '2px 6px', marginBottom: 3, borderRadius: 3,
              background: atomBg, fontSize: fs(9.5), lineHeight: 1.5,
              fontFamily: 'var(--sans)', color: 'var(--text-dim)',
              display: 'flex', alignItems: 'baseline', gap: 4,
            }}>
              {aid && <span style={{ fontSize: fs(7.5), fontFamily: 'var(--mono)', color: 'var(--text-muted)', flexShrink: 0 }}>P{aid}</span>}
              <span>{d}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Message({ msg, fs, baseline }) {
  if (msg.role === 'system' || msg.role === 'error') {
    return (
      <div style={{
        fontSize: fs(11), padding: '4px 0', textAlign: 'center', fontStyle: 'italic',
        color: msg.role === 'error' ? '#ef4444' : 'var(--text-muted)',
      }}>{msg.content}</div>
    );
  }

  const isOpp = msg.role === 'opponent';
  // The baseline condition is an ordinary assistant: no protocol vocabulary.
  const who = baseline ? (isOpp ? 'Assistant' : 'You') : (isOpp ? 'Opponent' : 'Respondent');
  return (
    <div style={{ display: 'flex', justifyContent: isOpp ? 'flex-start' : 'flex-end' }}>
      <div style={{
        maxWidth: '82%', padding: '10px 14px', borderRadius: 10,
        background: isOpp ? 'var(--opp-bg)' : 'var(--surface2)',
        border: `1px solid ${isOpp ? 'var(--opp-border)' : 'var(--border)'}`,
        fontFamily: 'var(--sans)',
      }}>
        <div style={{
          fontSize: fs(9), marginBottom: 4, letterSpacing: 1, textTransform: 'uppercase',
          fontFamily: 'var(--mono)',
          color: isOpp ? 'var(--opp)' : 'var(--text-muted)',
        }}>{who}</div>
        {isOpp ? (
          <div className="msg-md" style={{
            fontSize: fs(13), lineHeight: 1.7,
            color: 'var(--text)',
          }} dangerouslySetInnerHTML={{ __html: marked.parse(msg.content || '') }} />
        ) : (
          <div style={{
            fontSize: fs(13), lineHeight: 1.7, whiteSpace: 'pre-wrap',
            color: 'var(--respondent-text)',
          }}>{msg.content}</div>
        )}
      </div>
    </div>
  );
}

// ── Admin Dashboard ──
//
// Two-tab view for admins: Invites (issue / list / revoke) and Users
// (list, read-only for Phase A). Mounted in App when view==='admin'.
// Non-admins shouldn't be able to reach this (the route is hidden in
// the home header), but the component also defends: the backend
// returns 403 for non-admins and we surface that as an error banner.

function AdminInvitesTab({ fs }) {
  const [invites, setInvites] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [form, setForm] = useState({ role: 'user', intended_email: '' });
  const [creating, setCreating] = useState(false);
  const [lastIssued, setLastIssued] = useState(null);

  const load = async () => {
    setLoading(true); setError(null);
    try {
      const data = await api('/api/admin/invites');
      setInvites(data.invites || []);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const issue = async () => {
    if (!form.role || creating) return;
    setCreating(true); setError(null);
    try {
      const body = { role: form.role };
      if (form.intended_email) body.intended_email = form.intended_email;
      const res = await api('/api/admin/invites', {
        method: 'POST', body: JSON.stringify(body),
      });
      setLastIssued(res);
      setForm({ role: 'user', intended_email: '' });
      await load();
    } catch (e) { setError(e.message); }
    setCreating(false);
  };

  const revoke = async (token) => {
    if (!confirm('Revoke this invite? It cannot be undone.')) return;
    try {
      await api(`/api/admin/invites/${encodeURIComponent(token)}`, { method: 'DELETE' });
      await load();
    } catch (e) { setError(e.message); }
  };

  const inviteUrl = (token) => `${window.location.origin}/?token=${encodeURIComponent(token)}`;

  return (
    <div>
      {/* Create form */}
      <div style={{
        marginBottom: 24, padding: 16, borderRadius: 6,
        background: 'var(--surface)', border: '1px solid var(--border)',
      }}>
        <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 }}>
          ISSUE INVITE
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
          <select
            value={form.role}
            onChange={e => setForm(f => ({ ...f, role: e.target.value }))}
            style={{
              padding: '8px 10px', background: 'var(--surface2)',
              border: '1px solid var(--border)', borderRadius: 4,
              color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)',
            }}
          >
            <option value="user">user</option>
            <option value="researcher">researcher</option>
            <option value="judge">judge</option>
            <option value="admin">admin</option>
          </select>
          <input
            value={form.intended_email}
            onChange={e => setForm(f => ({ ...f, intended_email: e.target.value }))}
            placeholder="their email (they sign in with it)"
            style={{
              flex: 1, padding: '8px 10px', background: 'var(--surface2)',
              border: '1px solid var(--border)', borderRadius: 4,
              color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)',
              outline: 'none',
            }}
          />
          <button
            onClick={issue} disabled={creating}
            style={{
              padding: '8px 16px', background: 'var(--accent)',
              border: 'none', borderRadius: 4, color: '#111',
              fontSize: fs(11), letterSpacing: 1, fontWeight: 500,
              cursor: creating ? 'default' : 'pointer', opacity: creating ? 0.5 : 1,
            }}
          >{creating ? '…' : 'ISSUE'}</button>
        </div>
        {lastIssued && (
          <div style={{
            marginTop: 8, padding: 10, borderRadius: 4,
            background: 'var(--surface2)', border: '1px dashed var(--commit-border)',
            fontSize: fs(11), fontFamily: 'var(--mono)', color: 'var(--text-dim)',
            wordBreak: 'break-all',
          }}>
            <div style={{ color: 'var(--commit)', fontSize: fs(10), letterSpacing: 1, marginBottom: 4 }}>
              ISSUED — share this link with {lastIssued.intended_email || 'recipient'}:
            </div>
            <div>{inviteUrl(lastIssued.token)}</div>
            {lastIssued.emailed === true && (
              <div style={{ color: 'var(--commit)', fontFamily: 'var(--sans)', marginTop: 6 }}>
                Also emailed to {lastIssued.intended_email}. If they say it hasn't arrived, send them this link yourself.
              </div>
            )}
            {lastIssued.emailed === false && (
              <div style={{ color: 'var(--deny)', fontFamily: 'var(--sans)', marginTop: 6 }}>
                <b>The email to {lastIssued.intended_email} could not be sent.</b> The invitation itself is fine —
                copy the link above and send it to them yourself. The System tab says why the email failed.
              </div>
            )}
            {lastIssued.emailed === null && (
              <div style={{ color: 'var(--tension)', fontFamily: 'var(--sans)', marginTop: 6 }}>
                Nothing was emailed — copy the link above and send it to them yourself.
              </div>
            )}
            <div style={{ color: 'var(--text-muted)', fontFamily: 'var(--sans)', marginTop: 6 }}>
              They open it, pick a display name and password, and they're in.
              Afterwards they sign in with their email + that password.
            </div>
          </div>
        )}
      </div>

      {/* List */}
      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
        ALL INVITES ({invites.length})
      </div>
      {loading ? (
        <div style={{ color: 'var(--text-muted)', fontSize: fs(11) }}>…</div>
      ) : invites.length === 0 ? (
        <div style={{ color: 'var(--text-muted)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>
          No invites yet.
        </div>
      ) : (
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
          <thead>
            <tr style={{ color: 'var(--text-muted)', textAlign: 'left' }}>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>role</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>recipient</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>status</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}></th>
            </tr>
          </thead>
          <tbody>
            {invites.map(inv => {
              const status = inv.consumed_at ? 'consumed'
                : (inv.expires_at && new Date(inv.expires_at) < new Date()) ? 'expired'
                : 'open';
              const color = status === 'open' ? 'var(--commit)'
                : status === 'consumed' ? 'var(--text-muted)'
                : 'var(--deny)';
              return (
                <tr key={inv.token} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={{ padding: '8px', fontFamily: 'var(--sans)' }}>{inv.role}</td>
                  <td style={{ padding: '8px', fontFamily: 'var(--sans)' }}>
                    {inv.intended_email || <span style={{ color: 'var(--text-muted)' }}>—</span>}
                  </td>
                  <td style={{ padding: '8px', color, fontFamily: 'var(--sans)' }}>{status}</td>
                  <td style={{ padding: '8px', textAlign: 'right' }}>
                    {status === 'open' && (
                      <button onClick={() => revoke(inv.token)}
                        style={{
                          background: 'none', border: '1px solid var(--border)', borderRadius: 3,
                          color: 'var(--deny)', cursor: 'pointer',
                          fontSize: fs(10), padding: '2px 6px', fontFamily: 'var(--mono)',
                          letterSpacing: 1,
                        }}>REVOKE</button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      {error && (
        <div style={{
          marginTop: 14, padding: 10, borderRadius: 6,
          background: '#ef444420', border: '1px solid #ef444440',
          color: '#ef4444', fontSize: fs(11), fontFamily: 'var(--sans)',
        }}>{error}</div>
      )}
    </div>
  );
}

function AdminUsersTab({ fs }) {
  const { actor } = React.useContext(AuthContext) || {};
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [busyId, setBusyId] = useState(null);
  const [resetInfo, setResetInfo] = useState(null);

  const load = async () => {
    try {
      const data = await api('/api/admin/users');
      setUsers(data.users || []);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  // Deactivate = soft delete: login refused + sessions revoked, data kept.
  // Reversible via reactivate (optionally forcing a new password). The
  // backend blocks deactivating yourself or the last active admin; we
  // surface its error if so.
  const setActive = async (u, makeActive, requirePw = false) => {
    if (!makeActive && !confirm(
      `Deactivate ${u.display_name || u.email || 'this user'}? They won't be able to `
      + `log in and their sessions end now. Their dialectics are kept; you can reactivate later.`
    )) return;
    setBusyId(u.id); setError(null); setResetInfo(null);
    try {
      const q = makeActive && requirePw ? '?require_password_change=true' : '';
      await api(`/api/admin/users/${u.id}/${makeActive ? 'reactivate' : 'deactivate'}${q}`,
                { method: 'PUT' });
      await load();
    } catch (e) { setError(e.message); }
    setBusyId(null);
  };

  // Admin reset: logs the user out now and returns a one-time set-password
  // link to share (also emailed if SMTP is configured).
  const resetPassword = async (u) => {
    if (!confirm(
      `Reset the password for ${u.display_name || u.email || 'this user'}? It logs them `
      + `out now and gives you a one-time link they use to choose a new password.`
    )) return;
    setBusyId(u.id); setError(null); setResetInfo(null);
    try {
      const r = await api(`/api/admin/users/${u.id}/reset-password`, { method: 'POST' });
      setResetInfo(r);
      await load();
    } catch (e) { setError(e.message); }
    setBusyId(null);
  };

  // Role changes keep the account (and everything it has done) and
  // apply from the person's next request. The server refuses the ones
  // that would lock the platform out or unblind a judge.
  const ROLES = ['admin', 'researcher', 'user', 'judge'];
  const ROLE_NOTES = {
    admin: 'Full control: invites, users, LLM settings, costs, backups — plus everything a researcher can do.',
    researcher: 'Runs studies (Study and Judging tabs). No invites, users, settings or costs.',
    user: 'Their own dialectics only.',
    judge: 'Rates assigned texts, blinded. Sees nothing else.',
  };
  const changeRole = async (u, role) => {
    if (role === u.kind) return;
    if (!confirm(
      `Change ${u.display_name || u.email || 'this account'} from ${u.kind} to ${role}?\n\n`
      + `${ROLE_NOTES[role]}\n\nIt applies immediately; they don't need to log in again.`
    )) return;
    setBusyId(u.id); setError(null); setResetInfo(null);
    try {
      await api(`/api/admin/users/${u.id}/role`, { method: 'PUT', body: JSON.stringify({ role }) });
    } catch (e) { setError(e.message); }
    await load();
    setBusyId(null);
  };

  const actionBtn = (label, color, onClick, disabled) => (
    <button onClick={onClick} disabled={disabled} style={{
      background: 'none', border: `1px solid ${color}`, color,
      borderRadius: 4, padding: '3px 10px', fontSize: fs(10),
      fontFamily: 'var(--sans)', letterSpacing: 0.5,
      cursor: disabled ? 'default' : 'pointer', opacity: disabled ? 0.4 : 1,
    }}>{label}</button>
  );

  if (loading) return <div style={{ color: 'var(--text-muted)', fontSize: fs(11) }}>…</div>;

  return (
    <div>
      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
        USERS ({users.length})
      </div>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
        <thead>
          <tr style={{ color: 'var(--text-muted)', textAlign: 'left' }}>
            <th style={{ padding: '6px 8px', fontWeight: 400 }}>kind</th>
            <th style={{ padding: '6px 8px', fontWeight: 400 }}>display name</th>
            <th style={{ padding: '6px 8px', fontWeight: 400 }}>email</th>
            <th style={{ padding: '6px 8px', fontWeight: 400 }}>status</th>
            <th style={{ padding: '6px 8px', fontWeight: 400 }}></th>
          </tr>
        </thead>
        <tbody>
          {users.map(u => {
            const isSelf = actor && actor.id === u.id;
            const deactivated = !!u.deactivated_at;
            return (
            <tr key={u.id} style={{ borderTop: '1px solid var(--border)' }}>
              <td style={{ padding: '8px', fontFamily: 'var(--sans)', whiteSpace: 'nowrap' }}>
                {!isSelf && !deactivated && ROLES.includes(u.kind) ? (
                  <select aria-label={`Role of ${u.display_name || u.email || 'account ' + u.id}`}
                          value={u.kind} disabled={busyId === u.id}
                          onChange={e => changeRole(u, e.target.value)}
                          style={{ background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 4,
                                   color: 'var(--text)', fontSize: fs(11), fontFamily: 'var(--sans)', padding: '2px 4px' }}>
                    {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                ) : u.kind}
                {u.kind === 'admin' && (
                  <span style={{ marginLeft: 4, color: 'var(--accent)' }}>★</span>
                )}
              </td>
              <td style={{ padding: '8px', fontFamily: 'var(--sans)' }}>{u.display_name}</td>
              <td style={{ padding: '8px', fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
                {u.email || <span style={{ color: 'var(--text-muted)' }}>—</span>}
              </td>
              <td style={{ padding: '8px', fontFamily: 'var(--sans)',
                           color: deactivated ? 'var(--deny)' : 'var(--commit)' }}>
                {deactivated ? 'deactivated' : 'active'}
              </td>
              <td style={{ padding: '8px', textAlign: 'right' }}>
                {isSelf ? (
                  <span style={{ color: 'var(--text-muted)', fontSize: fs(10), fontFamily: 'var(--sans)' }}>you</span>
                ) : (
                  <span style={{ display: 'inline-flex', gap: 6, justifyContent: 'flex-end' }}>
                    {deactivated ? (
                      <>
                        {actionBtn('reactivate', 'var(--commit)', () => setActive(u, true), busyId === u.id)}
                        {actionBtn('+ new password', 'var(--accent)', () => setActive(u, true, true), busyId === u.id)}
                      </>
                    ) : (
                      <>
                        {actionBtn('reset password', 'var(--accent)', () => resetPassword(u), busyId === u.id)}
                        {actionBtn('deactivate', 'var(--deny)', () => setActive(u, false), busyId === u.id)}
                      </>
                    )}
                  </span>
                )}
              </td>
            </tr>
            );
          })}
        </tbody>
      </table>
      {resetInfo && (
        <div style={{
          marginTop: 12, padding: 10, borderRadius: 6,
          background: 'var(--surface2)', border: '1px dashed var(--accent)',
          fontSize: fs(11), fontFamily: 'var(--mono)', color: 'var(--text-dim)', wordBreak: 'break-all',
        }}>
          <div style={{ color: 'var(--accent)', fontSize: fs(10), letterSpacing: 1, marginBottom: 4 }}>
            RESET LINK {resetInfo.emailed ? `(also emailed to ${resetInfo.email})` : '(share with the user)'}:
          </div>
          <div>{resetInfo.reset_url}</div>
          <div style={{ color: 'var(--text-muted)', fontFamily: 'var(--sans)', marginTop: 6 }}>
            They're logged out now; this one-time link (valid 24h) lets them set a new password.
          </div>
        </div>
      )}
      {error && (
        <div style={{
          marginTop: 14, padding: 10, borderRadius: 6,
          background: '#ef444420', border: '1px solid #ef444440',
          color: '#ef4444', fontSize: fs(11), fontFamily: 'var(--sans)',
        }}>{error}</div>
      )}
    </div>
  );
}

// Study setup + enrolment. A participant does two sessions — one per
// condition, a different topic each time — so the researcher enrols a
// *person* and gets both links at once; the server draws which condition
// and topic come first (permuted blocks), which keeps the four cells
// balanced and the two sessions linked in the data.
function AdminEnrolmentPanel({ fs, onChanged }) {
  const blank = { study_id: '', topic_a_title: '', topic_a_brief: '', topic_b_title: '', topic_b_brief: '', min_gap_hours: 48, max_gap_days: 21, task_minutes: '', development: false };
  const [studies, setStudies] = useState([]);
  const [studyId, setStudyId] = useState('');
  const [cfg, setCfg] = useState(blank);
  const [showSetup, setShowSetup] = useState(false);
  const [roster, setRoster] = useState(null);
  const [name, setName] = useState('');
  const [manual, setManual] = useState(false);
  const [cell, setCell] = useState({ first_condition: 'elenchus', first_topic: 'A' });
  // Screening covariates, recorded at enrolment and exported beside the code.
  const blankScreening = { ontology_experience: '', prior_llm_use: '', nominated_topic: false };
  // The allocation seed (set once per study; the seed never comes back from the server).
  const [seedForm, setSeedForm] = useState({ seed: '', planned_n: 48 });
  const selected = (studies || []).find(st => st.study_id === studyId) || null;
  const [screening, setScreening] = useState(blankScreening);
  // Protocol deviations: which session's form is open, and its draft.
  const [devFor, setDevFor] = useState(null);
  const [dev, setDev] = useState({ kind: 'technical_failure', note: '' });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [copied, setCopied] = useState(null);
  const [defaultTaskMinutes, setDefaultTaskMinutes] = useState(60);

  const loadStudies = async () => {
    try {
      const r = await api('/api/admin/study/configs');
      setStudies(r.studies || []);
      if (r.default_task_minutes) setDefaultTaskMinutes(r.default_task_minutes);
      if (!studyId && r.studies?.length) setStudyId(r.studies[0].study_id);
      if (!r.studies?.length) setShowSetup(true);
    } catch (e) { setError(e.message); }
  };
  const loadRoster = async (sid) => {
    if (!sid) { setRoster(null); return; }
    try { setRoster(await api(`/api/admin/study/${encodeURIComponent(sid)}/participants`)); }
    catch (e) { setError(e.message); }
  };
  useEffect(() => { loadStudies(); }, []);
  useEffect(() => {
    loadRoster(studyId);
    const st = studies.find(x => x.study_id === studyId);
    if (st) setCfg({
      study_id: st.study_id, min_gap_hours: st.min_gap_hours,
      max_gap_days: st.max_gap_days === null || st.max_gap_days === undefined ? 21 : st.max_gap_days,
      task_minutes: st.task_minutes === null || st.task_minutes === undefined ? '' : String(st.task_minutes),
      development: !!st.development,
      topic_a_title: st.topics.A.title, topic_a_brief: st.topics.A.brief,
      topic_b_title: st.topics.B.title, topic_b_brief: st.topics.B.brief,
    });
  }, [studyId, studies]);

  const saveConfig = async () => {
    if (busy || !cfg.study_id.trim()) return;
    setBusy(true); setError(null);
    try {
      const { study_id, ...body } = cfg;
      await api(`/api/admin/study/${encodeURIComponent(study_id.trim())}/config`, {
        method: 'PUT', body: JSON.stringify({
          ...body, min_gap_hours: parseInt(body.min_gap_hours, 10) || 0,
          max_gap_days: parseInt(body.max_gap_days, 10) || 0,
          task_minutes: String(body.task_minutes).trim() === '' ? null : parseInt(body.task_minutes, 10),
        }),
      });
      setStudyId(study_id.trim()); setShowSetup(false);
      await loadStudies();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const enrol = async () => {
    if (busy || !studyId || !name.trim()) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/admin/study/${encodeURIComponent(studyId)}/participants`, {
        method: 'POST', body: JSON.stringify({ display_name: name.trim(), ...screening, ...(manual ? cell : {}) }),
      });
      setName(''); setManual(false); setScreening(blankScreening);
      await loadRoster(studyId); onChanged && onChanged();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const setSeed = async () => {
    if (busy || !cfg.study_id || !seedForm.seed.trim()) return;
    if (!confirm(`Set the allocation seed for ${cfg.study_id}? It can't be changed afterwards, and from now on every participant's sequence stays hidden until you press Schedule session 1.`)) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/admin/study/${encodeURIComponent(cfg.study_id)}/allocation-seed`, {
        method: 'POST', body: JSON.stringify({ seed: seedForm.seed, planned_n: parseInt(seedForm.planned_n, 10) || 48 }),
      });
      setSeedForm({ seed: '', planned_n: 48 });
      await loadStudies(); onChanged && onChanged();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const schedule = async (participantId) => {
    if (busy) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/admin/study/${encodeURIComponent(studyId)}/participants/${participantId}/schedule`, { method: 'POST' });
      await loadRoster(studyId);
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const logDeviation = async (sessionId) => {
    if (busy) return;
    setBusy(true); setError(null);
    try {
      await api(`/api/admin/study/sessions/${sessionId}/deviations`, {
        method: 'POST', body: JSON.stringify(dev),
      });
      setDevFor(null); setDev({ kind: 'technical_failure', note: '' });
      await loadRoster(studyId);
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const interrupt = async (sessionId) => {
    if (!confirm('Close this session as interrupted? Use this when a participant has abandoned it. Everything captured so far is kept; the session cannot be reopened.')) return;
    try {
      await api(`/api/admin/study/sessions/${sessionId}/interrupt`, { method: 'POST' });
      await loadRoster(studyId); onChanged && onChanged();
    } catch (e) { setError(e.message); }
  };

  const linkFor = (token) => `${window.location.origin}/?study=${encodeURIComponent(token)}`;
  const copy = async (token) => {
    try { await navigator.clipboard.writeText(linkFor(token)); setCopied(token); setTimeout(() => setCopied(null), 1500); }
    catch (e) { window.prompt('Copy this link:', linkFor(token)); }
  };

  const card = { marginBottom: 20, padding: 16, borderRadius: 6, background: 'var(--surface)', border: '1px solid var(--border)' };
  const heading = { fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 };
  const input = { padding: '8px 10px', background: 'var(--surface2)', border: '1px solid var(--border)',
                  borderRadius: 4, color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)', outline: 'none' };
  const smallBtn = { background: 'none', border: '1px solid var(--border)', borderRadius: 3, color: 'var(--text-dim)',
                     cursor: 'pointer', fontSize: fs(10), padding: '2px 8px', fontFamily: 'var(--mono)', letterSpacing: 1 };
  const LIVE = ['briefing', 'tutorial', 'active', 'post_session', 'surveyed'];
  const gateText = (g) => !g ? null
    : g.reason === 'too_soon' ? `opens ${new Date(g.opens_at).toLocaleString([], {
        weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' })}`
    : g.reason === 'first_still_open' ? 'waiting: session 1 still open'
    : 'waiting: session 1 not started';

  return (
    <div>
      {/* Study + setup */}
      <div style={card}>
        <div style={{ ...heading, display: 'flex', justifyContent: 'space-between' }}>
          <span>STUDY</span>
          <span onClick={() => { setShowSetup(v => !v); }} style={{ cursor: 'pointer', color: 'var(--accent)' }}>
            {showSetup ? 'HIDE SETUP' : 'SETUP / EDIT TOPICS'}
          </span>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <select value={studyId} onChange={e => setStudyId(e.target.value)} style={input}>
            {studies.length === 0 && <option value="">no study set up yet</option>}
            {studies.map(st => <option key={st.study_id} value={st.study_id}>{st.study_id}</option>)}
          </select>
          <button onClick={() => { setCfg(blank); setShowSetup(true); }} style={smallBtn}>NEW STUDY</button>
          {selected && selected.development && (
            <span title="A development study: run by the team to tune the system. Its sessions can be opened in the Dialectics tab. It can't carry an allocation seed."
                  style={{ fontSize: fs(9), letterSpacing: 2, padding: '3px 8px', borderRadius: 3, border: '1px solid var(--border)',
                           color: 'var(--text-dim)', fontFamily: 'var(--sans)', cursor: 'help' }}>DEVELOPMENT</span>
          )}
          {roster && (
            <span title={Object.entries(roster.cell_counts).map(([k, n]) => `${k}: ${n}`).join('\n')}
                  style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)', cursor: 'help' }}>
              {roster.participants.length} enrolled · balance across the four order × topic cells: {Object.values(roster.cell_counts).join(' / ')}
            </span>
          )}
        </div>
        {showSetup && (
          <div style={{ marginTop: 12, display: 'grid', gap: 8 }}>
            <input value={cfg.study_id} onChange={e => setCfg(c => ({ ...c, study_id: e.target.value }))}
              placeholder="study id (e.g. PILOT)" style={input} />
            {['a', 'b'].map(k => (
              <div key={k} style={{ display: 'grid', gap: 6 }}>
                <input value={cfg[`topic_${k}_title`]} onChange={e => setCfg(c => ({ ...c, [`topic_${k}_title`]: e.target.value }))}
                  placeholder={`Topic ${k.toUpperCase()} — title shown to the participant`} style={input} />
                <textarea value={cfg[`topic_${k}_brief`]} onChange={e => setCfg(c => ({ ...c, [`topic_${k}_brief`]: e.target.value }))}
                  placeholder={`Topic ${k.toUpperCase()} — brief (one or two sentences of framing)`} rows={2}
                  style={{ ...input, resize: 'vertical' }} />
              </div>
            ))}
            <label style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
              Minimum hours between a participant's two sessions{' '}
              <input type="number" min="0" value={cfg.min_gap_hours}
                onChange={e => setCfg(c => ({ ...c, min_gap_hours: e.target.value }))} style={{ ...input, width: 80 }} />
            </label>
            <label style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
              Maximum days between a participant's two sessions{' '}
              <input type="number" min="0" value={cfg.max_gap_days}
                onChange={e => setCfg(c => ({ ...c, max_gap_days: e.target.value }))} style={{ ...input, width: 80 }} />
              <span style={{ color: 'var(--text-muted)' }}> — not enforced: a pair outside it is flagged in the list and the export. 0 = no maximum.</span>
            </label>
            <label style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
              Length of the main task, in minutes{' '}
              <input type="number" min="1" max="600" value={cfg.task_minutes} placeholder={String(defaultTaskMinutes)}
                onChange={e => setCfg(c => ({ ...c, task_minutes: e.target.value }))} style={{ ...input, width: 80 }} />
              <span style={{ color: 'var(--text-muted)' }}> — leave empty for the usual {defaultTaskMinutes}. Use 5 for a practice study.</span>
            </label>
            {(() => {
              const seeded = !!(selected && selected.allocation && selected.allocation.seeded && selected.study_id === cfg.study_id.trim());
              const enrolled = !!(roster && selected && selected.study_id === cfg.study_id.trim() && roster.participants.length > 0);
              const fixed = seeded || (enrolled && !cfg.development);
              return (
                <label style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)', display: 'flex', gap: 8, alignItems: 'flex-start',
                                opacity: fixed ? 0.6 : 1 }}>
                  <input type="checkbox" checked={!!cfg.development} disabled={fixed}
                    onChange={e => setCfg(c => ({ ...c, development: e.target.checked }))} style={{ marginTop: 3 }} />
                  <span>
                    <b>Development study</b> — run by the team to tune the system. Its sessions go through the whole participant
                    flow, and their records <b>can be opened in the Dialectics tab</b> under a reason, logged. It can't carry an
                    allocation seed, and the choice is fixed once anyone is enrolled.
                    {seeded && <span style={{ color: 'var(--text-muted)' }}> This study has a seed: it is a registered study.</span>}
                    {!seeded && enrolled && !cfg.development && <span style={{ color: 'var(--text-muted)' }}> Participants are enrolled: set up a new study instead.</span>}
                  </span>
                </label>
              );
            })()}
            <div style={{ marginTop: 6, padding: '10px 12px', borderRadius: 4, background: 'var(--surface2)', border: '1px solid var(--border)',
                          fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)', lineHeight: 1.6 }}>
              <div style={{ fontSize: fs(9), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 6 }}>ALLOCATION</div>
              {selected && selected.allocation && selected.allocation.seeded ? (
                <div>
                  Seeded: each participant's sequence comes from a list fixed by the seed, and stays <b>hidden until you press
                  Schedule session 1</b>. Planned N {selected.allocation.planned_n} · set by account #{selected.allocation.set_by}
                  {selected.allocation.set_at && ` on ${new Date(selected.allocation.set_at).toLocaleDateString()}`}.
                  <div style={{ fontFamily: 'var(--mono)', fontSize: fs(10), marginTop: 4, wordBreak: 'break-all' }}>
                    seed sha256 {selected.allocation.seed_sha256}<br />list sha256 {selected.allocation.list_sha256}
                  </div>
                  <div style={{ color: 'var(--text-muted)', marginTop: 4 }}>These two hashes are what is deposited with the registration.</div>
                </div>
              ) : cfg.development ? (
                <div>A development study carries no allocation seed: enrolment draws each cell and shows it at once.</div>
              ) : (
                <div>
                  <div style={{ marginBottom: 6 }}>
                    <b>For the real study:</b> a team member who will <b>not</b> run sessions enters a seed here, once, before
                    the first enrolment. The platform fixes every participant's sequence from it and keeps each one hidden
                    until <i>Schedule session 1</i> is pressed; the two hashes it shows are deposited with the registration.
                    Leave this empty for a practice study.
                  </div>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    <input value={seedForm.seed} onChange={e => setSeedForm(f => ({ ...f, seed: e.target.value }))}
                      placeholder="seed — any phrase; write it down for the deposit" style={{ ...input, flex: '1 1 260px' }} />
                    <label>planned N{' '}
                      <input type="number" min="1" value={seedForm.planned_n}
                        onChange={e => setSeedForm(f => ({ ...f, planned_n: e.target.value }))} style={{ ...input, width: 70 }} />
                    </label>
                    <button onClick={setSeed} disabled={busy || !cfg.study_id || !seedForm.seed.trim()} style={{
                      padding: '8px 14px', background: 'var(--accent)', border: 'none', borderRadius: 4, color: '#111',
                      fontSize: fs(11), letterSpacing: 1, fontWeight: 500, cursor: 'pointer',
                      opacity: busy || !cfg.study_id || !seedForm.seed.trim() ? 0.5 : 1 }}>SET SEED</button>
                  </div>
                </div>
              )}
            </div>
            <div style={{ fontSize: fs(10), fontFamily: 'var(--sans)', color: 'var(--text-muted)' }}>
              Topic wording is copied onto a participant's links when they are enrolled — edits apply to later enrolments only.
              The task length is a hard stop: the clock shows it, reminders come ten minutes before and at the limit, and when it is reached the participant’s text is submitted as it stands. Set it before the first
              participant starts and leave it alone afterwards.
            </div>
            <button onClick={saveConfig} disabled={busy} style={{
              justifySelf: 'start', padding: '8px 16px', background: 'var(--accent)', border: 'none', borderRadius: 4,
              color: '#111', fontSize: fs(11), letterSpacing: 1, fontWeight: 500, cursor: 'pointer', opacity: busy ? 0.5 : 1 }}>
              SAVE STUDY</button>
          </div>
        )}
      </div>

      {/* Enrol */}
      {studyId && (
        <div style={card}>
          <div style={heading}>ENROL PARTICIPANT — issues both session links</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            <input value={name} onChange={e => setName(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') enrol(); }}
              placeholder="participant name or label (never exported)" style={{ ...input, flex: '1 1 220px' }} />
            <button onClick={enrol} disabled={busy || !name.trim()} style={{
              padding: '8px 16px', background: 'var(--accent)', border: 'none', borderRadius: 4, color: '#111',
              fontSize: fs(11), letterSpacing: 1, fontWeight: 500, cursor: 'pointer',
              opacity: busy || !name.trim() ? 0.5 : 1 }}>{busy ? '…' : 'ENROL'}</button>
          </div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap', marginTop: 8,
                        fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
            <span style={{ color: 'var(--text-muted)' }}>From screening:</span>
            <label>ontology engineering{' '}
              <select value={screening.ontology_experience} onChange={e => setScreening(sc => ({ ...sc, ontology_experience: e.target.value }))} style={input}>
                <option value="">not recorded</option><option value="none">none</option><option value="some">some</option><option value="extensive">extensive</option>
              </select>
            </label>
            <label>LLM-tool use{' '}
              <select value={screening.prior_llm_use} onChange={e => setScreening(sc => ({ ...sc, prior_llm_use: e.target.value }))} style={input}>
                <option value="">not recorded</option><option value="none">none</option><option value="occasional">occasional</option><option value="regular">regular</option>
              </select>
            </label>
            <label><input type="checkbox" checked={screening.nominated_topic} onChange={e => setScreening(sc => ({ ...sc, nominated_topic: e.target.checked }))} />{' '}nominated a topic</label>
          </div>
          <label style={{ display: 'block', marginTop: 8, fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
            <input type="checkbox" checked={manual} onChange={e => setManual(e.target.checked)} />{' '}
            Place by hand (a replacement taking someone's cell) — otherwise order and topic are randomized in balanced blocks of four
          </label>
          {manual && (
            <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
              <select value={cell.first_condition} onChange={e => setCell(c => ({ ...c, first_condition: e.target.value }))} style={input}>
                <option value="elenchus">elenchus first</option><option value="baseline">baseline first</option>
              </select>
              <select value={cell.first_topic} onChange={e => setCell(c => ({ ...c, first_topic: e.target.value }))} style={input}>
                <option value="A">topic A first</option><option value="B">topic B first</option>
              </select>
            </div>
          )}
        </div>
      )}

      {error && <div style={{ color: 'var(--deny)', fontSize: fs(11), fontFamily: 'var(--sans)', marginBottom: 12 }}>{error}</div>}

      {/* Roster */}
      {roster && roster.participants.length > 0 && (
        <div style={{ marginBottom: 24 }}>
          <div style={heading}>PARTICIPANTS ({roster.participants.length})</div>
          {roster.participants.map(pt => (
            <div key={pt.id} style={{ borderTop: '1px solid var(--border)', padding: '10px 0' }}>
              <div style={{ display: 'flex', gap: 10, alignItems: 'baseline', marginBottom: 6 }}>
                <span style={{ fontFamily: 'var(--mono)', fontSize: fs(12) }}>{pt.participant_code}</span>
                <span style={{ fontFamily: 'var(--sans)', fontSize: fs(12) }}>{pt.display_name}</span>
                {pt.concealed ? (
                  <span style={{ fontSize: fs(10), color: 'var(--tension)', fontFamily: 'var(--sans)' }}>
                    allocated — sequence hidden until session 1 is scheduled
                  </span>
                ) : (
                  <span style={{ fontSize: fs(10), color: 'var(--text-muted)', fontFamily: 'var(--sans)' }}>
                    {pt.first_condition} first · topic {pt.first_topic} first{pt.allocation === 'manual' ? ' · placed by hand' : ''}
                  </span>
                )}
                {pt.concealed && (
                  <button onClick={() => schedule(pt.id)} disabled={busy} style={{ ...smallBtn, color: 'var(--accent)' }}>SCHEDULE SESSION 1</button>
                )}
                {(pt.ontology_experience || pt.prior_llm_use || pt.nominated_topic) && (
                  <span style={{ fontSize: fs(10), color: 'var(--text-muted)', fontFamily: 'var(--sans)' }}>
                    {[pt.ontology_experience && `ontology: ${pt.ontology_experience}`,
                      pt.prior_llm_use && `LLM use: ${pt.prior_llm_use}`,
                      pt.nominated_topic && 'nominated a topic'].filter(Boolean).join(' · ')}
                  </span>
                )}
                {pt.window && pt.window.straddled && (
                  <span style={{ fontSize: fs(10), color: 'var(--deny)', fontFamily: 'var(--sans)' }}>
                    sessions more than {pt.window.max_gap_days} days apart
                  </span>
                )}
                {pt.window && pt.window.closed && (
                  <span style={{ fontSize: fs(10), color: 'var(--tension)', fontFamily: 'var(--sans)' }}>
                    {pt.window.max_gap_days}-day window closed {new Date(pt.window.closes_at).toLocaleDateString([], { day: 'numeric', month: 'short' })}
                  </span>
                )}
              </div>
              {pt.sessions.map(se => {
                const live = se.session_state && LIVE.includes(se.session_state);
                const status = se.session_state || se.token_status;
                return (
                  <div key={se.period} style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap',
                        fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-dim)', padding: '3px 0 3px 14px' }}>
                    <span style={{ fontFamily: 'var(--mono)', color: 'var(--text-muted)' }}>session {se.period}</span>
                    <span>{se.condition}</span>
                    <span style={{ color: 'var(--text-muted)' }}>{se.topic_title}</span>
                    <span style={{ color: status === 'complete' ? 'var(--commit)' : live ? 'var(--tension)' : 'var(--text-muted)' }}>{status}</span>
                    {se.text_submitted && <span style={{ color: 'var(--commit)' }}>text ✓</span>}
                    {se.gate && <span style={{ color: 'var(--text-muted)', fontStyle: 'italic' }}>{gateText(se.gate)}</span>}
                    {(se.token_status === 'scheduled' || live) && (
                      <button onClick={() => copy(se.token)} style={smallBtn}>{copied === se.token ? 'COPIED' : 'COPY LINK'}</button>
                    )}
                    {live && <button onClick={() => interrupt(se.session_id)} style={{ ...smallBtn, color: 'var(--deny)' }}>CLOSE AS INTERRUPTED</button>}
                    {se.deviations && se.deviations.length > 0 && (
                      <span title={se.deviations.map(d => `${d.kind.replace(/_/g, ' ')}: ${d.note}`).join('\n')}
                            style={{ color: 'var(--deny)' }}>
                        {se.deviations.map(d => d.kind.replace(/_/g, ' ')).join(', ')}
                      </span>
                    )}
                    {se.session_id && (
                      <button onClick={() => setDevFor(devFor === se.session_id ? null : se.session_id)} style={smallBtn}>
                        {devFor === se.session_id ? 'CANCEL' : 'LOG DEVIATION'}
                      </button>
                    )}
                    {se.session_id && devFor === se.session_id && (
                      <span style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                        <select value={dev.kind} onChange={e => setDev(d => ({ ...d, kind: e.target.value }))} style={input}>
                          <option value="technical_failure">technical failure</option>
                          <option value="interruption">interruption</option>
                          <option value="ended_early">ended early</option>
                          <option value="other">other</option>
                        </select>
                        <input value={dev.note} onChange={e => setDev(d => ({ ...d, note: e.target.value }))}
                          placeholder="what happened, and when" style={{ ...input, width: 240 }} />
                        <button onClick={() => logDeviation(se.session_id)} disabled={busy} style={{ ...smallBtn, color: 'var(--deny)' }}>LOG</button>
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AdminStudyTab({ fs }) {
  // Token issuance + cohort overview. Researchers issue one token per
  // (participant, condition); the same participant gets two tokens for
  // the within-subjects design.
  const [tokens, setTokens] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [form, setForm] = useState({ study_id: '', condition: 'elenchus', display_name: '' });
  const [creating, setCreating] = useState(false);
  const [lastLink, setLastLink] = useState(null);
  const [exporting, setExporting] = useState(null);
  const [exportResult, setExportResult] = useState(null);
  const [exportsByStudy, setExportsByStudy] = useState({});
  const { actor: me } = React.useContext(AuthContext) || {};

  const loadExports = async (studyId) => {
    try {
      const r = await api(`/api/admin/study/${encodeURIComponent(studyId)}/exports`);
      setExportsByStudy(prev => ({ ...prev, [studyId]: r.exports || [] }));
    } catch (e) { /* the list is a convenience; the export result still shows */ }
  };

  const load = async () => {
    setLoading(true); setError(null);
    try {
      const t = await api('/api/admin/study/tokens');
      setTokens(t.tokens || []);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const issue = async () => {
    if (!form.study_id.trim() || !form.display_name.trim() || creating) return;
    setCreating(true); setError(null);
    try {
      const res = await api('/api/admin/study/tokens', {
        method: 'POST', body: JSON.stringify(form),
      });
      setLastLink({
        url: `${window.location.origin}/?study=${encodeURIComponent(res.token)}`,
        condition: res.condition, name: form.display_name,
      });
      setForm(f => ({ ...f, display_name: '' }));
      await load();
    } catch (e) { setError(e.message); }
    setCreating(false);
  };

  const voidToken = async (token) => {
    if (!confirm('Void this token? The participant will not be able to use the link.')) return;
    try { await api(`/api/admin/study/tokens/${encodeURIComponent(token)}`, { method: 'DELETE' }); await load(); }
    catch (e) { setError(e.message); }
  };

  const runExport = async (studyId) => {
    setExporting(studyId); setError(null); setExportResult(null);
    try {
      const res = await api(`/api/admin/study/${encodeURIComponent(studyId)}/export`, { method: 'POST' });
      setExportResult({ ...res, study_id: studyId });
      await loadExports(studyId);
    } catch (e) { setError(e.message); }
    setExporting(null);
  };

  // sessions don't have their own list endpoint; derive the studies in play.
  const studies = [...new Set(tokens.map(t => t.study_id))].sort();

  const stColor = (status) => ({
    scheduled: 'var(--tension)', active: 'var(--commit)',
    complete: 'var(--text-muted)', voided: 'var(--deny)', expired: 'var(--deny)',
  }[status] || 'var(--text-dim)');

  return (
    <div>
      <AdminEnrolmentPanel fs={fs} onChanged={load} />

      {/* Single-link issuance — for test links and one-off sessions.
          Study participants are enrolled above, which issues both of
          their links with a topic and a balanced allocation. */}
      <div style={{ marginBottom: 24, padding: 16, borderRadius: 6,
                    background: 'var(--surface)', border: '1px solid var(--border)' }}>
        <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 10 }}>
          ISSUE A SINGLE TEST LINK (no topic, not part of the roster)
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
          <input value={form.study_id} onChange={e => setForm(f => ({ ...f, study_id: e.target.value }))}
            placeholder="study id (e.g. PILOT)" style={{
              flex: '1 1 140px', padding: '8px 10px', background: 'var(--surface2)',
              border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)',
              fontSize: fs(12), fontFamily: 'var(--sans)', outline: 'none' }} />
          <select value={form.condition} onChange={e => setForm(f => ({ ...f, condition: e.target.value }))}
            style={{ padding: '8px 10px', background: 'var(--surface2)', border: '1px solid var(--border)',
              borderRadius: 4, color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)' }}>
            <option value="elenchus">elenchus</option>
            <option value="baseline">baseline</option>
          </select>
          <input value={form.display_name} onChange={e => setForm(f => ({ ...f, display_name: e.target.value }))}
            placeholder="participant label (e.g. P-001)" style={{
              flex: '1 1 160px', padding: '8px 10px', background: 'var(--surface2)',
              border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)',
              fontSize: fs(12), fontFamily: 'var(--sans)', outline: 'none' }} />
          <button onClick={issue} disabled={creating} style={{
            padding: '8px 16px', background: 'var(--accent)', border: 'none', borderRadius: 4,
            color: '#111', fontSize: fs(11), letterSpacing: 1, fontWeight: 500,
            cursor: creating ? 'default' : 'pointer', opacity: creating ? 0.5 : 1 }}>
            {creating ? '…' : 'ISSUE'}</button>
        </div>
        {lastLink && (
          <div style={{ marginTop: 8, padding: 10, borderRadius: 4, background: 'var(--surface2)',
                        border: '1px dashed var(--commit-border)', fontSize: fs(11),
                        fontFamily: 'var(--mono)', color: 'var(--text-dim)', wordBreak: 'break-all' }}>
            <div style={{ color: 'var(--commit)', fontSize: fs(10), letterSpacing: 1, marginBottom: 4 }}>
              ISSUED ({lastLink.condition}) — send this link to {lastLink.name}:
            </div>
            <div>{lastLink.url}</div>
          </div>
        )}
      </div>

      {/* Export + tokens */}
      {studies.length > 0 && (
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
            STUDIES
          </div>
          {studies.map(sid => (
            <div key={sid} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
              <span style={{ fontFamily: 'var(--mono)', fontSize: fs(12) }}>{sid}</span>
              <span style={{ fontSize: fs(10), color: 'var(--text-muted)' }}>
                {tokens.filter(t => t.study_id === sid).length} tokens
              </span>
              <button onClick={() => runExport(sid)} disabled={exporting === sid} style={{
                background: 'none', border: '1px solid var(--border)', borderRadius: 3,
                color: 'var(--text-dim)', cursor: 'pointer', fontSize: fs(10),
                padding: '2px 8px', fontFamily: 'var(--mono)', letterSpacing: 1,
                opacity: exporting === sid ? 0.5 : 1 }}>
                {exporting === sid ? 'EXPORTING…' : 'EXPORT'}</button>
              <button onClick={() => exportsByStudy[sid] ? setExportsByStudy(prev => { const n = { ...prev }; delete n[sid]; return n; }) : loadExports(sid)}
                style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer',
                         fontSize: fs(10), fontFamily: 'var(--sans)', textDecoration: 'underline' }}>
                {exportsByStudy[sid] ? 'hide downloads' : 'downloads'}</button>
            </div>
          ))}
          {exportResult && (
            <div style={{ marginTop: 6, padding: 8, borderRadius: 4, background: 'var(--surface2)',
                          fontSize: fs(10), fontFamily: 'var(--sans)', color: 'var(--text-dim)' }}>
              Exported {exportResult.study_id}: {exportResult.sessions_exported.length} sessions
              {exportResult.sessions_failed.length > 0 && <span style={{ color: 'var(--deny)' }}>, {exportResult.sessions_failed.length} failed</span>}.
              It is the newest file under <i>downloads</i> below.
            </div>
          )}
          {Object.entries(exportsByStudy).map(([sid, files]) => (
            <div key={sid} style={{ marginTop: 8, padding: 10, borderRadius: 4, border: '1px solid var(--border)' }}>
              <div style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', marginBottom: 6 }}>
                EXPORTS OF {sid}
              </div>
              {files.length === 0
                ? <div style={{ fontSize: fs(11), fontFamily: 'var(--sans)', color: 'var(--text-muted)' }}>None yet — press EXPORT.</div>
                : files.map(f => (
                  <div key={f.name} style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 4,
                                             fontSize: fs(11), fontFamily: 'var(--mono)' }}>
                    <span style={{ color: 'var(--text-dim)' }}>{f.created}</span>
                    <a href={`/api/admin/study/${encodeURIComponent(sid)}/exports/${encodeURIComponent(f.name)}`} download
                       style={{ color: 'var(--accent)' }}>{f.name}</a>
                    <span style={{ color: 'var(--text-muted)' }}>{(f.size_bytes / 1024).toFixed(0)} KB</span>
                    {f.pseudonym_file && me?.kind === 'admin' && (
                      <a href={`/api/admin/study/${encodeURIComponent(sid)}/exports/${encodeURIComponent(f.name)}/pseudonyms`} download
                         onClick={e => { if (!confirm(
                           'This file links participant codes to the names you typed when enrolling them.\n\n'
                           + 'Keep it apart from the data archive, never upload it to a repository or a shared drive, '
                           + 'and never send the two together.\n\nDownload it?')) e.preventDefault(); }}
                         style={{ color: 'var(--deny)', fontFamily: 'var(--sans)' }}>names key (keep separate)</a>
                    )}
                  </div>))}
              <div style={{ marginTop: 6, fontSize: fs(10), fontFamily: 'var(--sans)', color: 'var(--text-muted)', lineHeight: 1.5 }}>
                The archive holds no names — participants appear by code. The key from codes back to names is a separate
                file only an admin can download.
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
        TOKENS ({tokens.length})
      </div>
      {loading ? <div style={{ color: 'var(--text-muted)', fontSize: fs(11) }}>…</div>
       : tokens.length === 0 ? <div style={{ color: 'var(--text-muted)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>No tokens issued yet.</div>
       : (
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: fs(11) }}>
          <thead>
            <tr style={{ color: 'var(--text-muted)', textAlign: 'left' }}>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>study</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>condition</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>status</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}>session</th>
              <th style={{ padding: '6px 8px', fontWeight: 400 }}></th>
            </tr>
          </thead>
          <tbody>
            {tokens.map(t => {
              return (
                <tr key={t.token} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={{ padding: '8px', fontFamily: 'var(--sans)' }}>{t.study_id}</td>
                  <td style={{ padding: '8px', fontFamily: 'var(--sans)' }}>{t.condition}</td>
                  <td style={{ padding: '8px', color: stColor(t.status), fontFamily: 'var(--sans)' }}>{t.status}</td>
                  <td style={{ padding: '8px', fontFamily: 'var(--mono)', color: 'var(--text-muted)' }}>
                    {t.session_id || '—'}</td>
                  <td style={{ padding: '8px', textAlign: 'right' }}>
                    {t.status === 'scheduled' && (
                      <button onClick={() => voidToken(t.token)} style={{
                        background: 'none', border: '1px solid var(--border)', borderRadius: 3,
                        color: 'var(--deny)', cursor: 'pointer', fontSize: fs(10),
                        padding: '2px 6px', fontFamily: 'var(--mono)', letterSpacing: 1 }}>VOID</button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
      {error && <div style={{ marginTop: 14, padding: 10, borderRadius: 6, background: '#ef444420',
                              border: '1px solid #ef444440', color: '#ef4444', fontSize: fs(11),
                              fontFamily: 'var(--sans)' }}>{error}</div>}
    </div>
  );
}

// Text judging: the pilot's panel gives each submitted text absolute
// ratings. The researcher's job here is only to hand texts to judges and
// watch progress — assignment is "everything submitted so far", safe to
// press again as more sessions finish. Reading the texts is the panel's
// job; ratings reach the researcher through the export.
function AdminTextJudgingPanel({ fs }) {
  const [studies, setStudies] = useState([]);
  const [studyId, setStudyId] = useState('');
  const [judges, setJudges] = useState([]);
  const [judgeId, setJudgeId] = useState('');
  const [listing, setListing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const [error, setError] = useState(null);

  const loadListing = async (sid) => {
    if (!sid) { setListing(null); return; }
    try { setListing(await api(`/api/admin/study/${encodeURIComponent(sid)}/texts`)); }
    catch (e) { setError(e.message); }
  };
  useEffect(() => {
    (async () => {
      try {
        const [c, j] = await Promise.all([api('/api/admin/study/configs'), api('/api/admin/study/judges')]);
        setStudies(c.studies || []); setJudges(j.judges || []);
        if (c.studies?.length) setStudyId(c.studies[0].study_id);
        if (j.judges?.length) setJudgeId(String(j.judges[0].id));
      } catch (e) { setError(e.message); }
    })();
  }, []);
  useEffect(() => { loadListing(studyId); }, [studyId]);

  const assignAll = async () => {
    if (busy || !studyId || !judgeId) return;
    setBusy(true); setError(null); setNote(null);
    try {
      const r = await api(`/api/admin/study/${encodeURIComponent(studyId)}/text-assignments`, {
        method: 'POST', body: JSON.stringify({ judge_actor_id: parseInt(judgeId, 10) }),
      });
      setNote(`${r.created} pair${r.created === 1 ? '' : 's'} assigned` +
              (r.already_assigned ? ` (${r.already_assigned} already in this judge's queue)` : ''));
      await loadListing(studyId);
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const input = { padding: '8px 10px', background: 'var(--surface2)', border: '1px solid var(--border)',
                  borderRadius: 4, color: 'var(--text)', fontSize: fs(12), fontFamily: 'var(--sans)', outline: 'none' };
