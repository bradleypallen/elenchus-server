<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elenchus</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/static/icon-192.png" />
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<script>
  // Day mode is the default; dark is opt-in. Apply the light theme
  // synchronously before React so there's no flash for the default and
  // light cases. Dark-preferring users fall through to the :root dark
  // values below (also flash-free).
  (function() {
    try {
      var prefs = JSON.parse(localStorage.getItem('elenchus-display'));
      if (!prefs || prefs.theme !== 'dark') {
        var s = document.documentElement.style;
        s.setProperty('--bg', '#f5f5f7');
        s.setProperty('--surface', '#ffffff');
        s.setProperty('--surface2', '#eeeef2');
        s.setProperty('--border', '#d4d4dc');
        s.setProperty('--border-focus', '#b4b4c4');
        s.setProperty('--text', '#1a1a2e');
        s.setProperty('--text-dim', '#4a4a68');
        s.setProperty('--text-muted', '#8888a0');
        s.setProperty('--respondent-text', '#4a5568');
      }
    } catch(e) {}
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a12; --surface: #12121e; --surface2: #1a1a28;
    --border: #2a2a42; --border-focus: #4a4a6a;
    --text: #e0e0f0; --text-dim: #a0a0b8; --text-muted: #6a6a82;
    --commit: #3de0b0;
    --commit-bg: rgba(52,212,164,0.12);
    --commit-bg-strong: rgba(52,212,164,0.30);
    --commit-border: rgba(52,212,164,0.20);
    --deny: #f472b6;
    --deny-bg: rgba(244,114,182,0.12);
    --deny-bg-strong: rgba(244,114,182,0.30);
    --deny-border: rgba(244,114,182,0.20);
    --tension: #fcd34d;
    --tension-bg: rgba(250,204,21,0.10);
    --tension-bg-strong: rgba(250,204,21,0.30);
    --tension-border: rgba(250,204,21,0.18);
    --imp: #7cb3fc;
    --imp-bg: rgba(96,165,250,0.10);
    --imp-bg-strong: rgba(96,165,250,0.30);
    --imp-border: rgba(96,165,250,0.18);
    --contested: #64748b;
    --opp: #c4b5fd;
    --opp-bg: rgba(196,181,253,0.06);
    --opp-bg-strong: rgba(196,181,253,0.30);
    --opp-border: rgba(196,181,253,0.18);
    --accent: #818cf8;
    --respondent-text: #94a3b8;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  html, body, #root { height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: var(--mono); font-size: 12px; }
  input, textarea, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  /* Markdown inside opponent messages */
  .msg-md p { margin: 0 0 0.5em; }
  .msg-md p:last-child { margin-bottom: 0; }
  .msg-md ul, .msg-md ol { margin: 0.3em 0; padding-left: 1.4em; }
  .msg-md li { margin-bottom: 0.2em; }
  .msg-md strong { font-weight: 500; }
  .msg-md h1, .msg-md h2, .msg-md h3, .msg-md h4 { font-size: inherit; font-weight: 500; margin: 0.6em 0 0.3em; }
  @keyframes pdf-pulse {
    0%, 100% { border-color: var(--border-focus); color: var(--text-dim); }
    50% { border-color: var(--accent); color: var(--accent); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const API = '';  // Same origin

const { useState, useEffect, useRef, useCallback } = React;

// ── Display preferences ──

const DEFAULT_DISPLAY = {
  theme: 'light',
  fontScale: 1.0,
  colors: {
    commit: '#3de0b0',
    deny: '#f472b6',
    tension: '#fcd34d',
    imp: '#7cb3fc',
    opp: '#c4b5fd',
  }
};

const THEMES = {
  dark: {
    '--bg': '#0a0a12', '--surface': '#12121e', '--surface2': '#1a1a28',
    '--border': '#2a2a42', '--border-focus': '#4a4a6a',
    '--text': '#e0e0f0', '--text-dim': '#a0a0b8', '--text-muted': '#6a6a82',
    '--contested': '#64748b', '--accent': '#818cf8',
    '--respondent-text': '#94a3b8',
  },
  light: {
    '--bg': '#f5f5f7', '--surface': '#ffffff', '--surface2': '#eeeef2',
    '--border': '#d4d4dc', '--border-focus': '#b4b4c4',
    '--text': '#1a1a2e', '--text-dim': '#4a4a68', '--text-muted': '#8888a0',
    '--contested': '#64748b', '--accent': '#818cf8',
    '--respondent-text': '#4a5568',
  }
};

const FONT_SCALES = [
  { label: 'S', value: 0.85 },
  { label: 'M', value: 1.0 },
  { label: 'L', value: 1.15 },
  { label: 'XL', value: 1.3 },
];

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyDisplayPrefs(prefs) {
  const root = document.documentElement;
  const theme = THEMES[prefs.theme] || THEMES.light;

  // Set theme structural CSS vars
  Object.entries(theme).forEach(([k, v]) => root.style.setProperty(k, v));

  // Set semantic color vars + derived alpha variants
  const colors = prefs.colors || DEFAULT_DISPLAY.colors;
  const alphas = { bg: 0.12, 'bg-strong': 0.30, border: 0.20 };
  Object.entries(colors).forEach(([key, hex]) => {
    root.style.setProperty(`--${key}`, hex);
    Object.entries(alphas).forEach(([suffix, a]) => {
      root.style.setProperty(`--${key}-${suffix}`, hexToRgba(hex, a));
    });
  });

  // Set body font size
  document.body.style.fontSize = `${12 * (prefs.fontScale || 1.0)}px`;

  console.log('[elenchus] Display prefs applied:', JSON.stringify(prefs));
}

// ── API helpers ──

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    credentials: 'same-origin',
    ...opts,
  });
  if (res.status === 401) {
    // Session expired or never authenticated. Notify the AuthGate so it
    // can swap to the login view; throw so callers don't see undefined.
    window.dispatchEvent(new CustomEvent('elenchus:unauthorized'));
    const err = await res.json().catch(() => ({ detail: 'Not authenticated' }));
    throw new Error(err.detail || 'Not authenticated');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    // The LLM-failure path returns a structured detail object:
    //   { category, attempts, user_message }
    // Render `user_message` verbatim and attach the category so callers
    // (e.g. the message bar) can style the error differently from a
    // generic backend exception.
    if (err.detail && typeof err.detail === 'object' && err.detail.user_message) {
      const e = new Error(err.detail.user_message);
      e.category = err.detail.category;
      e.attempts = err.detail.attempts;
      e.detail = err.detail;
      throw e;
    }
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

// ── Opponent response parsing ──
//
// Mirrors `src/elenchus/response_parsing.py`. The opponent stores its
// raw JSON envelope in `conversation.content`; when we load history
// into the dialogue pane we want to show only the `response` field,
// not the JSON. The LLM occasionally emits "prose preamble + JSON"
// (with or without a ```json fence), so a simple JSON.parse on the
// whole content can miss real responses and leave raw JSON in the UI.
// We try fence-strip + direct parse first, then walk braces (string-
// aware) to recover JSON embedded after a preamble.
function extractResponseText(content) {
  if (!content) return content;
  let clean = content.trim();

  // Strip a leading ```...``` fence.
  if (clean.startsWith('```')) {
    const nl = clean.indexOf('\n');
    clean = nl >= 0 ? clean.slice(nl + 1) : clean.slice(3);
    if (clean.endsWith('```')) clean = clean.slice(0, -3);
    clean = clean.trim();
  }

  // Strategy 1: direct parse.
  try {
    const parsed = JSON.parse(clean);
    if (parsed && typeof parsed.response === 'string' && parsed.response.trim()) {
      return parsed.response;
    }
  } catch (e) { /* fall through */ }

  // Strategy 2: walk braces to find the first balanced { ... } block.
  const start = clean.indexOf('{');
  if (start < 0) return content;
  let depth = 0, inStr = false, escape = false;
  for (let i = start; i < clean.length; i++) {
    const ch = clean[i];
    if (escape) { escape = false; continue; }
    if (ch === '\\') { escape = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === '{') depth++;
    else if (ch === '}') {
      depth--;
      if (depth === 0) {
        try {
          const parsed = JSON.parse(clean.slice(start, i + 1));
          if (parsed && typeof parsed.response === 'string' && parsed.response.trim()) {
            return parsed.response;
          }
        } catch (e) { /* fall through */ }
        break;
      }
    }
  }

  // Strategy 3: tolerant salvage. JSON.parse rejects literal newlines in
  // strings, which the LLM emits in multi-paragraph responses — and such
  // turns may already be stored from before the server stored clean prose.
  // Read the "response" string value by hand, honoring escapes.
  const salvaged = salvageResponseField(clean);
  if (salvaged) return salvaged;

  return content;
}

// Pull the "response" string value out of a JSON-ish blob even when
// JSON.parse fails (e.g. unescaped newlines inside the string).
function salvageResponseField(s) {
  const m = s.match(/"response"\s*:\s*"/);
  if (!m) return null;
  let out = '', escape = false;
  for (let i = m.index + m[0].length; i < s.length; i++) {
    const ch = s[i];
    if (escape) {
      out += ch === 'n' ? '\n' : ch === 't' ? '\t' : ch === 'r' ? '' : ch;
      escape = false;
    } else if (ch === '\\') {
      escape = true;
    } else if (ch === '"') {
      break; // end of the response value
    } else {
      out += ch;
    }
  }
  return out.trim() ? out : null;
}

// ── Auth context ──
// Shared by AuthGate (provider) and App (consumer). Holds the current
// actor and a logout helper. Defaults to null while the gate is still
// determining whether the user is logged in.
const AuthContext = React.createContext(null);

// Whether this server can send mail at all (/healthz `email_enabled`).
// When it can't, "forgot password" and "email me a login link" would
// promise an email that never arrives — so the forms say what to do
// instead: an admin can make a reset link from the Users tab.
function useEmailEnabled() {
  const [enabled, setEnabled] = useState(true);
  useEffect(() => {
    fetch(API + '/healthz').then(r => r.json()).then(h => {
      if (h && h.email_enabled === false) setEnabled(false);
    }).catch(() => {});
  }, []);
  return enabled;
}

function NoEmailNotice({ what }) {
  const enabled = useEmailEnabled();
  if (enabled) return null;
  return (
    <div role="note" style={{
      marginBottom: 14, padding: '10px 12px', borderRadius: 6, border: '1px solid var(--tension)',
      fontSize: 12, fontFamily: 'var(--sans)', color: 'var(--text-dim)', lineHeight: 1.6,
    }}>
      <b style={{ color: 'var(--text)' }}>This server isn’t set up to send email</b>, so {what} can’t reach you.
      Ask an administrator instead: in the dashboard’s <i>Users</i> tab they can press <i>reset password</i> and
      send you the one-time link it shows.
    </div>
  );
}

// ── Auth UI ──
//
// Three small, deliberately stylistically-aligned forms: login, signup
// (consumes an invite token), and a magic-link request. They share an
// outer chrome (centered card with the ELENCHUS wordmark on top) so
// the user never feels like they've left the app.

// ─── Partner institutions ────────────────────────────────────────────
// A quiet strip of the project's partner institutions, shown where people
// arrive (sign-in, home, the participant welcome / thank-you screens) and
// never inside the working interface — that stays identical and
// uncluttered in both study conditions.
//
// It is driven entirely by /static/partners.json: a partner with a `logo`
// file shows the logo; one without shows its name as a plain link. So the
// strip is presentable before any logo has been supplied, and adding one
// is a file drop plus a one-line edit (see static/logos/README.md).
let _partnersPromise = null;
function loadPartners() {
  if (!_partnersPromise) {
    _partnersPromise = fetch('/static/partners.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : { partners: [] }))
      .catch(() => ({ partners: [] }));
  }
  return _partnersPromise;
}

function PartnerLogo({ partner }) {
  const [broken, setBroken] = useState(false);
  const link = { textDecoration: 'none', display: 'inline-flex', alignItems: 'center' };
  if (!partner.logo || broken) {
    return (
      <a href={partner.url} target="_blank" rel="noopener noreferrer" title={partner.title || partner.name}
         style={{ ...link, color: 'var(--text-muted)', fontFamily: 'var(--sans)', fontSize: 12 }}>
        {partner.name}
      </a>
    );
  }
  // Logos sit on a white plate: most are drawn for light backgrounds and
  // would vanish, or look wrong, against the dark theme. A `caption`
  // names in full what the logo alone may not — a lab's logo doesn't say
  // which university it belongs to.
  return (
    <a href={partner.url} target="_blank" rel="noopener noreferrer" title={partner.title || partner.name}
       style={{ ...link, flexDirection: 'column', gap: 6 }}>
      <span style={{ background: '#fff', borderRadius: 8, padding: '8px 14px', display: 'block' }}>
        <img src={`/static/logos/${partner.logo}`} alt={partner.title || partner.name}
             onError={() => setBroken(true)}
             style={{ height: 36, maxWidth: 190, width: 'auto', display: 'block', objectFit: 'contain' }} />
      </span>
      {partner.caption && (
        <span style={{ color: 'var(--text-muted)', fontFamily: 'var(--sans)', fontSize: 11 }}>{partner.caption}</span>
      )}
    </a>
  );
}

// The funder acknowledgement: one plain sentence, with the funder's name
// linked. The wording (and any grant number) lives in partners.json.
function FundingLine({ funding }) {
  if (!funding || !funding.text) return null;
  const { text, link_text: linkText, url } = funding;
  const at = linkText && url ? text.indexOf(linkText) : -1;
  return (
    <div style={{ marginTop: 16, color: 'var(--text-muted)', fontFamily: 'var(--sans)', fontSize: 11, lineHeight: 1.6 }}>
      {at < 0 ? text : (
        <>
          {text.slice(0, at)}
          <a href={url} target="_blank" rel="noopener noreferrer" style={{ color: 'inherit' }}>{linkText}</a>
          {text.slice(at + linkText.length)}
        </>
      )}
    </div>
  );
}

// The strip as a page footer: the content above stays vertically centred
// in the space that's left, and the logos get the width of the page.
function PartnerFooter() {
  return (
    <PartnerStrip style={{ flexShrink: 0, width: '100%', maxWidth: 1000, margin: '0 auto',
                           padding: '12px 24px 22px', boxSizing: 'border-box' }} />
  );
}

function PartnerStrip({ style }) {
  const [config, setConfig] = useState(null);
  useEffect(() => { let live = true; loadPartners().then(c => { if (live) setConfig(c); }); return () => { live = false; }; }, []);
  const partners = (config && config.partners) || [];
  if (partners.length === 0 && !(config && config.funding)) return null;
  return (
    <nav aria-label="Partner institutions and funding" style={{ textAlign: 'center', ...style }}>
      {config.label && (
        <div style={{ fontSize: 9, letterSpacing: 2, textTransform: 'uppercase',
                      color: 'var(--text-muted)', marginBottom: 12 }}>{config.label}</div>
      )}
      {partners.some(pt => pt.logo) ? (
        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignItems: 'flex-start', gap: '14px 28px' }}>
          {partners.map(pt => <PartnerLogo key={pt.name} partner={pt} />)}
        </div>
      ) : (
        // Names only: full institution names are long, and a flex row
        // breaks wherever it runs out of room — typically orphaning the
        // last name. As running text the browser can balance the lines.
        <div style={{ textWrap: 'balance', lineHeight: 2.1, fontFamily: 'var(--sans)', fontSize: 12 }}>
          {partners.map((pt, i) => (
            <React.Fragment key={pt.name}>
              {/* A real space between items: adjacent inline elements give
                  the browser nowhere to break the line otherwise. Spacing,
                  not a separator character — a dot would strand itself at
                  the start or end of a wrapped line. */}
              {i > 0 && ' '}
              <a href={pt.url} target="_blank" rel="noopener noreferrer" title={pt.title || pt.name}
                 style={{ color: 'var(--text-muted)', textDecoration: 'none', whiteSpace: 'nowrap',
                          display: 'inline-block', margin: '0 14px' }}>{pt.name}</a>
            </React.Fragment>
          ))}
        </div>
      )}
      <FundingLine funding={config.funding} />
    </nav>
  );
}

function AuthShell({ children, footer, error, title }) {
  return (
    <div style={{ minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ maxWidth: 420, width: '100%', padding: 48 }}>
        <div style={{ textAlign: 'center', marginBottom: 36 }}>
          <div style={{ fontSize: 11, letterSpacing: 8, color: 'var(--text-muted)', marginBottom: 16 }}>
            ἜΛΕΓΧΟΣ
          </div>
          <h1 style={{ fontSize: 28, fontWeight: 300, letterSpacing: -0.5 }}>Elenchus</h1>
          {title && (
            <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 10,
                          fontFamily: 'var(--sans)' }}>
              {title}
            </div>
          )}
        </div>
        {children}
        {error && (
          <div style={{ marginTop: 14, padding: 10, borderRadius: 6,
                        background: '#ef444420', border: '1px solid #ef444440',
                        color: '#ef4444', fontSize: 12, fontFamily: 'var(--sans)' }}>
            {error}
          </div>
        )}
        {footer && (
          <div style={{ marginTop: 20, textAlign: 'center', fontSize: 11,
                        color: 'var(--text-muted)', fontFamily: 'var(--sans)' }}>
            {footer}
          </div>
        )}
      </div>
    </div>
    <PartnerFooter />
    </div>
  );
}

const authInputStyle = {
  width: '100%', padding: '11px 13px', marginBottom: 10,
  background: 'var(--surface)', border: '1px solid var(--border)',
  borderRadius: 6, color: 'var(--text)', fontSize: 13, outline: 'none',
  fontFamily: 'var(--sans)',
};

const authButtonStyle = (enabled) => ({
  width: '100%', padding: '11px 16px',
  background: enabled ? 'var(--accent)' : 'var(--surface)',
  border: 'none', borderRadius: 6, color: '#111',
  fontSize: 12, cursor: enabled ? 'pointer' : 'default',
  letterSpacing: 1, fontWeight: 500, opacity: enabled ? 1 : 0.3,
});

const authLinkStyle = {
  background: 'none', border: 'none', color: 'var(--accent)',
  cursor: 'pointer', fontSize: 11, padding: '4px 6px',
  fontFamily: 'var(--sans)', textDecoration: 'underline',
};

function Login({ onAuthed, onSwitchSignup, onSwitchMagic, onSwitchForgot }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const submit = async () => {
    if (!email || !password || busy) return;
    setBusy(true); setError(null);
    try {
      await api('/api/auth/login', {
        method: 'POST', body: JSON.stringify({ email, password }),
      });
      onAuthed();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  return (
    <AuthShell
      error={error}
      title="Sign in to your account"
      footer={
        <>
          <button style={authLinkStyle} onClick={onSwitchForgot}>forgot password?</button>
          <span style={{ margin: '0 6px' }}>·</span>
          <button style={authLinkStyle} onClick={onSwitchMagic}>email me a login link</button>
          <span style={{ margin: '0 6px' }}>·</span>
          <button style={authLinkStyle} onClick={onSwitchSignup}>sign up with invite</button>
        </>
      }
    >
      <input
        type="email" value={email} onChange={e => setEmail(e.target.value)}
        placeholder="email" autoFocus style={authInputStyle}
      />
      <input
        type="password" value={password} onChange={e => setPassword(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') submit(); }}
        placeholder="password" style={authInputStyle}
      />
      <button onClick={submit} disabled={!email || !password || busy} style={authButtonStyle(!!(email && password) && !busy)}>
        {busy ? '…' : 'SIGN IN'}
      </button>
    </AuthShell>
  );
}

function Signup({ initialToken, onAuthed, onSwitchLogin }) {
  const [token, setToken] = useState(initialToken || '');
  const [displayName, setDisplayName] = useState('');
  const [password, setPassword] = useState('');
  const [email, setEmail] = useState('');
  const [needsEmail, setNeedsEmail] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  // An invitation issued without an email can only be used if this form
  // asks for one. Ask the server what this token needs.
  useEffect(() => {
    if (!token) { setNeedsEmail(false); return; }
    let cancelled = false;
    fetch(API + `/api/auth/invites/${encodeURIComponent(token)}`)
      .then(r => r.ok ? r.json() : null)
      .then(info => { if (!cancelled) setNeedsEmail(!!(info && info.needs_email)); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [token]);

  const submit = async () => {
    if (!token || !displayName || !password || busy || (needsEmail && !email.trim())) return;
    setBusy(true); setError(null);
    try {
      await api('/api/auth/signup', {
        method: 'POST',
        body: JSON.stringify({ token, display_name: displayName, password,
                               ...(needsEmail ? { email_override: email.trim() } : {}) }),
      });
      // Clean the ?token= from the URL so a refresh doesn't re-submit.
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, '', window.location.pathname);
      }
      onAuthed();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const invited = !!initialToken;
  return (
    <AuthShell
      error={error}
      title={invited ? 'Set up your account' : 'Sign up with an invite'}
      footer={
        <>
          have an account?{' '}
          <button style={authLinkStyle} onClick={onSwitchLogin}>sign in</button>
        </>
      }
    >
      {invited ? (
        // Arrived via an invite link: the token is already in hand, so
        // don't make the user look at it — just have them set up the account.
        <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 14,
                      textAlign: 'center', fontFamily: 'var(--sans)', lineHeight: 1.5 }}>
          You've been invited. Choose a display name and a password to finish
          setting up your account.
        </div>
      ) : (
        <input
          value={token} onChange={e => setToken(e.target.value)}
          placeholder="invite token" style={authInputStyle}
        />
      )}
      {needsEmail && (
        <input
          type="email" value={email} onChange={e => setEmail(e.target.value)}
          placeholder="your email — you'll sign in with it" style={authInputStyle}
        />
      )}
      <input
        value={displayName} onChange={e => setDisplayName(e.target.value)}
        placeholder="display name" autoFocus={invited} style={authInputStyle}
      />
      <input
        type="password" value={password} onChange={e => setPassword(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') submit(); }}
        placeholder="choose a password" style={authInputStyle}
      />
      <button onClick={submit} disabled={!token || !displayName || !password || busy || (needsEmail && !email.trim())}
        style={authButtonStyle(!!(token && displayName && password && (!needsEmail || email.trim())) && !busy)}>
        {busy ? '…' : 'CREATE ACCOUNT'}
      </button>
    </AuthShell>
  );
}

function MagicLink({ onSwitchLogin }) {

  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  const [error, setError] = useState(null);

  const submit = async () => {
    if (!email || busy) return;
    setBusy(true); setError(null);
    try {
      await api('/api/auth/magic-link', {
        method: 'POST', body: JSON.stringify({ email }),
      });
      setSent(true);
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  return (
    <AuthShell
      error={error}
      title="Email me a login link"

        </div>

          <input

  const [sent, setSent] = useState(false);

  const submit = async () => {

// Shared new-password form used by both the reset-link and forced-change
// screens. Enforces the same min length + match the backend checks.
function NewPasswordFields({ pw, pw2, setPw, setPw2, onSubmit }) {
  return (
    <>
      <input
        type="password" value={pw} onChange={e => setPw(e.target.value)}
        placeholder="new password (min 10 characters)" autoFocus style={authInputStyle}
      />
      <input
        type="password" value={pw2} onChange={e => setPw2(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') onSubmit(); }}
        placeholder="confirm new password" style={authInputStyle}
      />
    </>
  );
}

function validateNewPassword(pw, pw2) {
  if (pw.length < 10) return 'Password must be at least 10 characters.';
  if (pw !== pw2) return 'Passwords do not match.';
  return null;
}

function ResetPassword({ token, onSwitchLogin }) {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(false);

  const submit = async () => {
    if (busy) return;
    const v = validateNewPassword(pw, pw2);
    if (v) { setError(v); return; }
    setBusy(true); setError(null);
    try {
      await api('/api/auth/reset-password', {
        method: 'POST', body: JSON.stringify({ token, new_password: pw }),
      });
      setDone(true);
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  return (
    <AuthShell
      error={error}
      title="Choose a new password"
      footer={<button style={authLinkStyle} onClick={onSwitchLogin}>back to sign in</button>}
    >
      {done ? (
        <div style={{ textAlign: 'center', fontSize: 13, color: 'var(--text-dim)',
                      fontFamily: 'var(--sans)', lineHeight: 1.6, padding: '16px 8px' }}>
          Your password has been updated.{' '}
          <button style={authLinkStyle} onClick={onSwitchLogin}>Sign in</button>
        </div>
      ) : (
        <>
          <NewPasswordFields pw={pw} pw2={pw2} setPw={setPw} setPw2={setPw2} onSubmit={submit} />
          <button onClick={submit} disabled={!pw || !pw2 || busy} style={authButtonStyle(!!pw && !!pw2 && !busy)}>
            {busy ? '…' : 'SET NEW PASSWORD'}
          </button>
        </>
      )}
    </AuthShell>
  );
}

function ForceSetPassword({ onDone, logout }) {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const submit = async () => {
    if (busy) return;
    const v = validateNewPassword(pw, pw2);
    if (v) { setError(v); return; }
    setBusy(true); setError(null);
    try {
      await api('/api/auth/set-password', { method: 'POST', body: JSON.stringify({ new_password: pw }) });
      onDone();
    } catch (e) { setError(e.message); setBusy(false); }
  };

  return (
    <AuthShell
      error={error}
      title="Set a new password to continue"
      footer={<button style={authLinkStyle} onClick={logout}>sign out</button>}
    >
      <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 14,
                    textAlign: 'center', fontFamily: 'var(--sans)', lineHeight: 1.5 }}>
        Your administrator requires you to choose a new password before continuing.
      </div>
      <NewPasswordFields pw={pw} pw2={pw2} setPw={setPw} setPw2={setPw2} onSubmit={submit} />
      <button onClick={submit} disabled={!pw || !pw2 || busy} style={authButtonStyle(!!pw && !!pw2 && !busy)}>
        {busy ? '…' : 'SET PASSWORD'}
      </button>
    </AuthShell>
  );
}

function AuthGate() {
  // Resolution states: 'pending' (initial check in flight), 'login',
  // 'signup', 'magic', 'forgot', 'reset', 'authed', 'study-error'.
  const [phase, setPhase] = useState('pending');
  const [actor, setActor] = useState(null);
  const [initialToken, setInitialToken] = useState(null);
  const [studyError, setStudyError] = useState(null);
  const [resetToken, setResetToken] = useState(null);

  // On mount: check the URL for a study token (?study=) or invite
  // token (?token=), then fall back to an existing session.
  useEffect(() => {
    const url = new URL(window.location.href);
    const token = url.searchParams.get('token');
    const studyToken = url.searchParams.get('study');
    const resetTok = url.searchParams.get('reset');

    (async () => {
      // A password-reset link always shows the reset form (even if a
      // session exists) so the user can set a new password.
      if (resetTok) {
        setResetToken(resetTok);
        window.history.replaceState({}, '', window.location.pathname);
        setPhase('reset');
        return;
      }
      // Study link takes precedence: consuming it issues a session
      // cookie for the participant actor in one step — no login.
      if (studyToken) {
        try {
          await api(`/api/study/${encodeURIComponent(studyToken)}`, { method: 'POST' });
          window.history.replaceState({}, '', window.location.pathname);
          const me = await api('/api/auth/me');
          setActor(me); setPhase('authed');
          return;
        } catch (e) {
          // A second-session link opened too early. Say so — and don't
          // fall through to the cookie check below: this browser may
          // still hold the *first* session's cookie, which would land
          // the participant on a "finished" screen with no explanation.
          if (e.detail && e.detail.status === 'not_yet') {
            let msg = e.message;
            if (e.detail.opens_at) {
              // The server sends the instant; show it in their own zone.
              const when = new Date(e.detail.opens_at).toLocaleString([], {
                weekday: 'long', day: 'numeric', month: 'long',
                hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
              });
              msg = "Your second session isn't open yet — the two sessions are kept apart. " +
                    `This link will work from ${when}.`;
            }
            setStudyError(msg);
            setPhase('study-error');
            return;
          }
          // Already-used links are fine if we still hold the cookie —
          // a participant refreshing the page lands here.
          try {
            const me = await api('/api/auth/me');
            window.history.replaceState({}, '', window.location.pathname);
            setActor(me); setPhase('authed');
            return;
          } catch (e2) {
            setStudyError(e.message || 'This study link cannot be used.');
            setPhase('study-error');
            return;
          }
        }
      }
      try {
        const me = await api('/api/auth/me');
        setActor(me); setPhase('authed');
      } catch (e) {
        if (token) {
          setInitialToken(token);
          setPhase('signup');
        } else {
          setPhase('login');
        }
      }
    })();

    // Any request that 401s while we believe we're authed kicks us back
    // to login. Don't wipe the in-flight initial check, though.
    const onUnauthorized = () => {
      setActor(null);
      setPhase((cur) => cur === 'pending' ? cur : 'login');
    };
    window.addEventListener('elenchus:unauthorized', onUnauthorized);
    return () => window.removeEventListener('elenchus:unauthorized', onUnauthorized);
  }, []);

  const onAuthed = async () => {
    try {
      const me = await api('/api/auth/me');
      setActor(me); setPhase('authed');
    } catch (e) {
      // Shouldn't happen — we just authed. Fall back to login.
      setPhase('login');
    }
  };

  const logout = async () => {
    try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) {}
    setActor(null);
    setPhase('login');
  };

  if (phase === 'pending') {
    return (
      <AuthShell>
        <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: 12 }}>
          …
        </div>
      </AuthShell>
    );
  }
  if (phase === 'login') {
    return <Login
      onAuthed={onAuthed}
      onSwitchSignup={() => setPhase('signup')}
      onSwitchMagic={() => setPhase('magic')}
      onSwitchForgot={() => setPhase('forgot')}
    />;
  }
  if (phase === 'signup') {
    return <Signup
      initialToken={initialToken}
      onAuthed={onAuthed}
      onSwitchLogin={() => setPhase('login')}
    />;
  }
  if (phase === 'magic') {
    return <MagicLink onSwitchLogin={() => setPhase('login')} />;
  }
  if (phase === 'forgot') {
    return <ForgotPassword onSwitchLogin={() => setPhase('login')} />;
  }
  if (phase === 'reset') {
    return <ResetPassword token={resetToken} onSwitchLogin={() => setPhase('login')} />;
  }
  if (phase === 'study-error') {
    return (
      <AuthShell error={studyError}>
        <div style={{ textAlign: 'center', fontSize: 13, color: 'var(--text-dim)',
                      fontFamily: 'var(--sans)', lineHeight: 1.7, padding: '8px 4px' }}>
          This study link can't be used right now. If you believe this is a
          mistake, please contact the researcher who sent it to you.
        </div>
      </AuthShell>
    );
  }
  // Authed — but if the admin flagged this account, force a password
  // change before anything else.
  if (actor && actor.must_change_password) {
    return <ForceSetPassword onDone={onAuthed} logout={logout} />;
  }
  return (
    <AuthContext.Provider value={{ actor, logout }}>
      <App />
    </AuthContext.Provider>
  );
}

// ── App ──

function App() {
  // Pulled from AuthGate's provider. Null only in the (impossible)
  // case that App renders outside the gate — bail safely if so.
  const authCtx = React.useContext(AuthContext) || { actor: null, logout: () => {} };
  const { actor, logout } = authCtx;

  const [view, setView] = useState('home'); // home | positum | dialogue
  const [dialectics, setDialectics] = useState([]);
  const [current, setCurrent] = useState(() => localStorage.getItem('elenchus-current') || null);
  // Session-keyed API: when set, dialectic verbs address /api/sessions/{id}.
  // Left null for the constrained study-participant flow (which opens
  // practice-/task- bases by name) and on localStorage restore, both of
  // which fall back to the retained /api/dialectics/{name} alias below.
  const [currentSessionId, setCurrentSessionId] = useState(null);
  const [state, setState] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [newName, setNewName] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  const [settings, setSettings] = useState({ model: '', base_url: '', has_api_key: false });
  const [settingsForm, setSettingsForm] = useState({ api_key: '', base_url: '', model: '' });
  const [settingsSaving, setSettingsSaving] = useState(false);
  const [pdfLoading, setPdfLoading] = useState(false);
  // ── Study flow (Sloan participants) ──
  // Non-null only for actors with kind='participant' and a live study
  // session. Drives the briefing → tutorial → active → post_session →
  // surveyed → complete routing.
  const [studySession, setStudySession] = useState(null);
  const [studyBusy, setStudyBusy] = useState(false);
  // The participant's text (the writing pane's content). Held here
  // because FINISH SESSION, in the header, is what submits it.
  const [studyText, setStudyText] = useState('');
  const isParticipant = actor?.kind === 'participant';
  const isBaseline = studySession?.condition === 'baseline';
  const [displayPrefs, setDisplayPrefs] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('elenchus-display'));
      if (saved) {
        return { ...DEFAULT_DISPLAY, ...saved, colors: { ...DEFAULT_DISPLAY.colors, ...(saved.colors || {}) } };
      }
    } catch (e) {}
    return DEFAULT_DISPLAY;
  });
  const msgEnd = useRef(null);
  const inputRef = useRef(null);

  // ── Column resizing ──
  const [leftWidth, setLeftWidth] = useState(() => {
    try { const v = parseInt(localStorage.getItem('elenchus-left-w')); return v > 0 ? v : 260; } catch(e) { return 260; }
  });
  const [rightWidth, setRightWidth] = useState(() => {
    try { const v = parseInt(localStorage.getItem('elenchus-right-w')); return v > 0 ? v : 280; } catch(e) { return 280; }
  });
  // Side panes hidden by default; user toggles them via header buttons.
  const [leftVisible, setLeftVisible] = useState(() => {
    try { return localStorage.getItem('elenchus-left-visible') === '1'; } catch(e) { return false; }
  });
  const [rightVisible, setRightVisible] = useState(() => {
    try { return localStorage.getItem('elenchus-right-visible') === '1'; } catch(e) { return false; }
  });
  const dragging = useRef(null); // 'left' | 'right' | null

  useEffect(() => {
    const onMouseMove = (e) => {
      if (!dragging.current) return;
      e.preventDefault();
      if (dragging.current === 'left') {
        const w = Math.max(160, Math.min(e.clientX, window.innerWidth * 0.4));
        setLeftWidth(w);
      } else {
        const w = Math.max(160, Math.min(window.innerWidth - e.clientX, window.innerWidth * 0.4));
        setRightWidth(w);
      }
    };
    const onMouseUp = () => {
      if (dragging.current) {
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        dragging.current = null;
      }
    };
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    return () => { window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp); };
  }, []);

  useEffect(() => {
    if (current) localStorage.setItem('elenchus-current', current);
    else localStorage.removeItem('elenchus-current');
  }, [current]);
  useEffect(() => { localStorage.setItem('elenchus-left-w', leftWidth); }, [leftWidth]);
  useEffect(() => { localStorage.setItem('elenchus-right-w', rightWidth); }, [rightWidth]);
  useEffect(() => { localStorage.setItem('elenchus-left-visible', leftVisible ? '1' : '0'); }, [leftVisible]);
  useEffect(() => { localStorage.setItem('elenchus-right-visible', rightVisible ? '1' : '0'); }, [rightVisible]);

  const startDrag = (side) => (e) => {
    e.preventDefault();
    dragging.current = side;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  };

  // Display preferences — persist and apply on every change (including initial)
  useEffect(() => {
    localStorage.setItem('elenchus-display', JSON.stringify(displayPrefs));
    applyDisplayPrefs(displayPrefs);
  }, [displayPrefs]);

  // Scaled font size helper
  const fs = useCallback((px) => Math.round(px * displayPrefs.fontScale), [displayPrefs.fontScale]);

  useEffect(() => {
    if (isParticipant) {
      // Participants are routed by their study session state, not by
      // localStorage restore (a shared machine could carry another
      // user's `elenchus-current`).
      refreshStudySession();
      return;
    }
    loadDialectics();
    if (actor.kind === 'admin') loadSettings();
    // Restore last-open dialectic on refresh
    const saved = localStorage.getItem('elenchus-current');
    if (saved) openDialectic(saved).catch(() => {
      localStorage.removeItem('elenchus-current');
      setCurrent(null); setCurrentSessionId(null); setState(null); setView('home'); setError(null);
    });
  }, []);

  // ── Study flow actions ──

  const refreshStudySession = async () => {
    try {
      const s = await api('/api/study/session');
      setStudySession(s);
      // Tutorial/active sessions re-open their working base on refresh.
      if (s.state === 'tutorial') {
        await openDialectic(`practice-${s.id}`).catch(() => {});
      } else if (s.state === 'active' && s.base_id) {
        await openDialectic(s.base_id).catch(() => {});
      }
    } catch (e) {
      setStudySession(null); // participant with no live session
    }
  };

  const studyBeginTutorial = async () => {
    if (studyBusy) return;
    setStudyBusy(true); setError(null);
    try {
      const s = await api('/api/study/session/begin-tutorial', { method: 'POST' });
      setStudySession(s);
      await openDialectic(s.practice_base_id);
    } catch (e) { setError(e.message); }
    setStudyBusy(false);
  };

  const studyBeginTask = async () => {
    if (studyBusy) return;
    if (!confirm('Start the real task? The practice conversation will be left behind.')) return;
    setStudyBusy(true); setError(null);
    try {
      const s = await api('/api/study/session/begin-task', { method: 'POST' });
      setStudySession(s);
      setMessages([]); setState(null);
      await openDialectic(s.task_base_id);
    } catch (e) { setError(e.message); }
    setStudyBusy(false);
  };

  const studyFinish = async () => {
    if (studyBusy) return;
    const words = countWords(studyText);
    if (words === 0) {
      setError('Your text is empty — please write your introduction before finishing.');
      return;
    }
    const prompt = words < 60
      ? `Your text is only ${words} words — the target is two or three paragraphs. Finish anyway? You will not be able to return to the task.`
      : 'Finish the session and submit your text? You will not be able to return to the task.';
    if (!confirm(prompt)) return;
    setStudyBusy(true); setError(null);
    try {
      const s = await api('/api/study/session/finish', {
        method: 'POST', body: JSON.stringify({ content: studyText }),
      });
      setStudySession(s);
      setCurrent(null); setCurrentSessionId(null); setState(null);
    } catch (e) { setError(e.message); }
    setStudyBusy(false);
  };

  const studyAdvance = async (toState) => {
    if (studyBusy) return;
    setStudyBusy(true); setError(null);
    try {
      const s = await api('/api/study/session/advance', {
        method: 'POST', body: JSON.stringify({ to_state: toState }),
      });
      setStudySession(s);
      if (toState === 'post_session') { setCurrent(null); setCurrentSessionId(null); setState(null); }
    } catch (e) { setError(e.message); }
    setStudyBusy(false);
  };
  useEffect(() => { msgEnd.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);
  useEffect(() => {
    // A participant may be typing in the writing pane when the reply
    // lands — leave the cursor where they put it.
    if (document.activeElement?.dataset?.studyEditor === '1') return;
    if (view !== 'home') inputRef.current?.focus();
  }, [view, loading]);

  // Build a dialectic-verb URL. Session-keyed when we hold a session id
  // (normal flow), else name-keyed via the retained alias (participant
  // flow + localStorage restore).
  const dxPath = (suffix = '') => currentSessionId != null
    ? `/api/sessions/${currentSessionId}${suffix}`
    : `/api/dialectics/${encodeURIComponent(current)}${suffix}`;

  const loadDialectics = async () => {
    try { setDialectics(await api('/api/sessions')); }
    catch (e) { /* server may not be running yet */ }
  };

  const loadSettings = async () => {
    // Admin-only: GET /api/settings is gated. Settings now persist
    // server-side (model/endpoint plaintext, key encrypted), so there is
    // no localStorage re-sync to do — just fetch and populate the form.
    try {
      const s = await api('/api/settings');
      setSettings(s);
      setSettingsForm({ api_key: '', base_url: s.base_url || '', model: s.model || '' });
    } catch (e) { /* not an admin, or server not ready — leave defaults */ }
  };

  const openSettingsPanel = () => {
    setSettingsForm({ api_key: '', base_url: settings.base_url || '', model: settings.model || '' });
    setShowSettings(true);
  };

  const saveSettings = async () => {
    setSettingsSaving(true);
    try {
      const body = {};
      if (settingsForm.api_key) body.api_key = settingsForm.api_key;
      if (settingsForm.base_url !== undefined) body.base_url = settingsForm.base_url;
      if (settingsForm.model) body.model = settingsForm.model;
      const s = await api('/api/settings', {
        method: 'PUT', body: JSON.stringify(body)
      });
      setSettings(s);
      // Settings persist server-side now (key encrypted at rest); nothing
      // to stash in localStorage.
      setShowSettings(false);
    } catch (e) { setError(e.message); }
    setSettingsSaving(false);
  };

  const createDialectic = async () => {
    const name = newName.trim();
    if (!name) return;
    try {
      const res = await api('/api/sessions', {
        method: 'POST', body: JSON.stringify({ name, topic: name })
      });
      setCurrent(name);
      setCurrentSessionId(res.session_id ?? null);
      setState(res.state);
      setMessages([]);
      setView('positum');
      setNewName('');
      loadDialectics();
    } catch (e) { setError(e.message); }
  };

  // `sessionId` is supplied from the home list (session-keyed); the
  // study-participant flow and localStorage restore call without it, so
  // those resolve through the /api/dialectics/{name} alias.
  const openDialectic = async (name, sessionId = null) => {
    try {
      const s = sessionId != null
        ? await api(`/api/sessions/${sessionId}`)
        : await api(`/api/dialectics/${encodeURIComponent(name)}`);
      setCurrent(name);
      setCurrentSessionId(sessionId);
      setState(s);
      // Restore conversation history from DB. Assistant messages are
      // stored as the raw LLM payload; extractResponseText pulls out
      // just the `response` field, tolerating prose preambles and
      // un-fenced JSON the same way opponent.py's parser does.
      const roleMap = { user: 'respondent', assistant: 'opponent' };
      const history = (s.conversation || []).map(m => {
        const content = m.role === 'assistant' ? extractResponseText(m.content) : m.content;
        return { role: roleMap[m.role] || m.role, content };
      });
      setMessages([
        { role: 'system', content: `Resumed dialectic: ${s.name}` },
        ...history,
      ]);
      setView('dialogue');
    } catch (e) { setError(e.message); }
  };

  const deleteDialectic = async (name, sessionId = null) => {
    try {
      await api(sessionId != null
        ? `/api/sessions/${sessionId}`
        : `/api/dialectics/${encodeURIComponent(name)}`, { method: 'DELETE' });
      loadDialectics();
      if (current === name) { setCurrent(null); setCurrentSessionId(null); setState(null); setView('home'); }
    } catch (e) { setError(e.message); }
  };

  const sendMessage = async (msg) => {
    if (!msg?.trim() || loading) return;
    setInput('');
    setMessages(prev => [...prev, { role: 'respondent', content: msg }]);
    setLoading(true);
    setError(null);
    try {
      const res = await api(dxPath('/message'), {
        method: 'POST', body: JSON.stringify({ message: msg })
      });
      setState(res.state);
      // Always surface the opponent's turn. Normally that's its `response`
      // prose; if the model returned only tensions/speech-acts with no
      // prose, show a brief placeholder rather than nothing (the missing
      // bubble was otherwise only visible after a reload).
      const opp = res.response
        ? res.response
        : (res.new_tensions?.length
            ? '(Proposed a new tension — see the Tensions pane.)'
            : (res.speech_acts?.length ? '(Updated the position.)' : ''));
      if (opp) {
        setMessages(prev => [...prev, {
          role: 'opponent', content: opp,
          acts: res.speech_acts, tensions: res.new_tensions
        }]);
      }
    } catch (e) {
      setError(e.message);
      setMessages(prev => [...prev, { role: 'error', content: e.message }]);
    }
    setLoading(false);
  };

  const submitPositum = async () => {
    const msg = input.trim();
    if (!msg || loading) return;
    setInput('');
    setView('dialogue');
    await sendMessage(msg);
  };

  const acceptTension = async (t) => {
    if (loading) return;
    try {
      const res = await api(dxPath(`/tensions/${t.id}`), {
        method: 'POST', body: JSON.stringify({ action: 'accept' })
      });
      setState(res.state);
      // Phase 2: notify opponent
      const followUp = `I accept tension T${t.id}.`;
      setMessages(prev => [...prev, { role: 'respondent', content: followUp }]);
      setLoading(true);
      setError(null);
      try {
        const oppRes = await api(dxPath('/message'), {
          method: 'POST', body: JSON.stringify({ message: followUp, context: { action: 'accept', tension_id: t.id, gamma: t.gamma, delta: t.delta } })
        });
        setState(oppRes.state);
        if (oppRes.response) {
          setMessages(prev => [...prev, {
            role: 'opponent', content: oppRes.response,
            acts: oppRes.speech_acts, tensions: oppRes.new_tensions
          }]);
        }
      } catch (e2) {
        setError(e2.message);
        setMessages(prev => [...prev, { role: 'error', content: e2.message }]);
      }
      setLoading(false);
    } catch (e) { setError(e.message); }
  };

  const contestTension = async (t) => {
    if (loading) return;
    try {
      const res = await api(dxPath(`/tensions/${t.id}`), {
        method: 'POST', body: JSON.stringify({ action: 'contest' })
      });
      setState(res.state);
      // Phase 2: notify opponent
      const followUp = `I contest tension T${t.id}.`;
      setMessages(prev => [...prev, { role: 'respondent', content: followUp }]);
      setLoading(true);
      setError(null);
      try {
        const oppRes = await api(dxPath('/message'), {
          method: 'POST', body: JSON.stringify({ message: followUp, context: { action: 'contest', tension_id: t.id, gamma: t.gamma, delta: t.delta } })
        });
        setState(oppRes.state);
        if (oppRes.response) {
          setMessages(prev => [...prev, {
            role: 'opponent', content: oppRes.response,
            acts: oppRes.speech_acts, tensions: oppRes.new_tensions
          }]);
        }
      } catch (e2) {
        setError(e2.message);
        setMessages(prev => [...prev, { role: 'error', content: e2.message }]);
      }
      setLoading(false);
    } catch (e) { setError(e.message); }
  };

  const retractProp = async (prop) => {
    if (loading) return;
    try {
      const res = await api(dxPath('/retract'), {
        method: 'POST', body: JSON.stringify({ proposition: prop })
      });
      setState(res.state);
      // Phase 2: notify opponent
      const followUp = `I retract: "${prop}".`;
      setMessages(prev => [...prev, { role: 'respondent', content: `I retract: "${prop}".` }]);
      setLoading(true);
      setError(null);
      try {
        const oppRes = await api(dxPath('/message'), {
          method: 'POST', body: JSON.stringify({ message: followUp })
        });
        setState(oppRes.state);
        if (oppRes.response) {
          setMessages(prev => [...prev, {
            role: 'opponent', content: oppRes.response,
            acts: oppRes.speech_acts, tensions: oppRes.new_tensions
          }]);
        }
      } catch (e2) {
        setError(e2.message);
        setMessages(prev => [...prev, { role: 'error', content: e2.message }]);
      }
      setLoading(false);
    } catch (e) { setError(e.message); }
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (view === 'positum') submitPositum();
      else sendMessage(input);
    }
  };

  // ── Settings modal (rendered in all views) ──
  const settingsModal = showSettings ? (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000,
    }} onClick={(e) => { if (e.target === e.currentTarget) setShowSettings(false); }}>
      <div style={{
        background: 'var(--surface)', border: '1px solid var(--border)',
        borderRadius: 10, padding: 28, width: 420, maxWidth: '90vw',
        maxHeight: '80vh', overflowY: 'auto',
      }}>
        {/* Header */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', textTransform: 'uppercase' }}>
            Settings
          </div>
          <button onClick={() => setShowSettings(false)} style={{
            background: 'none', border: 'none', color: 'var(--text-muted)',
            cursor: 'pointer', fontSize: fs(16), padding: '0 4px',
          }}>&times;</button>
        </div>

        {/* LLM section */}
        <div style={{ fontSize: fs(9), letterSpacing: 2, color: 'var(--text-dim)', marginBottom: 12, textTransform: 'uppercase' }}>
          LLM
        </div>

        <label style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>
          API KEY {settings.has_api_key && <span style={{ color: 'var(--commit)', fontSize: fs(9) }}>(set)</span>}
        </label>
        <input
          type="password"
          value={settingsForm.api_key}
          onChange={e => setSettingsForm(f => ({ ...f, api_key: e.target.value }))}
          placeholder={settings.has_api_key ? '••••••••  (leave blank to keep current)' : 'sk-ant-...'}
          style={{
            width: '100%', padding: '10px 12px', marginBottom: 6,
            background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 5,
            color: 'var(--text)', fontSize: fs(12), outline: 'none',
          }}
        />
        <div style={{
          fontSize: fs(9), lineHeight: 1.5, marginBottom: 14,
          color: settings.persistence_available ? 'var(--text-dim)' : 'var(--deny)',
        }}>
          {settings.persistence_available
            ? 'Stored encrypted at rest — survives restarts.'
            : 'In-memory only — set ELENCHUS_SECRET_KEY on the server to persist the key across restarts.'}
        </div>

        <label style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>
          API BASE URL
        </label>
        <input
          type="text"
          value={settingsForm.base_url}
          onChange={e => setSettingsForm(f => ({ ...f, base_url: e.target.value }))}
          placeholder="https://api.anthropic.com (default)"
          style={{
            width: '100%', padding: '10px 12px', marginBottom: 14,
            background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 5,
            color: 'var(--text)', fontSize: fs(12), outline: 'none',
          }}
        />

        <label style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>
          MODEL
        </label>
        <input
          type="text"
          value={settingsForm.model}
          onChange={e => setSettingsForm(f => ({ ...f, model: e.target.value }))}
          placeholder="claude-sonnet-4-20250514"
          style={{
            width: '100%', padding: '10px 12px', marginBottom: 20,
            background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 5,
            color: 'var(--text)', fontSize: fs(12), outline: 'none',
          }}
        />

        <button
          onClick={saveSettings}
          disabled={settingsSaving}
          style={{
            width: '100%', padding: '10px 0',
            background: settingsSaving ? 'var(--surface2)' : 'var(--accent)',
            border: 'none', borderRadius: 6, color: '#111',
            fontSize: fs(11), cursor: settingsSaving ? 'default' : 'pointer',
            letterSpacing: 1, fontWeight: 500,
            opacity: settingsSaving ? 0.5 : 1,
          }}
        >{settingsSaving ? 'SAVING...' : 'SAVE LLM SETTINGS'}</button>

        {/* Divider */}
        <div style={{ borderTop: '1px solid var(--border)', margin: '24px 0' }} />

        {/* Display section */}
        <div style={{ fontSize: fs(9), letterSpacing: 2, color: 'var(--text-dim)', marginBottom: 16, textTransform: 'uppercase' }}>
          Display
        </div>

        {/* Theme toggle */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', display: 'block', marginBottom: 6 }}>
            THEME
          </label>
          <div style={{ display: 'flex', borderRadius: 5, overflow: 'hidden', border: '1px solid var(--border)' }}>
            {['dark', 'light'].map(t => (
              <button key={t} onClick={() => setDisplayPrefs(p => ({ ...p, theme: t }))}
                style={{
                  flex: 1, padding: `${fs(6)}px ${fs(14)}px`, border: 'none', cursor: 'pointer',
                  background: displayPrefs.theme === t ? 'var(--accent)' : 'var(--surface2)',
                  color: displayPrefs.theme === t ? '#fff' : 'var(--text-dim)',
                  fontSize: fs(10), letterSpacing: 1, textTransform: 'uppercase',
                  fontFamily: 'var(--mono)',
                }}>{t}</button>
            ))}
          </div>
        </div>

        {/* Font size */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', display: 'block', marginBottom: 6 }}>
            FONT SIZE
          </label>
          <div style={{ display: 'flex', borderRadius: 5, overflow: 'hidden', border: '1px solid var(--border)' }}>
            {FONT_SCALES.map(sc => (
              <button key={sc.value} onClick={() => setDisplayPrefs(p => ({ ...p, fontScale: sc.value }))}
                style={{
                  flex: 1, padding: `${fs(6)}px 0`, border: 'none', cursor: 'pointer',
                  background: displayPrefs.fontScale === sc.value ? 'var(--accent)' : 'var(--surface2)',
                  color: displayPrefs.fontScale === sc.value ? '#fff' : 'var(--text-dim)',
                  fontSize: fs(10), letterSpacing: 1,
                  fontFamily: 'var(--mono)',
                }}>{sc.label}</button>
            ))}
          </div>
        </div>

        {/* Colors */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: fs(10), letterSpacing: 1, color: 'var(--text-muted)', display: 'block', marginBottom: 8 }}>
            COLORS
          </label>
          {[
            { key: 'commit', label: 'Commitments' },
            { key: 'deny', label: 'Denials' },
            { key: 'tension', label: 'Tensions' },
            { key: 'imp', label: 'Implications' },
            { key: 'opp', label: 'Opponent' },
          ].map(({ key, label }) => (
            <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <input type="color" value={displayPrefs.colors[key]}
                onChange={e => setDisplayPrefs(p => ({ ...p, colors: { ...p.colors, [key]: e.target.value } }))}
                style={{ width: 28, height: 28, border: '1px solid var(--border)', borderRadius: 4, padding: 1, cursor: 'pointer', background: 'var(--surface2)' }}
              />
              <span style={{ fontSize: fs(11), color: 'var(--text-dim)', fontFamily: 'var(--sans)' }}>{label}</span>
            </div>
          ))}
        </div>

        {/* Reset */}
        <button onClick={() => setDisplayPrefs(DEFAULT_DISPLAY)}
          style={{
            background: 'none', border: 'none', color: 'var(--text-muted)',
            cursor: 'pointer', fontSize: fs(10), textDecoration: 'underline',
            padding: 0, fontFamily: 'var(--mono)',
          }}>reset to defaults</button>
      </div>
    </div>
  ) : null;

  // ── Blinded judge interface ──
  // Judges have their own full-screen surface; they never see the
  // dialectic / home / admin chrome.
  if (actor?.kind === 'judge') {
    return <JudgeInterface fs={fs} logout={logout} />;
  }

  // ── Study flow (Sloan participants) ──
  // Full-screen states are intercepted here; tutorial/active fall
  // through to the regular dialogue view (with the study strip in
  // its header).
  if (isParticipant) {
    const sState = studySession?.state;
    if (!studySession) {
      return (
        <StudyShell fs={fs} title="No active session">
          <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(13), lineHeight: 1.8 }}>
            You don't have an active study session. If you arrived here from a
            study link, the session may have ended — please contact the
            researcher who sent you the link.
          </p>
        </StudyShell>
      );
    }
    if (sState === 'briefing') {
      return (
        <StudyShell fs={fs} title="Welcome to the study">
          <div style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(13), lineHeight: 1.8 }}>
            <p style={{ marginBottom: 12 }}>
              In this session you will be given a topic from your field and
              asked to write a short introduction to it — the kind a
              well-informed colleague would want to read before working in
              the area — while working with an AI. Two or three paragraphs,
              in your own words. There is nothing to prepare and no reference
              material: what we want on the page is what you actually believe
              about how the concepts fit together. The AI is a working
              partner, not a source; the finished text is yours.
            </p>
            <p style={{ marginBottom: 12 }}>The session has three parts:</p>
            <ol style={{ paddingLeft: 22, marginBottom: 12 }}>
              <li style={{ marginBottom: 6 }}><b>Tutorial</b> (~15 minutes) — practice with the interface on a warm-up topic.</li>
              <li style={{ marginBottom: 6 }}><b>Main task</b> (about {studySession.task_minutes || 60} minutes) — write your introduction in the panel on the right, beside your conversation with the AI. A clock shows your time; nothing is cut off, and you end the task yourself.</li>
              <li style={{ marginBottom: 6 }}><b>Questionnaires</b> (~10–15 minutes) — four short instruments about your experience.</li>
            </ol>
            <p style={{ marginBottom: 12 }}>
              Your work is recorded for research purposes. Your identity is
              held separately from the research data and is never published.
              You may stop at any time by closing this window and contacting
              the researcher.
            </p>
          </div>
          <button onClick={studyBeginTutorial} disabled={studyBusy} style={{
            width: '100%', padding: '12px 16px', marginTop: 12,
            background: 'var(--accent)', border: 'none', borderRadius: 6,
            color: '#111', fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
            cursor: studyBusy ? 'default' : 'pointer', opacity: studyBusy ? 0.5 : 1,
          }}>{studyBusy ? '…' : 'BEGIN TUTORIAL'}</button>
          {error && <StudyError fs={fs} message={error} />}
        </StudyShell>
      );
    }
    if (sState === 'post_session') {
      return (
        <StudyShell fs={fs} title="Main task complete">
          <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(13), lineHeight: 1.8, marginBottom: 12 }}>
            Thank you — the main task is finished and your text has been submitted.
            The last step is a short set of questionnaires about your
            experience (about 10–15 minutes).
          </p>
          <button onClick={() => studyAdvance('surveyed')} disabled={studyBusy} style={{
            width: '100%', padding: '12px 16px', marginTop: 12,
            background: 'var(--accent)', border: 'none', borderRadius: 6,
            color: '#111', fontSize: fs(12), letterSpacing: 1, fontWeight: 500,
            cursor: studyBusy ? 'default' : 'pointer', opacity: studyBusy ? 0.5 : 1,
          }}>{studyBusy ? '…' : 'CONTINUE TO QUESTIONNAIRES'}</button>
          {error && <StudyError fs={fs} message={error} />}
        </StudyShell>
      );
    }
    if (sState === 'surveyed') {
      return (
        <SurveyRunner
          fs={fs}
          sessionId={studySession.id}
          onDone={() => studyAdvance('complete')}
        />
      );
    }
    if (sState === 'complete' || sState === 'expired' || sState === 'interrupted') {
      return (
        <StudyShell fs={fs} title={sState === 'complete' ? 'All done — thank you!' : 'Session ended'}>
          <p style={{ color: 'var(--text-dim)', fontFamily: 'var(--sans)', fontSize: fs(13), lineHeight: 1.8 }}>
            {sState === 'complete'
              ? 'Your session is complete and everything has been recorded. You can close this window.'
              : 'This session has ended. Please contact the researcher if you have questions.'}
          </p>
        </StudyShell>
      );
    }
    // tutorial / active fall through to the dialogue view below —
    // but never to the home screen (participants must not create or
    // browse arbitrary dialectics). While the working base is still
    // loading, show a holding screen.
    if (view !== 'dialogue') {
      return (
        <StudyShell fs={fs} title={sState === 'tutorial' ? 'Loading tutorial…' : 'Loading session…'}>
          <p style={{ color: 'var(--text-muted)', fontFamily: 'var(--sans)', fontSize: fs(12) }}>
            One moment.
          </p>
          {error && <StudyError fs={fs} message={error} />}
        </StudyShell>
      );
    }
  }

  // ── Home ──
  // ── Admin Dashboard ──
  if (view === 'admin') {
    if (actor?.kind !== 'admin' && actor?.kind !== 'researcher') {
      // Defense in depth: only admins and researchers reach the
      // dashboard (researchers see its study tabs only); bounce home.
      setView('home');
      return null;
    }
    return <AdminDashboard fs={fs} actor={actor} onBack={() => setView('home')} />;
  }

  if (view === 'home') {
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {/* Top bar — account info + controls. Sits in document flow so
            it never overlaps the centered wordmark. */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
          gap: 8, padding: '12px 20px',
        }}>
          {actor && (
            <span title={actor.email || ''} style={{
              fontSize: fs(10), color: 'var(--text-muted)', fontFamily: 'var(--sans)',
            }}>
              {actor.display_name || actor.email}
              {actor.kind === 'admin' && (
                <span style={{ marginLeft: 4, color: 'var(--accent)' }}>·admin</span>
              )}
            </span>
          )}
          {actor && (actor.kind === 'admin' || actor.kind === 'researcher') && (
            <button
              onClick={() => setView('admin')}
              title={actor.kind === 'admin' ? 'Admin dashboard' : 'Study dashboard'}
              style={{
                background: 'none', border: '1px solid var(--accent)', borderRadius: 4,
                color: 'var(--accent)', cursor: 'pointer',
                fontSize: fs(10), padding: '2px 8px', lineHeight: 1.4,
                letterSpacing: 1, fontFamily: 'var(--mono)',
              }}
            >{actor.kind === 'admin' ? 'ADMIN' : 'STUDY'}</button>
          )}
          {actor && (
            <button
              onClick={logout}
              title="Sign out"
              style={{
                background: 'none', border: '1px solid var(--border)', borderRadius: 4,
                color: 'var(--text-muted)', cursor: 'pointer',
                fontSize: fs(10), padding: '2px 8px', lineHeight: 1.4,
                letterSpacing: 1, fontFamily: 'var(--mono)',
              }}
            >SIGN OUT</button>
          )}
          <button
            onClick={openSettingsPanel}
            title="Settings"
            style={{
              background: 'none', border: 'none', color: 'var(--text-muted)',
              cursor: 'pointer', fontSize: fs(18), padding: 4, lineHeight: 1,
            }}
          >&#9881;</button>
        </div>

        {/* Centered card */}
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ maxWidth: 560, width: '100%', padding: '0 48px 48px' }}>
          <div style={{ textAlign: 'center', marginBottom: 48 }}>
            <div style={{ fontSize: fs(11), letterSpacing: 8, color: 'var(--text-muted)', marginBottom: 16 }}>
              ἜΛΕΓΧΟΣ
            </div>
            <h1 style={{ fontSize: fs(32), fontWeight: 300, letterSpacing: -1, marginBottom: 8 }}>
              Elenchus
            </h1>
            <p style={{ color: 'var(--text-dim)', fontSize: fs(13), fontFamily: 'var(--sans)', lineHeight: 1.8 }}>
              Develop bilateral positions through prover-skeptic dialogue.
            </p>
          </div>

          {settingsModal}

          {/* New dialectic */}
          <div style={{ marginBottom: 32 }}>
            <label style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', display: 'block', marginBottom: 8 }}>
              NEW DIALECTIC
            </label>
            <div style={{ display: 'flex', gap: 8 }}>
              <input
                value={newName}
                onChange={e => setNewName(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') createDialectic(); }}
                placeholder="Topic of inquiry..."
                style={{
                  flex: 1, padding: '12px 14px', background: 'var(--surface)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  color: 'var(--text)', fontSize: fs(13), outline: 'none',
                  fontFamily: 'var(--sans)',
                }}
                autoFocus
              />
              <button
                onClick={createDialectic}
                disabled={!newName.trim()}
                style={{
                  padding: '12px 20px', background: newName.trim() ? 'var(--accent)' : 'var(--surface)',
                  border: 'none', borderRadius: 6, color: '#111',
                  fontSize: fs(12), cursor: newName.trim() ? 'pointer' : 'default',
                  letterSpacing: 1, fontWeight: 500,
                  opacity: newName.trim() ? 1 : 0.3,
                }}
              >BEGIN</button>
            </div>
          </div>

          {/* Existing dialectics */}
          {dialectics.length > 0 && (
            <div>
              <label style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', display: 'block', marginBottom: 8 }}>
                RESUME
              </label>
              {dialectics.map(d => (
                <div key={d.name} style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  padding: '10px 14px', marginBottom: 4, borderRadius: 6,
                  background: 'var(--surface)', border: '1px solid var(--border)',
                  cursor: 'pointer',
                }} onClick={() => openDialectic(d.name, d.session_id)}>
                  <div>
                    <div style={{ fontSize: fs(13), fontFamily: 'var(--sans)', marginBottom: 2 }}>{d.topic}</div>
                    <div style={{ fontSize: fs(10), color: 'var(--text-muted)' }}>
                      C:{d.commitments} · D:{d.denials} · T:{d.tensions} · I:{d.implications}
                    </div>
                  </div>
                  <button onClick={e => { e.stopPropagation(); deleteDialectic(d.name, d.session_id); }}
                    style={{ background: 'none', border: 'none', color: 'var(--text-muted)',
                             cursor: 'pointer', fontSize: fs(11), padding: '4px 8px' }}>×</button>
                </div>
              ))}
            </div>
          )}

          {error && (
            <div style={{ marginTop: 16, padding: 12, borderRadius: 6,
                          background: '#ef444420', border: '1px solid #ef444440',
                          color: '#ef4444', fontSize: fs(12), fontFamily: 'var(--sans)' }}>
              {error}
            </div>
          )}
          <PartnerStrip style={{ marginTop: 56 }} />
        </div>
        </div>
      </div>
    );
  }

  // ── Positum ──
  if (view === 'positum') {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ maxWidth: 620, width: '100%', padding: 48 }}>
          <div style={{ fontSize: fs(10), letterSpacing: 2, color: 'var(--text-muted)', marginBottom: 8 }}>
            POSITUM · {current}
          </div>
          <p style={{
            color: 'var(--text-dim)', fontSize: fs(14), fontFamily: 'var(--sans)',
            lineHeight: 1.8, marginBottom: 24,
          }}>
            State your initial position in your own words. The opponent will extract
            commitments and begin the dialectic.
          </p>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && e.metaKey) submitPositum(); }}
            placeholder="State your position..."
            rows={8}
            style={{
              width: '100%', padding: 16, background: 'var(--surface)',
              border: '1px solid var(--border)', borderRadius: 6,
              color: 'var(--text)', fontSize: fs(14), outline: 'none', resize: 'vertical',
              fontFamily: 'var(--sans)', lineHeight: 1.7,
            }}
          />
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12 }}>
            <span style={{ color: 'var(--text-muted)', fontSize: fs(11) }}>⌘+Enter to submit</span>
            <button
              onClick={submitPositum}
              disabled={!input.trim() || loading}
              style={{
                padding: '10px 24px',
                background: input.trim() && !loading ? 'var(--accent)' : 'var(--surface)',
                border: 'none', borderRadius: 6, color: '#111',
                fontSize: fs(12), cursor: input.trim() ? 'pointer' : 'default',
                letterSpacing: 1, opacity: input.trim() && !loading ? 1 : 0.3,
              }}
            >{loading ? 'THINKING...' : 'SUBMIT POSITUM'}</button>
          </div>
          {settingsModal}
        </div>
      </div>
    );
  }

  // ── Dialogue ──
  const s = state || { commitments: [], denials: [], tensions: [], queued_tensions: [], implications: [], retracted: [], contested: [], atom_ids: {} };
  const queuedTensions = s.queued_tensions || [];
  const openTensionCount = s.tensions.length + queuedTensions.length;
  const leftCount = s.commitments.length + s.denials.length;
  const rightCount = openTensionCount + s.implications.length;

  // Participants write their text beside the dialogue, in the tutorial
  // (to practise) and in the main task.
  const showWritingPane = isParticipant &&
    (studySession?.state === 'tutorial' || studySession?.state === 'active');

  // Build grid template: omit hidden columns and their drag handles.
  const gridCols = [
    leftVisible ? `${leftWidth}px` : null,
    leftVisible ? '4px' : null,
    '1fr',
    rightVisible ? '4px' : null,
    rightVisible ? `${rightWidth}px` : null,
    showWritingPane ? '1px' : null,
    showWritingPane ? 'minmax(340px, 40%)' : null,
  ].filter(Boolean).join(' ');

  return (
    <div style={{ height: '100%', display: 'grid', gridTemplateColumns: gridCols, gridTemplateRows: 'auto 1fr auto' }}>
      {/* Header */}
      <div style={{
        gridColumn: '1 / -1', padding: '10px 20px',
        borderBottom: '1px solid var(--border)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
          <span style={{ fontSize: fs(13), fontWeight: 500, color: 'var(--opp)',
                         cursor: isParticipant ? 'default' : 'pointer' }}
                onClick={() => {
                  if (isParticipant) return; // participants stay in the flow
                  setCurrent(null); setCurrentSessionId(null); setState(null); setView('home');
                }}>Elenchus</span>
          <span style={{ color: 'var(--text-dim)', fontSize: fs(11), fontFamily: 'var(--sans)' }}>{s.name || current}</span>
          {isParticipant && studySession?.state === 'tutorial' && (
            <span style={{
              fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)',
              color: 'var(--tension)', border: '1px solid var(--tension-border)',
              background: 'var(--tension-bg)', borderRadius: 4, padding: '2px 8px',
            }}>TUTORIAL — PRACTICE TOPIC</span>
          )}
          {isParticipant && studySession?.state === 'active' && (
            <span style={{
              fontSize: fs(10), letterSpacing: 1, fontFamily: 'var(--mono)',
              color: 'var(--commit)', border: '1px solid var(--commit-border)',
              background: 'var(--commit-bg)', borderRadius: 4, padding: '2px 8px',
            }}>MAIN TASK</span>
          )}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {isParticipant && studySession?.state === 'tutorial' && (
            <button onClick={studyBeginTask} disabled={studyBusy} style={{
              background: 'var(--accent)', border: 'none', borderRadius: 4,
              color: '#111', cursor: studyBusy ? 'default' : 'pointer',
              fontSize: fs(10), padding: '3px 10px', lineHeight: 1.4,
